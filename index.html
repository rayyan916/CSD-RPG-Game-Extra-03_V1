function renderWelcome(){const prev=readLocal();return `<section class="hero"><div><div class="eyebrow">山海之外 · 萬兵歸宗</div><h1>公民山海經<span class="hero-title">歸墟兵器煉成</span></h1><p>攜你的修行而來，以所學淬鍊神兵。<br>通過守界人的十問，再踏入六座兵器熔爐。</p><div class="chips"><span class="chip">六卷全新題庫</span><span class="chip">十階異獸神兵</span><span class="chip">成果帶回原版</span></div></div><div class="hero-art">${portalSVG()}<div class="art-caption">以知為火　以志為刃</div></div></section>${prev?`<section class="panel highlight" style="margin-bottom:20px"><div class="actions"><div style="flex:1"><strong class="gold">歸墟已有你的足跡</strong><div class="small muted">${esc(prev.save.player.name)}・${prev.save.customExtensions.guixuForge.gate.completed?'已通過守界試煉':'守界試煉進行中'}・${esc(new Date(prev.save.updatedAt).toLocaleString('zh-HK'))}</div></div><button class="btn secondary" data-action="resume">繼續歸墟進度</button></div></section>`:''}<section class="entry-grid"><div class="panel highlight"><div class="eyebrow">01 ／ 攜修為入境</div><h3>匯入《香江風雲錄》進度</h3><p class="small muted">保留原有能力、異獸、裝備與學習進度。離開時，把煉成的成果一併帶回。</p><button class="btn primary full" data-action="import">選擇進度檔案或貼上代碼 <span aria-hidden="true">↗</span></button></div><div class="panel"><div class="eyebrow">02 ／ 初入山海</div><h3>沒有原版進度？</h3><label class="field" for="new-name">你的俠名</label><div class="inline-form"><input class="input" id="new-name" maxlength="30" placeholder="輸入名字" autocomplete="off"><button class="btn secondary" data-action="new">進入歸墟</button></div><p class="small muted" style="margin:12px 0 0">從基礎能力開始，成果同樣可以匯入原版。</p></div></section><section class="step-strip"><div class="step"><span class="step-num">壹</span><strong>守界十問</strong><p>六卷混合10題。答對選雙倍秘笈，答錯承受能力削減。</p></div><div class="step"><span class="step-num">貳</span><strong>三十問淬兵</strong><p>選一卷，隨機30題。答對越多，兵器品階越高。</p></div><div class="step"><span class="step-num">參</span><strong>攜神兵歸來</strong><p>裝備異獸神兵，匯出完整進度，返回原版繼續修行。</p></div></section>`;}
function effectiveStats(){const p=state.player,out={maxHp:p.maxHp,maxMp:p.maxMp,atk:p.atk,def:p.def,eva:p.eva,ultMult:p.ultMult};for(const w of [p.equipment.weapon,p.equipment.armor,p.equipment.accessory].filter(Boolean)){for(const [a,b] of [['maxHp','hpBonus'],['maxMp','mpBonus'],['atk','atkBonus'],['def','defBonus'],['eva','evaBonus'],['ultMult','ultBonus']])out[a]+=(w[b]||0);}out.eva=Math.min(75,out.eva);return out;}
function statsStrip(){const s=effectiveStats();return `<div class="stat-strip">${Object.keys(STAT_LABELS).map(k=>`<div class="stat"><span>${STAT_LABELS[k]}${k==='ultMult'?'倍率':''}</span><strong>${Number(s[k].toFixed(2)).toLocaleString('zh-HK')}${['eva','ultMult'].includes(k)?'%':''}</strong></div>`).join('')}</div>`;}
function renderHub(){const g=gx(),w=state.player.equipment.weapon;return `<section class="section-top"><div><div class="eyebrow">歸墟鑄兵臺 ／ 六卷試煉</div><h2>${esc(state.player.name)}，以學識淬鍊神兵</h2><p class="muted">選擇一卷，完成30道不重複的題目，煉出屬於你的兵器。</p></div><button class="btn small" data-action="save-dialog">儲存／匯出進度 ↗</button></section>${statsStrip()}${g.run?`<div class="panel highlight" style="margin-bottom:22px"><div class="actions"><div style="flex:1"><strong class="gold">${esc(WEAPONS[g.run.topic].name)}正在熔煉</strong><div class="small muted">已完成 ${g.run.index}／30題・答對 ${g.run.correct}題</div></div><button class="btn primary" data-action="continue-run">繼續煉成</button></div></div>`:''}<div class="note" style="margin-bottom:22px">${w?`目前裝備：${esc(w.name||'未命名兵器')}。`:'目前未裝備兵器。'} 每答對3題提升1階（向上取整），30題全對即10階；全錯不獲兵器。可重複挑戰，已獲兵器會保留在背包。</div><section class="grid3">${WEAPONS.slice(1).map((w,i)=>{const t=i+1,best=Math.max(0,...g.forgeResults.filter(r=>r.topic===t).map(r=>r.tier));return `<article class="panel forge-card"><div class="weapon-icon">${weaponSVG(w.symbol)}</div><div class="eyebrow">卷 ${String(t).padStart(2,'0')} ／ ${w.type}</div><h3>${w.name}</h3><p>${TOPICS[t]}</p><div class="card-foot"><div class="small muted">隨機30題 <span class="gold">◇</span> ${best?'最高 '+best+'階':'尚未煉成'}</div><button class="btn full" data-action="start-forge" data-topic="${t}">開始煉成 <span aria-hidden="true">→</span></button></div></article>`;}).join('')}</section><p class="notice">兵器自帶一種原版異獸神通，不會讓角色永久吞噬異獸。裝備時生效，卸下時移除；與已吞噬的同類神通取較高階。</p>`;}
function gateQueue(g){let base=[];for(let t=1;t<=6;t++)base.push(shuffle(QUESTIONS.filter(q=>q.topic===t),g.seed+t)[0]);const used=new Set(base.map(q=>q.id));base.push(...shuffle(QUESTIONS.filter(q=>!used.has(q.id)),g.seed+99).slice(0,4));return shuffle(base,g.seed+777);}
function runQueue(r){return shuffle(QUESTIONS.filter(q=>q.topic===r.topic),r.seed).slice(0,30);}
function currentQuestion(){if(!gx().gate.completed)return gateQueue(gx().gate)[gx().gate.index];if(gx().run)return runQueue(gx().run)[gx().run.index];return null;}
function quizInfo(){const g=gx();return !g.gate.completed?{type:'gate',index:g.gate.index,total:10,correct:g.gate.correct,title:'歸墟守界試煉',subtitle:'六卷混合・十問入境'}:{type:'forge',index:g.run?.index||0,total:30,correct:g.run?.correct||0,title:g.run?WEAPONS[g.run.topic].name:'兵器試煉',subtitle:g.run?TOPICS[g.run.topic]:''};}
function renderQuiz(){const info=quizInfo(),q=local.feedback?QUESTIONS.find(q=>q.id===local.feedback.id):currentQuestion();if(!q)return `<div class="panel empty"><h2>守界十問已完成</h2><button class="btn primary" data-action="next">進入鑄兵臺</button></div>`;const f=local.feedback;return `<div class="section-top"><div><div class="eyebrow">${info.subtitle}</div><h2>${info.title}</h2></div>${gx().gate.completed?'<button class="btn small" data-action="hub">暫存並返回主城</button>':'<button class="btn small" data-action="save-dialog">儲存／匯出</button>'}</div><section class="quiz-layout"><aside class="panel guardian">${guardianSVG()}<div><div class="eyebrow">歸墟守界人</div><h3>${info.type==='gate'?'所學，即你的力量':'以知識作火，鑄一柄好兵'}</h3><p>${info.type==='gate'?'答對可從三本隨機秘笈中選一本。答錯會隨機削減一項能力。':'完成30問，方可結算兵器。答錯不扣能力，但會影響兵器品階。'}</p></div></aside><div class="panel quiz-main"><div class="progress" aria-label="作答進度"><span style="width:${info.index/info.total*100}%"></span></div><div class="quiz-meta"><span>第 ${f?info.index:info.index+1}／${info.total} 問 <span class="gold">◇</span> 已答對 ${info.correct}</span><span>導學案 ${String(q.topic).padStart(2,'0')}</span></div><div class="small muted" style="margin-bottom:10px">${esc(q.category)}</div><h3 class="question">${esc(q.q)}</h3><div class="options">${q.options.map((o,i)=>`<button class="option ${f&&(i===q.answer)?'correct':f&&i===f.selected?'wrong':''}" data-action="answer" data-index="${i}" ${f?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span>${f&&i===q.answer?'<span class="jade" aria-label="正確答案">✓</span>':''}</button>`).join('')}</div>${f?`<div class="feedback ${f.correct?'':'wrong'}" role="status"><strong class="${f.correct?'jade':'red'}">${f.correct?'答對了':'答錯了'}・正確答案 ${'ABCD'[q.answer]}</strong><p>${esc(q.explanation)}</p>${f.penalty?`<p class="red small">守界懲戒：${esc(f.penalty)}</p>`:''}${f.reward?`<p class="gold small">已獲秘笈：${esc(f.reward)}</p>`:''}</div><button class="btn primary full" data-action="${gx().gate.pending?'reward-modal':'next'}">${gx().gate.pending?'選擇雙倍秘笈':info.index===info.total?(info.type==='gate'?'完成十問・進入鑄兵臺':'查看煉成成果'):'下一問 →'}</button>`:'<p class="small muted">選擇答案後顯示解說，再按「下一問」繼續。</p>'}</div></section>`;}
function applyManual(id){const m=MANUALS.find(x=>x.id===id),p=state.player,before=p[m.key];if(id==='eva'){p.eva=Math.max(before,Math.min(65,before+8));p.atk+=16;}else{p[m.key]+=m.gain;if(id==='hp')p.hp=Math.min(p.maxHp,p.hp+280);if(id==='mp')p.mp=Math.min(p.maxMp,p.mp+90);}return m.label+' +'+(p[m.key]-before)+m.unit+(id==='eva'?'；攻擊 +16（閃避上限65%，不降低原有較高數值）':'');}
function penalize(){const choices=MANUALS.filter(m=>state.player[m.key]>m.floor);if(!choices.length)return '能力已達保護下限，免除本次削減';const m=choices[Math.floor(Math.random()*choices.length)],p=state.player,before=p[m.key];p[m.key]=Math.max(m.floor,before-m.loss);if(m.id==='hp')p.hp=Math.min(p.hp,p.maxHp);if(m.id==='mp')p.mp=Math.min(p.mp,p.maxMp);return m.label+' −'+(before-p[m.key])+m.unit;}
function answer(i){if(local.feedback||gx().gate.pending)return;const q=currentQuestion();if(!q||!Number.isInteger(i)||i<0||i>3)return;const ok=i===q.answer,gate=!gx().gate.completed,r=gate?gx().gate:gx().run;r.index++;if(ok)r.correct++;local.records.push({id:q.id,selected:i,correct:ok,time:new Date().toISOString(),mode:gate?'守界十問':'兵器煉成'});local.feedback={id:q.id,selected:i,correct:ok,penalty:null,reward:null};if(gate){if(ok)gx().gate.pending={id:uid(),choices:shuffle(MANUALS,seed()).slice(0,3).map(m=>m.id)};else local.feedback.penalty=penalize();}if(!gate&&r.index===30)finishForge();save();render('quiz');}
function rewardModal(){const p=gx().gate.pending;if(!p)return;showModal(`<div class="eyebrow">守界人賜卷 ／ 原版兩倍增幅</div><h2>選擇一本秘笈</h2><p class="muted small">獎勵只可領取一次，重新整理後仍會保留待領選項。</p><div class="reward-grid">${p.choices.map(id=>{const m=MANUALS.find(m=>m.id===id);return `<button class="reward-choice" data-action="claim-manual" data-id="${id}"><span>${m.label}</span><strong>+${m.gain}${m.unit}</strong><span>${m.name}${id==='eva'?'；另加16攻擊，閃避上限65%':''}</span></button>`;}).join('')}</div>`,true);}
function claimManual(id){const p=gx().gate.pending;if(!p||!p.choices.includes(id))return;const msg=applyManual(id);gx().gate.pending=null;if(local.feedback)local.feedback.reward=msg;save();$('modal').dataset.locked='no';$('modal').close();render('quiz');toast(msg);}
function nextQuestion(){if(gx().gate.pending){rewardModal();return;}window.scrollTo({top:0,behavior:'instant'});local.feedback=null;if(!gx().gate.completed&&gx().gate.index>=10){gx().gate.completed=true;save();render('hub');toast('守界十問已完成，六座兵器熔爐已開啟。');return;}if(local.result){save();render('result');return;}save();render(!gx().gate.completed||gx().run?'quiz':'hub');}
function startForge(topic){if(!gx().gate.completed)return;if(gx().run){toast('你已有一柄兵器正在煉成，請先完成或暫存該試煉。');render('quiz');return;}gx().run={id:uid(),topic,seed:seed(),index:0,correct:0};local.feedback=null;local.result=null;save();render('quiz');}
function makeWeapon(topic,tier,id,beastKey){const w=WEAPONS[topic];return {id:'guixu-weapon-'+id,name:w.name+'・'+tier+'階',type:'weapon',slot:'weapon',source:'guixu-forge',topic,tier,hpBonus:w.hpBonus*tier,mpBonus:10*tier,atkBonus:w.atkBonus*tier,defBonus:w.defBonus*tier,evaBonus:0,ultBonus:5*tier,beastSkill:{key:beastKey,name:BEASTS[beastKey][0],level:tier,effect:BEASTS[beastKey][1]},createdAt:new Date().toISOString()};}
function finishForge(){const r=gx().run;if(!r||r.index!==30)return;const tier=Math.ceil(r.correct/3),beastKey=Object.keys(BEASTS)[r.seed%20];const w=tier?makeWeapon(r.topic,tier,r.id,beastKey):null;const result={id:r.id,topic:r.topic,correct:r.correct,total:30,tier,weaponId:w?.id||null,time:new Date().toISOString()};if(!gx().forgeResults.some(x=>x.id===r.id)){if(w&&!state.player.equipment.inventory.some(x=>x.id===w.id))state.player.equipment.inventory.push(w);gx().forgeResults.push(result);}gx().lastReward=result;local.result=result;/* Keep the completed run until the explanation is acknowledged. */}
function finalizeRun(){if(gx().run?.index===30)gx().run=null;}
function bonusText(w){const labels={hpBonus:'生命',mpBonus:'內力',atkBonus:'攻擊',defBonus:'防禦',evaBonus:'閃避',ultBonus:'必殺倍率'};return Object.entries(labels).filter(([k])=>w[k]).map(([k,v])=>v+' +'+w[k]+(['evaBonus','ultBonus'].includes(k)?'%':'')).join(' ／ ')||'沒有數值加成';}
function skillText(w){const sk=w?.beastSkill;return sk?`${BEASTS[sk.key]?.[0]||sk.name}・${sk.level}階：${BEASTS[sk.key]?.[1]||sk.effect}`:'沒有附帶異獸神通';}
function renderResult(){const r=local.result||gx().lastReward;if(!r)return renderHub();const w=state.player.equipment.inventory.find(w=>w.id===r.weaponId);return `<section class="panel highlight result"><div class="eyebrow">${r.tier?'兵成・靈獸附刃':'爐火未成・再接再厲'}</div><div class="weapon-icon">${weaponSVG(WEAPONS[r.topic].symbol)}</div><div class="rank">${r.tier?r.tier+' 階':'未煉成'}</div><h2>${esc(WEAPONS[r.topic].name)}</h2><p>${TOPICS[r.topic]}<br>30題中答對 <strong class="gold">${r.correct}</strong> 題</p>${w?`<div class="panel" style="margin:22px 0"><div class="tag">${esc(skillText(w))}</div><p class="small" style="margin:14px 0 0">${esc(bonusText(w))}</p></div><p class="small muted">兵器已存入背包。裝備後才會提供加成，不會永久吞噬異獸。</p><div class="actions"><button class="btn primary" data-action="equip" data-id="${esc(w.id)}">立即裝備</button><button class="btn" data-action="inventory">查看背包</button><button class="btn" data-action="hub">返回鑄兵臺</button></div>`:'<p>本次未答對題目，沒有獲得兵器；能力及原有裝備不受影響。</p><button class="btn primary" data-action="hub">返回鑄兵臺再挑戰</button>'}</section>`;}
function equip(id){const w=state.player.equipment.inventory.find(w=>w.id===id);if(!w||w.source!=='guixu-forge')return;const old=state.player.equipment.weapon;if(old&&old.id!==w.id&&!state.player.equipment.inventory.some(x=>old.id?x.id===old.id:JSON.stringify(x)===JSON.stringify(old)))state.player.equipment.inventory.push(clone(old));state.player.equipment.weapon=clone(w);save();render(page==='result'?'result':'inventory');toast('已裝備 '+w.name+'；同類神通取較高階。');}
function unequip(){const old=state.player.equipment.weapon;if(old&&!state.player.equipment.inventory.some(x=>old.id?x.id===old.id:JSON.stringify(x)===JSON.stringify(old)))state.player.equipment.inventory.push(clone(old));state.player.equipment.weapon=null;save();render('inventory');toast('已卸下兵器；兵器仍保留於背包。');}
function renderInventory(){const eq=state.player.equipment;return `<div class="section-top"><div><div class="eyebrow">神兵有主 ／ 裝備與背包</div><h2>你的兵器藏閣</h2></div><button class="btn small" data-action="save-dialog">匯出成果 ↗</button></div>${statsStrip()}<div class="panel highlight" style="margin-bottom:22px"><div class="eyebrow">目前裝備</div><h3 class="gold">${esc(eq.weapon?.name||'尚未裝備兵器')}</h3>${eq.weapon?`<p class="small muted">${esc(bonusText(eq.weapon))}</p><p class="small jade">${esc(skillText(eq.weapon))}</p><button class="btn small" data-action="unequip">卸下兵器</button>`:''}<div class="small muted" style="margin-top:14px">防具：${esc(eq.armor?.name||'未裝備')} ／ 飾物：${esc(eq.accessory?.name||'未裝備')}</div></div><div class="note" style="margin-bottom:20px">同時裝備一把兵器，替換不會銷毀舊兵器。帶回原版後，請使用附上的「支援歸墟兵器」相容版，才能施展兵器神通。</div><div class="inventory-grid">${eq.inventory.length?eq.inventory.map(w=>`<article class="panel inventory-item"><div class="small muted">${w.source==='guixu-forge'?'歸墟煉成・'+w.tier+'階':'原版／其他裝備'}</div><h3>${esc(w.name||'未命名物品')}</h3><p class="small muted">${esc(bonusText(w))}</p><p class="small jade">${esc(skillText(w))}</p>${w.source==='guixu-forge'?`<button class="btn small ${eq.weapon?.id===w.id?'secondary':''}" data-action="equip" data-id="${esc(w.id)}" ${eq.weapon?.id===w.id?'disabled':''}>${eq.weapon?.id===w.id?'已裝備':'裝備此兵器'}</button>`:'<span class="small muted">原有物品完整保留</span>'}</article>`).join(''):'<div class="panel empty">背包尚無兵器，完成一次30問試煉便有機會煉成。</div>'}</div>`;}
function statsModal(){const p=state.player,s=effectiveStats(),b=local.baseline||p;showModal(`<div class="dialog-head"><h2>角色戰力與異獸</h2><button class="close" data-action="close-modal" aria-label="關閉">×</button></div><p class="muted">${esc(p.name)}・裝備加成與永久能力分開計算</p><div class="scroll-x"><table><thead><tr><th>能力</th><th>基礎數值</th><th>含裝備</th><th>本次永久變化</th></tr></thead><tbody>${Object.keys(STAT_LABELS).map(k=>`<tr><td>${STAT_LABELS[k]}</td><td>${p[k]}</td><td>${s[k]}</td><td>${p[k]-(b[k]||0)>=0?'+':''}${Number((p[k]-(b[k]||0)).toFixed(2))}</td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:22px">已吞噬異獸</h3><div class="chips">${Object.entries(p.beasts).filter(([k,v])=>v>0).map(([k,v])=>`<span class="chip">${esc(BEASTS[k]?.[0]||k)} ${v}階</span>`).join('')||'<span class="muted">尚未吞噬異獸</span>'}</div><h3 style="margin-top:22px">兵器附帶神通</h3><p class="jade">${esc(skillText(p.equipment.weapon))}</p><p class="small muted">兵器神通不寫入已吞噬異獸。同類取較高階，不相加；卸下即移除兵器提供的神通。</p>`);}
function studyOptions(t){return `<option value="0">全部六卷</option>${TOPICS.slice(1).map((x,i)=>`<option value="${i+1}" ${Number(t)===i+1?'selected':''}>${String(i+1).padStart(2,'0')} ${x}</option>`).join('')}`;}
function studyItem(q,record){return `<details class="panel study-item"><summary><span class="gold small">卷${q.topic}・${String(q.num).padStart(2,'0')}</span> ${esc(q.q)} ${record?`<span class="${record.correct?'jade':'red'}">${record.correct?'✓ 答對':'✕ 答錯'}</span>`:''}</summary><ol type="A" class="study-opts">${q.options.map((x,i)=>`<li class="${i===q.answer?'correct':''}">${esc(x)}${i===q.answer?' ✓':''}${record&&record.selected===i?'（你的選擇）':''}</li>`).join('')}</ol><p class="small muted">${esc(q.explanation)}</p>${record?`<div class="small muted">${record.mode}・${esc(new Date(record.time).toLocaleString('zh-HK'))}</div>`:''}</details>`;}
function renderStudy(){const qs=QUESTIONS.filter(q=>(!studyTopic||q.topic===studyTopic)&&(!studySearch||(q.q+q.explanation).includes(studySearch)));const pages=Math.max(1,Math.ceil(qs.length/10));studyPage=Math.max(1,Math.min(studyPage,pages));return `<div class="section-top"><div><div class="eyebrow">六卷藏書 ／ 隨時溫習</div><h2>歸墟知識卷宗</h2><p class="muted">共480題。展開題目即可查看答案與解說。</p></div></div><div class="filters"><select class="input" id="study-topic" aria-label="選擇溫習課題">${studyOptions(studyTopic)}</select><input class="input" id="study-search" aria-label="搜尋題目" placeholder="搜尋題目或解說" value="${esc(studySearch)}"><button class="btn small" data-action="study-filter">搜尋</button></div><div class="small muted" style="margin-bottom:16px">找到 ${qs.length} 題</div>${qs.slice((studyPage-1)*10,studyPage*10).map(q=>studyItem(q)).join('')||'<div class="panel empty">沒有符合的題目。</div>'}<div class="pagination"><button class="btn small" data-action="study-prev" ${studyPage===1?'disabled':''}>上一頁</button><span class="small muted">${studyPage}／${pages}</span><button class="btn small" data-action="study-next" ${studyPage===pages?'disabled':''}>下一頁</button></div>`;}
function renderRecords(){const rows=[...local.records].reverse().filter(r=>{const q=QUESTIONS.find(q=>q.id===r.id);return q&&(!recordTopic||q.topic===recordTopic)&&(recordMode==='all'||(recordMode==='correct'&&r.correct)||(recordMode==='wrong'&&!r.correct));});const unique=new Set(local.records.filter(r=>r.correct).map(r=>r.id)).size;return `<div class="section-top"><div><div class="eyebrow">知過而進 ／ 本機答題紀錄</div><h2>你在歸墟學到的事</h2><p class="muted">本機累計作答 ${local.records.length} 次・答對不同題目 ${unique} 題</p></div></div><div class="note" style="margin-bottom:20px">這裡的答題紀錄只保存在本裝置，供你檢視與溫習；匯出檔案不包含這些紀錄，也不會改動原版的已答對題目。</div><div class="filters"><select class="input" id="record-topic" aria-label="篩選紀錄課題">${studyOptions(recordTopic)}</select><select class="input" id="record-mode" aria-label="篩選作答結果"><option value="all">全部結果</option><option value="correct" ${recordMode==='correct'?'selected':''}>已答對</option><option value="wrong" ${recordMode==='wrong'?'selected':''}>答錯待重溫</option></select><button class="btn small" data-action="record-filter">篩選</button></div>${rows.slice(0,100).map(r=>studyItem(QUESTIONS.find(q=>q.id===r.id),r)).join('')||'<div class="panel empty">暫時沒有符合的作答紀錄。</div>'}${rows.length>100?'<p class="small muted">顯示最近100次作答，請用課題篩選查看。</p>':''}`;}
function portableSave(){if(!state)throw Error('請先建立或匯入角色。');const out=clone(state);out.updatedAt=new Date().toISOString();/* Local answer history is deliberately outside this save. */if(out.customExtensions.guixuForge.run?.index===30)out.customExtensions.guixuForge.run=null;return out;}
function download(){save();const out=portableSave(),blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');const name=state.player.name.replace(/[^a-zA-Z0-9\u3400-\u9fff_-]/g,'_');a.href=url;a.download=`公民山海經_歸墟成果_${name}_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下載完整進度，請返回原版匯入。');}
function encodeSave(s){return btoa(encodeURIComponent(JSON.stringify(s)));}
function decodeSave(s){const t=s.trim().replace(/^\uFEFF/,'');if(t.length>12*1024*1024)throw Error('進度檔過大，請確認檔案。');return safeParse(t.startsWith('{')?t:decodeURIComponent(atob(t)));}
async function copyCode(){const code=encodeSave(portableSave());try{await navigator.clipboard.writeText(code);toast('進度代碼已複製。');}catch(e){$('export-code').value=code;$('export-code').classList.remove('hidden');$('export-code').select();toast('請手動複製下方進度代碼。');}}
function importDialog(){showModal(`<div class="dialog-head"><h2>匯入修行進度</h2><button class="close" data-action="close-modal" aria-label="關閉">×</button></div><p class="muted small">支援《香江風雲錄》的JSON進度檔與進度代碼，也可繼續其他裝置的歸墟成果。</p><label class="field">選擇進度檔案<input type="file" class="input" id="import-file" accept=".json,application/json"></label><div class="divider"></div><label class="field">或貼上進度代碼／JSON<textarea class="input" id="import-text" placeholder="貼上完整代碼"></textarea></label><button class="btn primary full" data-action="import-text">讀取進度</button><p id="import-error" class="red small" role="alert"></p>`);$('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024){$('import-error').textContent='檔案超過12MB，請確認是否選對進度檔。';return;}try{await receiveImport(await f.text());}catch(e){$('import-error').textContent=e.message;}};}
async function receiveImport(text){try{const s=decodeSave(text),out=normalize(s);if(out.customExtensions.guixuForge)validateExtension(out.customExtensions.guixuForge);const done=()=>{installSave(out);toast('已匯入 '+out.player.name+' 的角色與原版學習進度。');};closeModal();confirmReplace(done);}catch(e){if($('import-error'))$('import-error').textContent='匯入失敗：'+e.message;else toast('匯入失敗：'+e.message);}}
function saveDialog(){if(!state){importDialog();return;}save();showModal(`<div class="dialog-head"><h2>儲存與攜成果歸來</h2><button class="close" data-action="close-modal" aria-label="關閉">×</button></div><p class="muted">${esc(state.player.name)} 的能力、裝備及試煉進度已嘗試儲存於本機。</p><div class="panel"><h3 class="gold">下載完整成果</h3><p class="small muted">保留原版學習進度，帶回永久能力變化與兵器獎勵。不匯出歸墟答題紀錄。重複匯入同一存檔是載入相同數值，不會再次疊加獎勵。</p><div class="actions"><button class="btn primary" data-action="download">下載進度檔 .json</button><button class="btn" data-action="copy-code">複製進度代碼</button></div><textarea id="export-code" class="input download-code hidden" readonly aria-label="可複製的匯出代碼" style="margin-top:15px"></textarea></div><div class="note" style="margin:20px 0">活動期間請暫停原版修行。返回原版時，匯入此處最新的完整成果，避免兩邊各自成長後互相覆蓋。兵器神通須配合附上的相容原版。</div><div class="actions"><button class="btn" data-action="import">匯入另一份進度</button><button class="btn" data-action="help">遊玩與存檔說明</button></div>`);}
function helpDialog(){showModal(`<div class="dialog-head"><h2>歸墟行旅須知</h2><button class="close" data-action="close-modal" aria-label="關閉">×</button></div><ol class="battle-log"><li>先匯入原版最新進度，或以基礎角色開始。</li><li>守界十問合共10題，保證涵蓋六卷。每答對一題選一本隨機秘笈，增幅為原版兩倍；答錯隨機削減一項能力，設保護下限。</li><li>通過後，選一卷進行30題兵器試煉。題目不重複；可暫存返回主城，之後續答。</li><li>品階＝答對題數÷3後向上取整。1–3題為1階、4–6題為2階，以此類推；28–30題為10階。0題不獲兵器。</li><li>兵器附帶隨機一種原版異獸神通，神通階級等於兵器階級。裝備時生效，不會永久吞噬異獸。</li><li>匯出完整JSON或進度代碼，再返回原版匯入。原版答題紀錄完整保留；歸墟紀錄僅留在本機。</li><li>先把附上的相容原版放到原版GitHub網站原來的index.html位置，保持相同網址。兵器數值及神通即可在原版戰鬥使用。</li></ol><div class="note">這是個人答題煉器活動，可供全班各自在裝置遊玩。此檔案不包含玩家連線對戰或老師遠端開關功能。</div>`);}
function render(to=page){const previousPage=page;if(to==='hub'&&state&&!gx().gate.completed)to='quiz';if(to==='quiz'&&state&&gx().gate.completed&&!gx().run&&!local.feedback)to='hub';page=to;const titles={hub:'鑄兵臺',inventory:'兵器藏閣',study:'六卷溫習',records:'答題紀錄'};$('nav').classList.toggle('hidden',!state);$('nav').innerHTML=state?`${Object.entries(titles).map(([k,v])=>`<button data-action="${k}" ${page===k?'aria-current="page"':''}>${v}</button>`).join('')}<button data-action="stats">角色戰力</button><button data-action="save-dialog">存檔</button>`:'';$('header-name').textContent=state?.player.name||'';let html='';if(!state)html=renderWelcome();else if(page==='hub')html=renderHub();else if(page==='quiz')html=renderQuiz();else if(page==='result')html=renderResult();else if(page==='inventory')html=renderInventory();else if(page==='study')html=renderStudy();else if(page==='records')html=renderRecords();$('app').innerHTML=html;if(page!==previousPage)window.scrollTo({top:0,behavior:'instant'});if(state&&gx().gate.pending&&page==='quiz')rewardModal();}
function navigate(to){if(!state)return;if(to==='hub'){if(!gx().gate.completed){toast('請先完成守界十問。');render('quiz');return;}if(gx().run?.index===30){finalizeRun();local.feedback=null;}local.result=null;save();}render(to);window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;try{if(['hub','inventory','study','records'].includes(a))navigate(a);else if(a==='new')createHero();else if(a==='resume')resume();else if(a==='import')importDialog();else if(a==='import-text')receiveImport($('import-text').value);else if(a==='close-modal')closeModal();else if(a==='save-dialog')saveDialog();else if(a==='stats')statsModal();else if(a==='help')helpDialog();else if(a==='download')download();else if(a==='copy-code')copyCode();else if(a==='start-forge')startForge(Number(b.dataset.topic));else if(a==='continue-run'){local.result=null;render('quiz');}else if(a==='answer')answer(Number(b.dataset.index));else if(a==='next'){if(gx().run?.index===30)finalizeRun();nextQuestion();}else if(a==='reward-modal')rewardModal();else if(a==='claim-manual')claimManual(b.dataset.id);else if(a==='equip')equip(b.dataset.id);else if(a==='unequip')unequip();else if(a==='study-filter'){studyTopic=Number($('study-topic').value);studySearch=$('study-search').value.trim();studyPage=1;render('study');}else if(a==='study-prev'){studyPage--;render('study');window.scrollTo({top:0,behavior:'instant'});}else if(a==='study-next'){studyPage++;render('study');window.scrollTo({top:0,behavior:'instant'});}else if(a==='record-filter'){recordTopic=Number($('record-topic').value);recordMode=$('record-mode').value;render('records');}}catch(err){console.error(err);toast('操作未完成：'+err.message);}});
$('modal').addEventListener('cancel',e=>{if($('modal').dataset.locked==='yes')e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='new-name')createHero();if(e.key==='Enter'&&e.target.id==='study-search'){studySearch=e.target.value.trim();studyPage=1;render('study');}});
window.addEventListener('storage',e=>{if(e.key===KEY&&state)toast('另一分頁更新了歸墟進度，請關閉多餘分頁並重新載入最新存檔。');});
render('welcome');
</script>
</body></html>
