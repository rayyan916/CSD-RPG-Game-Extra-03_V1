030", "topic": 1, "num": 30, "category": "3) 不平等條約四大特徵", "q": "不平等條約中簽約一方往往處於「戰敗投降」或「城下之盟」的屈辱地位，這說明締約國處於甚麼狀態？", "options": ["談判主體地位嚴重不平等與不自主", "主權國家之間進行的公平外交博弈", "國際仲裁機構主持下的合法程序", "締約雙方享有完全同等的否決權利"], "answer": 0, "explanation": "在武力脅迫之下簽訂條約，戰敗國根本沒有對等自主的談判地位，其國家意志遭到外力強暴摧殘。"}, {"id": "gx_t1_q031", "topic": 1, "num": 31, "category": "3) 不平等條約四大特徵", "q": "十九世紀英國等西方列強強迫清政府簽署的不平等條約，其簽約背景的根本性質是甚麼？", "options": ["國際社會為維護和平實施維和行動", "西方帝國主義推動殖民擴張侵略手段", "亞洲各國自發組建自由貿易區條約", "兩國元首出於友好互信開展的互訪"], "answer": 1, "explanation": "不平等條約是「19世紀，英國通過軍事侵略等手段，迫使清廷簽訂」的殖民侵略產物。"}, {"id": "gx_t1_q032", "topic": 1, "num": 32, "category": "3) 不平等條約四大特徵", "q": "條約中僅強加義務給受害國，而侵略國只享有特權無需承擔對等約束，這在法律上稱作甚麼？", "options": ["現代國際法所倡導之實質對等原則", "片面利己的不平等權利義務失衡關係", "主權國家之間共享的雙向免責條款", "符合公平交易原則的雙邊商業合同"], "answer": 1, "explanation": "不平等條約在權利義務設定上完全是單向傾斜的，嚴重背離了主權國家一律平等與權責對等的法理原則。"}, {"id": "gx_t1_q033", "topic": 1, "num": 33, "category": "4) 三條不平等條約時序與土地", "q": "第一次鴉片戰爭（1840-1842年）結束後，英國強迫清政府於哪一年簽署了《南京條約》？", "options": ["一八四零年簽署南京條約", "一八四二年簽署南京條約", "一八五六年簽署南京條約", "一八六零年簽署南京條約"], "answer": 1, "explanation": "1840-1842年第一次鴉片戰爭，1842年簽訂《南京條約》。"}, {"id": "gx_t1_q034", "topic": 1, "num": 34, "category": "4) 三條不平等條約時序與土地", "q": "根據1842年中英《南京條約》的條文規定，清政府被迫割讓了哪一處中國領土？", "options": ["被迫割讓九龍半島予英國", "被迫租借新界地區予英國", "被迫割讓香港島予英國", "被迫割讓大鵬灣水域予英國"], "answer": 2, "explanation": "1842年簽訂《南京條約》，「割讓香港島」。"}, {"id": "gx_t1_q035", "topic": 1, "num": 35, "category": "4) 三條不平等條約時序與土地", "q": "第二次鴉片戰爭（1856-1860年）後，清廷於1860年被逼簽訂甚麼條約？割讓了哪處土地？", "options": ["簽訂南京條約割讓九龍半島", "簽訂北京條約割讓九龍半島", "簽訂天津條約割讓香港海島", "簽訂虎門條約租借九龍半島"], "answer": 1, "explanation": "1856-1860年第二次鴉片戰爭，1860年簽訂《北京條約》，「割讓九龍半島」。"}, {"id": "gx_t1_q036", "topic": 1, "num": 36, "category": "4) 三條不平等條約時序與土地", "q": "甲午戰爭（1895年）後列強掀起瓜分中國狂潮，英國伺機強迫清廷於哪一年簽訂租借專條？", "options": ["一八九五年簽署專條", "一八九八年簽署專條", "一九零一年簽署專條", "一九一一年簽署專條"], "answer": 1, "explanation": "1895年後列強伺機瓜分中國，「1898年：簽訂《展拓香港界址專條》」。"}, {"id": "gx_t1_q037", "topic": 1, "num": 37, "category": "4) 三條不平等條約時序與土地", "q": "1898年簽訂的《展拓香港界址專條》中，英國強行租借了中國哪些陸地與水域？", "options": ["強行租借新界及大鵬灣深圳灣水域", "僅租借九龍界限街以北的陸地荒地", "強行租借香港島全境及其附屬海島", "僅租借維多利亞港主要航道停泊區"], "answer": 0, "explanation": "1898年《展拓香港界址專條》，「英國強行租借新界及鵬灣、深圳灣水域」。"}, {"id": "gx_t1_q038", "topic": 1, "num": 38, "category": "4) 三條不平等條約時序與土地", "q": "英國在十九世紀通過三次軍事侵略強迫清廷簽訂三條條約，其正確的先後時序排列是：", "options": ["南京條約至北京條約至展拓界址專條", "北京條約至南京條約至展拓界址專條", "南京條約至展拓界址專條至北京條約", "展拓界址專條至南京條約至北京條約"], "answer": 0, "explanation": "時間線：1842年《南京條約》→ 1860年《北京條約》→ 1898年《展拓香港界址專條》。"}, {"id": "gx_t1_q039", "topic": 1, "num": 39, "category": "4) 三條不平等條約時序與土地", "q": "1898年《展拓香港界址專條》規定的租借期限為多少年？", "options": ["規定的租借期限為三十年整", "規定的租借期限為九十九年", "規定的租借期限為五十年整", "規定的租借期限為永久割讓"], "answer": 1, "explanation": "條約規定英國強租新界及鄰近水域租期為99年，至1997年6月30日屆滿。"}, {"id": "gx_t1_q040", "topic": 1, "num": 40, "category": "4) 三條不平等條約時序與土地", "q": "英國通過三條不平等條約先後侵佔的香港島、九龍半島和新界，合共造成了甚麼歷史後果？", "options": ["使香港合法永久脫離中國版圖體系", "造成英國實行殖民管治長達百餘年", "促使香港在法律上正式加入英聯邦", "使香港成為國際聯盟指定的託管地"], "answer": 1, "explanation": "及：三條不平等條約先後侵佔香港島、九龍和新界，造成英國強行割佔、租借並實行殖民管治長達150多年的歷史。"}, {"id": "gx_t1_q041", "topic": 1, "num": 41, "category": "5) 中英雙方立場與談判交鋒", "q": "中華人民共和國成立後，中國政府對三個不平等條約及香港問題的一貫基本立場是甚麼？", "options": ["不承認不平等條約待條件成熟談判", "全盤承認三個條約合法並同意續租", "立即宣佈單方面對英國發動軍事戰爭", "主張將香港全權交給聯合國託管自治"], "answer": 0, "explanation": "中國一貫立場是：香港是中國領土，不承認帝國主義強加的三個不平等條約；主張條件成熟時通過談判解決，未解決前維持現狀。"}, {"id": "gx_t1_q042", "topic": 1, "num": 42, "category": "5) 中英雙方立場與談判交鋒", "q": "1982年英國首相戴卓爾夫人訪華初期，英國政府在談判中拋出了甚麼頑固錯誤立場？", "options": ["主動提出在半年內將香港交還中國", "堅持三個條約有效論並提主權換治權", "宣布英國對香港所有區域從無管治權", "支持香港依照一國兩制原則和平回歸"], "answer": 1, "explanation": "戴卓爾夫人堅持「三個不平等條約仍然有效」，提出若中國同意英國1997年後繼續管治，英國可考慮中國的主權要求（「主權換治權」）。"}, {"id": "gx_t1_q043", "topic": 1, "num": 43, "category": "5) 中英雙方立場與談判交鋒", "q": "針對英方提出的「主權換治權」謬論，鄧小平在會談中明確表達了中方怎樣的堅定底線？", "options": ["香港主權問題不是一個可以討論問題", "同意中英兩國在回歸後共同管理香港", "允許英國繼續延續對新界地區的管治", "接受英國以象徵性租金維持特區駐軍"], "answer": 0, "explanation": "中方堅定立場是「香港主權不是一個可討論的問題」，鄧小平指出主權換治權是行不通的，主權和管治權必須在1997年全部歸還中國。"}, {"id": "gx_t1_q044", "topic": 1, "num": 44, "category": "5) 中英雙方立場與談判交鋒", "q": "鄧小平在會見戴卓爾夫人時明確指出，中方對香港問題的基本立場主要包含哪三個關鍵問題？", "options": ["國防費用外匯劃分與公務員換屆", "邊界劃定雙邊免簽與外資持股比", "主權問題管理方式與過渡期穩定", "歷史賠款貨幣發行與難民遣返案"], "answer": 2, "explanation": "三個問題為：一個是主權問題；再一個問題是1997年後中國採取什麼方式來管理香港保持繁榮；第三是過渡期15年中不出現大波動。"}, {"id": "gx_t1_q045", "topic": 1, "num": 45, "category": "5) 中英雙方立場與談判交鋒", "q": "1983年9月鄧小平會見英國前首相希思時嚴正勸告英方改變態度，以防出現甚麼局面？", "options": ["以免引發中英兩國在公海的軍事對峙", "以免聯合國安全理事會對英實施制裁", "以免香港金融市場立即停止外匯兌換", "以免出現中國單方面公佈政策局面"], "answer": 3, "explanation": "鄧小平說英國想主權換治權行不通，勸告英方改變態度，「以免出現到1984年9月中國不得不單方面公佈解決香港問題方針政策的局面」。"}, {"id": "gx_t1_q046", "topic": 1, "num": 46, "category": "5) 中英雙方立場與談判交鋒", "q": "1983年10月英國首相來信確認英方談判立場發生根本轉變，該轉變具體包含甚麼？", "options": ["不再堅持英國管治亦不謀求任何共管", "堅持保留英國駐港海軍司令指揮職務", "要求將新界租期延長三十年作緩衝期", "要求香港終審權永遠保留在倫敦樞密院"], "answer": 0, "explanation": "1983年10月英首相來信「確認不再堅持英國管治，也不謀求任何形式的共管，並理解中國計劃是建立在1997年後整個香港主權和管治權歸還中國的前提上」。"}, {"id": "gx_t1_q047", "topic": 1, "num": 47, "category": "5) 中英雙方立場與談判交鋒", "q": "總結中方對香港問題的立場，下列哪一項概括最為全面？", "options": ["同意英國繼續行使行政司法獨立管治", "承認三條約有效但要求象徵性主權歸屬", "放棄對九龍半島和新界地區管治要求", "主權不可討論不認不平等條約促交還"], "answer": 3, "explanation": "圖表：中方立場為「香港主權不是一個可討論的問題」、「不承認舊中國政府與外國政府簽訂的一切不平等條約」、「香港問題屬中國主權範圍，有權要求交還」。"}, {"id": "gx_t1_q048", "topic": 1, "num": 48, "category": "5) 中英雙方立場與談判交鋒", "q": "在香港前途問題談判中，中國政府提出在收回香港後將採取甚麼開創性特殊政策？", "options": ["在香港全面推行人民公社制度與計劃經濟", "設立特別行政區實行港人治港生活不變", "取消香港作為自由貿易港的所有免稅待遇", "要求全體香港居民立即重新登記內地戶籍"], "answer": 1, "explanation": "中國收回香港後將採取特殊政策，「設立香港特別行政區，由香港當地中國人管理，現行的社會、經濟制度和生活方式不變等等」。"}, {"id": "gx_t1_q049", "topic": 1, "num": 49, "category": "6) 國際法兩份公約/決議重點", "q": "根據權威闡述，「國際法」的定義及其核心宗旨是甚麼？", "options": ["專門用於解決跨國私人商業合同爭議", "大國強制干涉弱小國家內政的法律依據", "規範國家間規則以維護秩序和平", "僅適用於歐洲共同體成員國之內部法規"], "answer": 2, "explanation": "國際法是規範國家之間關係的規則（國與國的遊戲規則），旨在維持世界秩序與和平，各國有責任以和平及正義原則解決爭端。"}, {"id": "gx_t1_q050", "topic": 1, "num": 50, "category": "6) 國際法兩份公約/決議重點", "q": "根據《維也納條約法公約》的規定，在甚麼情形下對一國施行強迫所締結的條約是無效的？", "options": ["簽約雙方未指派最高國家元首親臨", "條約文本未翻譯成世界五大主流語言", "締約國雙方的經濟發展水平存在差距", "以威脅或使用武力對一國施行強迫"], "answer": 3, "explanation": "《維也納條約法公約》重點包括：「對一國代表之強迫」、「『以威脅或使用武力』對一國施行強迫」、「所締結條約無效」。"}, {"id": "gx_t1_q051", "topic": 1, "num": 51, "category": "6) 國際法兩份公約/決議重點", "q": "《維也納條約法公約》明文規定「對一國代表之強迫」而締結的條約，其法律效力為何？", "options": ["該條約在生效五十年後自動轉為合法", "只要強迫方給予金錢補償即具效力", "條約合法性完全取決於戰勝國的裁決", "該條約自始在國際法上完全無效"], "answer": 3, "explanation": "公約明確規定因強迫國家代表或使用武力強迫所締結條約無效（Void ab initio）。"}, {"id": "gx_t1_q052", "topic": 1, "num": 52, "category": "6) 國際法兩份公約/決議重點", "q": "聯合國大會通過的《關於侵略定義的決議》中，對因侵略取得的利益作出了甚麼嚴正定性？", "options": ["侵略國實際佔領滿百年即可確立合法主權", "只要被侵略國戰敗簽約即視為合法讓與", "侵略取得的領土利益受國際法優先保護", "因侵略行為取得之領土不得承認為合法"], "answer": 3, "explanation": "《關於侵略定義的決議》重點：「因侵略行為而取得的任何領土或特殊利益，不得亦不應承認為合法」。"}, {"id": "gx_t1_q053", "topic": 1, "num": 53, "category": "6) 國際法兩份公約/決議重點", "q": "現代國際法原則要求，國際條約的合法成立必須建立在甚麼根本基石之上？", "options": ["建立在大國海空軍事實力絕對優勢之上", "建立在戰敗國簽訂城下之盟的軍事壓迫", "必須建立在主權國家自由表達真實同意", "建立在強國單方面對外發布的最後通牒"], "answer": 2, "explanation": "條約必須基於締約國平等的真實意願表達（自由同意原則），武力脅迫違背此根本基石，自始無效。"}, {"id": "gx_t1_q054", "topic": 1, "num": 54, "category": "6) 國際法兩份公約/決議重點", "q": "根據國際正義原則，當國家之間發生領土主權或外交爭端時，各國承擔甚麼法定義務？", "options": ["有義務依正義及國際法以和平方法解決", "有權隨時以海軍艦隊封鎖對方主要港口", "有權先發制人發動局部常規侵略戰爭", "有權強迫弱小鄰國單方面割讓戰略要地"], "answer": 0, "explanation": "各國有責任及義務「以和平方法，以及依正義及國際法原則解決爭端」。"}, {"id": "gx_t1_q055", "topic": 1, "num": 55, "category": "6) 國際法兩份公約/決議重點", "q": "《關於侵略定義的決議》明確否定了甚麼歷史強權邏輯？", "options": ["否定了「強權即真理」的侵略獲益合法化", "否定了各國依和平外交談判解決紛爭原則", "否定了主權國家享有神聖不可侵犯防衛權", "否定了聯合國憲章在國際秩序中的約束力"], "answer": 0, "explanation": "決議明確禁止承認侵略行徑所獲得的非法戰果，徹底否定了殖民主義「以武力奪取領土合法化」的謬論。"}, {"id": "gx_t1_q056", "topic": 1, "num": 56, "category": "6) 國際法兩份公約/決議重點", "q": "綜合《維也納條約法公約》與《關於侵略定義的決議》，兩份國際文件的共同指向是甚麼？", "options": ["只要簽署書面條約侵略結果即受法律認可", "武力侵略與強迫締結條約自始非法無效", "戰勝國享有對戰敗國領土的永久所有權", "殖民帝國在海外建立的統治一律合法有效"], "answer": 1, "explanation": "兩部國際法文件相互呼應，共同確立了現代國際法嚴禁使用武力、強迫條約無效、侵略領土不得承認為合法的核心原則。"}, {"id": "gx_t1_q057", "topic": 1, "num": 57, "category": "7) 國際法下條約不合法性與主權", "q": "結合《維也納條約法公約》，為何英國與清廷簽署的三個不平等條約在國際法上「並無法律效力」？", "options": ["因是英國發動侵略戰爭以武力脅迫簽訂", "因清朝代表在簽署時未穿著正式官服", "因條約沒有加蓋聯合國秘書處印鑑", "因條約僅以中文起草未附英文譯本"], "answer": 0, "explanation": "及載明：根據國際法，由於是英國發動侵略戰爭、以武力脅迫清政府簽訂，「因此並無法律效力」。"}, {"id": "gx_t1_q058", "topic": 1, "num": 58, "category": "7) 國際法下條約不合法性與主權", "q": "根據《關於侵略定義的決議》，英國強行割佔香港島、九龍半島及租借新界在法理上為何不能確立合法主權？", "options": ["因侵略行為取得之任何領土利益不得承認", "因英國未按時向清政府繳納足額租金", "因香港原居民未簽字同意接受管治", "因香港普通法法院從未開庭審判確認"], "answer": 0, "explanation": "與指出：英國佔領香港是侵略戰爭的產物，因侵略取得的任何領土不得亦不應承認為合法，故英國從未擁有香港主權。"}, {"id": "gx_t1_q059", "topic": 1, "num": 59, "category": "7) 國際法下條約不合法性與主權", "q": "自1911年辛亥革命以來的歷屆中國政府對這三條不平等條約持甚麼法定態度？", "options": ["歷屆中國政府從來沒有正式承認過這三條", "歷屆政府均曾向英國發布公文正式確認其效力", "中華民國北洋政府曾投票追認南京條約有效", "僅承認租借新界的專條而否定前兩條約"], "answer": 0, "explanation": "「而1911年辛亥革命以來的歷屆中國政府，也從來沒有正式承認過這三條不平等條約」。"}, {"id": "gx_t1_q060", "topic": 1, "num": 60, "category": "7) 國際法下條約不合法性與主權", "q": "1972年3月，中國常駐聯合國代表黃華致函聯合國非殖民化特別委員會，重申了甚麼原則立場？", "options": ["要求聯合國立即派駐維和部隊接管香港防務", "香港澳門屬歷史遺留不平等條約結果非殖民地", "承認香港是英國自治領土要求安排獨立投票", "主張將香港地位交由海牙國際法院進行仲裁"], "answer": 1, "explanation": "中國代表致函指出港澳是帝國主義強加不平等條約的結果，解決港澳問題完全屬中國主權範圍，根本不屬於通常所謂「殖民地」範疇。"}, {"id": "gx_t1_q061", "topic": 1, "num": 61, "category": "7) 國際法下條約不合法性與主權", "q": "1972年11月第27屆聯合國大會以99票贊成、5票反對的壓倒性多數通過決議，作出了甚麼歷史性決定？", "options": ["確認香港為英國享有合法主權的海外屬地", "決議授權英國在1997年後繼續管治香港特區", "要求香港特區在五年內舉行全民獨立自決投票", "將香港和澳門從聯合國殖民地名單中正式剔除"], "answer": 3, "explanation": "第27屆聯大以99票對5票通過決議，「將香港和澳門從殖民地名單中剔除，並確認中國對香港和澳門問題的立場和要求」。"}, {"id": "gx_t1_q062", "topic": 1, "num": 62, "category": "7) 國際法下條約不合法性與主權", "q": "聯合國大會將香港從「殖民地」名單中刪除，在國際法層面產生了甚麼至關重要的法律後果？", "options": ["完全堵死了外力企圖將香港問題國際化或搞獨立自決的圖謀", "促使英國立即單方面從香港撤出全部駐軍人員", "使香港特區自動失去了世界貿易組織的獨立成員席位", "使香港在國際法上等同於內地的普通直轄市"], "answer": 0, "explanation": "通常的「殖民地」享有民族自決與獨立的國際權利，將香港剔除出殖民地名單，確認香港是中國被佔領土，解決香港問題完全屬中國主權，任何「自決獨立」皆非法無據。"}, {"id": "gx_t1_q063", "topic": 1, "num": 63, "category": "7) 國際法下條約不合法性與主權", "q": "說香港不是英國的「殖民地」，其精確的法理含義是甚麼？", "options": ["徹底否認英國在香港存在過一百五十餘年歷史", "非否認被佔歷史強調英國只有殖民管治而無主權", "指英國在香港實施的是完全平等的民主共治體制", "指香港歷代總督都是由全港市民普選授權產生的"], "answer": 1, "explanation": "說香港不是殖民地，「並非否認香港曾被英國佔領的歷史，只是強調使用殖民地一詞描述香港地位並不恰當……英國實施的是殖民管治，並沒有擁有香港的主權」。"}, {"id": "gx_t1_q064", "topic": 1, "num": 64, "category": "7) 國際法下條約不合法性與主權", "q": "既然英國在香港從未合法擁有主權而只有非法殖民管治，這決定了英國在法理上擁有甚麼權限？", "options": ["英國有權自行決定在香港舉行公民投票搞獨立", "英國可以將香港的主權私下轉讓給第三方國家", "英國有權單方面修改香港特別行政區基本法", "英國根本沒有任何權力容許香港自治或獨立"], "answer": 3, "explanation": "「正因如此，英國沒有權容許香港自治或獨立。」香港主權一直屬於國家。"}, {"id": "gx_t1_q065", "topic": 1, "num": 65, "category": "7) 國際法下條約不合法性與主權", "q": "1984年中英兩國政府簽署的《中英聯合聲明》中，確認了中華人民共和國政府將於何時恢復對香港行使主權？", "options": ["一九九七年七月一日恢復行使主權", "一九八四年十二月十九日簽署生效", "一九九零年四月四日全國人大頒布", "一九九九年十二月二十日交接儀式"], "answer": 0, "explanation": "《聯合聲明》「確認中華人民共和國政府於1997年7月1日恢復對香港行使主權」。"}, {"id": "gx_t1_q066", "topic": 1, "num": 66, "category": "7) 國際法下條約不合法性與主權", "q": "基於中國一直擁有香港主權的法理事實，1997年7月1日中國政府對香港的官方莊嚴表述是甚麼？", "options": ["中國從英國手中「收回香港的國家主權」", "中國向英方「購買香港全部土地業權」", "香港特區宣布「脫離英聯邦獨立建國」", "中國正式「恢復對香港行使主權」"], "answer": 3, "explanation": "強調：到1997年7月1日，中國正式「恢復對香港行使主權」，而不是「收回香港主權」。"}, {"id": "gx_t1_q067", "topic": 1, "num": 67, "category": "7) 國際法下條約不合法性與主權", "q": "1997年7月1日子夜中英兩國舉行的具有歷史意義的莊嚴儀式，其法理性質應當準確表述為：", "options": ["中英兩國政府之間進行的「主權移交」", "中英兩國之間的交接儀式是「政權交接」", "英國向香港特區政府進行的「主權讓渡」", "聯合國主持下的「託管地管理權移轉」"], "answer": 1, "explanation": "中英之間的交接儀式是「政權交接」而不是「主權移交」，因為英國從未擁有主權，交接的是管治政權。"}, {"id": "gx_t1_q068", "topic": 1, "num": 68, "category": "7) 國際法下條約不合法性與主權", "q": "最後總結，儘管英國強行割佔及租借長達百餘年並實行殖民管治，但在法律實質上產生了甚麼影響？", "options": ["香港的主權已因歷史悠久而合法移轉給英國王室", "香港在國際法上自動演變為無主權歸屬之爭議地", "中國政府已永久喪失了對香港土地的歷史追索權", "對香港的主權一直屬於國家這個事實未曾改變"], "answer": 3, "explanation": "「由此可見，儘管英國割佔及強租香港地區長達一百五十多年……但對香港的主權一直屬於國家這個事實並沒有帶來任何改變。」"}, {"id": "gx_t1_q069", "topic": 1, "num": 69, "category": "7) 國際法下條約不合法性與主權", "q": "在教學中引導學生從歷史和法理角度正確認識香港並非英國「殖民地」，其深層教育價值是甚麼？", "options": ["要求學生背誦枯燥法條以應對常規期末考試", "煽動學生對所有西方現代科技文明產生對立仇視", "準確認識國家歷史事實樹立正確認知與歸屬感", "否定香港過去在國際貿易航運中取得的一切成就"], "answer": 2, "explanation": "教導學生正確認識有關香港歷史事實，能培養對國家的認同、歸屬感和自豪感，愛國愛港愛家，樹立世界視野與大局觀。"}, {"id": "gx_t1_q070", "topic": 1, "num": 70, "category": "7) 國際法下條約不合法性與主權", "q": "不平等條約在國際法上自始無效的定論，為1997年中國恢復對香港行使主權提供了怎樣的法理支撐？", "options": ["迫使中國政府不得不向英國支付鉅額管理賠償", "證明中國恢復行使主權必須先徵得英方同意", "提供了堅實無可辯駁的國際法理正當性依據", "使香港回歸成為國際法院判例中的例外特案"], "answer": 2, "explanation": "國際法上的條約無效原則與反侵略決議，徹底擊碎了「條約有效論」和「主權換治權」的法律藉口，為中國光明正大恢復行使主權提供了最高法理正義。"}, {"id": "gx_t1_q071", "topic": 1, "num": 71, "category": "8) 什麼是「一國兩制」", "q": "「一國兩制」的偉大構想是由誰於20世紀80年代初創造性提出，並首先用於解決香港問題？", "options": ["由新中國首任總理周恩來創造性提出", "由國家最高領導人鄧小平創造性提出", "由全國人大委員長葉劍英在通告提出", "由英國前首相戴卓爾夫人在會談提出"], "answer": 1, "explanation": "重點(一)：20世紀80年代初，為實現國家和平統一，國家領導人鄧小平創造性地提出了「一國兩制」的構想，並首先用於解決香港問題。"}, {"id": "gx_t1_q072", "topic": 1, "num": 72, "category": "8) 什麼是「一國兩制」", "q": "重點(二)明確給出了「一國兩制」的科學定義，其內容是甚麼？", "options": ["國家在國際上允許同時存在兩個中央政府彼此對立", "特區可以自行組建完全獨立的軍隊並行使宣戰權力", "國家在國內某些區域設立實行不同制度的特別行政區", "在全國所有省市範圍內全面同步實施雙軌並行法制"], "answer": 2, "explanation": "一國兩制是指「國家在國內某些區域設立和實行不同於國家制度和政策的特別行政區」。"}, {"id": "gx_t1_q073", "topic": 1, "num": 73, "category": "8) 什麼是「一國兩制」", "q": "在「一國兩制」方針下，國家在香港特別行政區依法保留並實行哪些不同於內地的具體制度？", "options": ["在香港實施社會主義公有制和計劃經濟調配制度", "在香港實行人民代表大會制度和地方監察委員會制", "在香港設立君主立憲議會並全盤推行倫敦法律法規", "在香港實行資本主義制度貨幣制度和司法制度等"], "answer": 3, "explanation": "「如在香港實行資本主義制度、貨幣制度和司法制度等」。"}, {"id": "gx_t1_q074", "topic": 1, "num": 74, "category": "8) 什麼是「一國兩制」", "q": "鄧小平提出「一國兩制」構想的最初根本出發點，是為了以甚麼方式實現國家完全統一？", "options": ["為了以局部軍事封鎖迫使對方投降歸順", "為了透過外國仲裁放棄國家的領土主權", "為了以和平方式實現國家的和平統一", "為了永久維持現狀使海峽兩岸永遠分立"], "answer": 2, "explanation": "鄧小平提出一國兩制，「為實現國家和平統一」，創造性提出構想並首先用於香港問題。"}, {"id": "gx_t1_q075", "topic": 1, "num": 75, "category": "9) 憲法第三十一條", "q": "為了將「一國兩制」構想轉化為基本國家政策，五屆全國人大於哪一年通過在《憲法》中加入第三十一條？", "options": ["一九八四年十二月十九日簽署聯合聲明加入", "一九九零年四月四日全國人大制定基本法加入", "一九八二年十二月四日通過加入第三十一條", "一九九七年七月一日香港特別行政區成立加入"], "answer": 2, "explanation": "1982年12月4日第五屆全國人民代表大會通過在《憲法》第一章總綱加入了第三十一條。"}, {"id": "gx_t1_q076", "topic": 1, "num": 76, "category": "9) 憲法第三十一條", "q": "《中華人民共和國憲法》第三十一條的條文規定內容是甚麼？", "options": ["各少數民族聚居的地方實行民族區域自治設立機關", "中華人民共和國公民在法律面前一律平等享有權利", "國家保護城鄉勞動群眾集體所有制的經濟合法權益", "國家在必要時得設立特區實行制度由人大法律規定"], "answer": 3, "explanation": "完整引用：國家在必要時得設立特別行政區。在特別行政區內實行的制度按照具體情況由全國人民代表大會以法律規定。"}, {"id": "gx_t1_q077", "topic": 1, "num": 77, "category": "9) 憲法第三十一條", "q": "《憲法》第三十一條在落實「一國兩制」和設立香港特別行政區的過程中發揮了甚麼根本功能？", "options": ["直接取代了香港特區普通法中的全部民事訴訟程序", "宣布免除香港特區承擔維護國家安全的一切法定義務", "為設立特區和制定基本法提供憲制基礎和法律依據", "規定特別行政區的全部財政收入必須定期上繳國庫"], "answer": 2, "explanation": "架構圖明確標記：《憲法》第三十一條為「設立特別行政區」及「制定基本法」提供了「法律依據」和「憲制基礎」。"}, {"id": "gx_t1_q078", "topic": 1, "num": 78, "category": "10) 基本法制定的意義", "q": "《香港基本法》在香港特別行政區法律體系中的地位是甚麼？", "options": ["《基本法》是特區立法會通過的附屬行政規例", "《基本法》是國務院外事部門頒布的涉外指導函", "《基本法》是香港大律師公會起草的行業守則書", "《基本法》是香港特別行政區的憲制性文件"], "answer": 3, "explanation": "第一點明確指出：「《基本法》是香港特別行政區的憲制性文件。」"}, {"id": "gx_t1_q079", "topic": 1, "num": 79, "category": "10) 基本法制定的意義", "q": "《基本法》以法律的形式闡述國家對香港的基本政策方針，其最重大的歷史與法治意義是甚麼？", "options": ["使香港特區在五年內完全過渡為社會主義體系", "將香港特區所有公立醫院直接劃歸衛健委管理", "使一國兩制方針制度化法律化提供憲制基礎", "全面取消香港特別行政區作為單獨關稅區地位"], "answer": 2, "explanation": "《基本法》訂明「一國兩制」、「港人治港」、「高度自治」重要理念，「並使『一國兩制』方針制度化和法律化，並與國家《憲法》共同為『一國兩制』提供了憲制基礎」。"}, {"id": "gx_t1_q080", "topic": 1, "num": 80, "category": "10) 基本法制定的意義", "q": "總結國家《憲法》與《香港基本法》在特區治理中的關係，下列哪項敘述最為準確？", "options": ["《憲法》與《基本法》共同為一國兩制提供憲制基礎", "《基本法》效力高於《憲法》，《憲法》在特區不適用", "《中英聯合聲明》才是香港特區唯一的最高法治基礎", "香港特區法院有權判定國家《憲法》條文在香港無效"], "answer": 0, "explanation": "《基本法》「與國家《憲法》共同為『一國兩制』提供了憲制基礎」。憲法是母法，具有最高法律地位和效力。"}, {"id": "gx_t2_q001", "topic": 2, "num": 1, "category": "1) 何謂憲法及主要功能", "q": "下列哪一項對《憲法》法律地位的界定最為準確？", "options": ["專門用於規範地方民事經濟合同之專門法", "僅在國家宣布緊急狀態時方可適用的法規", "具最高法律效力的根本大法擁有最高權威", "由地方立法機關根據實際需要修改的條例"], "answer": 2, "explanation": "《憲法》是「具有最高法律效力的國家根本大法」，「擁有最高權威」。"}, {"id": "gx_t2_q002", "topic": 2, "num": 2, "category": "1) 何謂憲法及主要功能", "q": "《憲法》在國家制度層面的首要核心功能是甚麼？", "options": ["直接替代各級法院審判每宗具體刑事案件", "每年直接審批全國所有私營企業獎金預算", "規定國家根本制度基本原則以及公民權責", "單方面決定世界各國貨幣匯率自由兌換額"], "answer": 2, "explanation": "憲法功能包括「規定了國家的根本制度和基本原則（如政治架構、國家機關職責、公民權利和義務等）」。"}, {"id": "gx_t2_q003", "topic": 2, "num": 3, "category": "1) 何謂憲法及主要功能", "q": "《憲法》在整個國家法律體系中處於母法地位，發揮著甚麼立法功能？", "options": ["作為司法機關在審判案件時的非正式參考", "僅作為大專院校法律系學生的學術研究材料", "作為制定所有其他法律的根本基礎和依據", "只在成文法規出現漏洞時作臨時補充之用"], "answer": 2, "explanation": "《憲法》的重要功能是「制定其他法律的基礎和依據」，一切法律均不得與憲法相抵觸。"}, {"id": "gx_t2_q004", "topic": 2, "num": 4, "category": "1) 何謂憲法及主要功能", "q": "「國家實行社會主義市場經濟」是規定在《中華人民共和國憲法》的哪一條文？", "options": ["載於《憲法》第一條總綱明文規定", "載於《憲法》第十五條明文規定", "載於《憲法》第二十五條明文規定", "載於《憲法》第三十條明文規定"], "answer": 1, "explanation": "表格載明：國家制度「國家實行社會主義市場經濟……」屬於《憲法》第十五條。"}, {"id": "gx_t2_q005", "topic": 2, "num": 5, "category": "1) 何謂憲法及主要功能", "q": "「國家推行計劃生育」規定於《憲法》的哪一條文之中？", "options": ["載於《憲法》第十五條規定", "載於《憲法》第二十五條規定", "載於《憲法》第三十一條規定", "載於《憲法》第六十二條規定"], "answer": 1, "explanation": "表格明確配對：「國家推行計劃生育……」屬於《憲法》第二十五條。"}, {"id": "gx_t2_q006", "topic": 2, "num": 6, "category": "1) 何謂憲法及主要功能", "q": "中華人民共和國行政區域劃分（省、自治區、直轄市等）規定於《憲法》哪一條？", "options": ["明確載於《憲法》第二條規定", "明確載於《憲法》第十八條規定", "明確載於《憲法》第四十五條規定", "明確載於《憲法》第三十條規定"], "answer": 3, "explanation": "表格標明：行政區域劃分屬於《憲法》第三十條。"}, {"id": "gx_t2_q007", "topic": 2, "num": 7, "category": "1) 何謂憲法及主要功能", "q": "「國家在必要時得設立特別行政區」這項重要憲制條款，是載於《憲法》哪一條？", "options": ["明確載於《憲法》第三條第一款", "明確載於《憲法》第三十一條", "明確載於《憲法》第十二條第二款", "明確載於《憲法》第一百條附則"], "answer": 1, "explanation": "表格載明：設立特別行政區屬於《憲法》第三十一條。"}, {"id": "gx_t2_q008", "topic": 2, "num": 8, "category": "1) 何謂憲法及主要功能", "q": "「社會主義制度是中華人民共和國的根本制度」這一核心宣示，規定在《憲法》哪一條？", "options": ["規定於《憲法》第一條第一款", "規定於《憲法》第五條第二款", "規定於《憲法》第三十一條附款", "規定於《憲法》第六十二條款項"], "answer": 0, "explanation": "國家的憲制秩序中，憲法《第一條》（節錄）規定「社會主義制度是中華人民共和國的根本制度」。"}, {"id": "gx_t2_q009", "topic": 2, "num": 9, "category": "2) 地方行政區劃分", "q": "根據行政區劃架構，中央人民政府直接管轄的地方行政區域數量為：", "options": ["劃分為二十二個省六個自治區三直轄市三特區", "劃分為二十四個省四個自治區五直轄市一特區", "劃分為二十三個省五個自治區四直轄市兩特區", "劃分為二十個省八個自治區四直轄市兩特區"], "answer": 2, "explanation": "圖表顯示：中央人民政府下轄「23個省、5個自治區、4個直轄市、2個特別行政區」。"}, {"id": "gx_t2_q010", "topic": 2, "num": 10, "category": "2) 地方行政區劃分", "q": "在國家的行政體制劃分中，香港特別行政區處於怎樣的行政級別和管轄關係？", "options": ["直轄於廣東省人民政府管轄的二級特區", "享有獨立主權地位的自願邦聯加盟共和國", "直轄於中央人民政府的一級地方行政區域", "由國務院和外國政府聯合管轄的中立區域"], "answer": 2, "explanation": "與強調：香港特別行政區是「直轄於中央人民政府的一級地方行政區域，與省、自治區、直轄市同級」。"}, {"id": "gx_t2_q011", "topic": 2, "num": 11, "category": "2) 地方行政區劃分", "q": "《中華人民共和國憲法》第三條規定中央和地方國家機構職權劃分時，遵循甚麼原則？", "options": ["在中央統一領導下充分發揮地方主動積極性", "在地方完全自治前提下由中央負責外事協調", "中央與地方各級機構實行平行的三權分立制衡", "地方行政事務完全交由地方公投自主做出決定"], "answer": 0, "explanation": "引用憲法第三條：中央和地方國家機構職權劃分，「遵循在中央的統一領導下，充分發揮地方的主動性、積極性的原則」。"}, {"id": "gx_t2_q012", "topic": 2, "num": 12, "category": "2) 地方行政區劃分", "q": "根據《憲法》第三條的憲制規定，地方行政機關的各項權力根本來源是甚麼？", "options": ["地方行政機關的權力來源自中央的授權", "來源於地方自古以來固有不變的天然主權", "來源於各地方議會單方面通過的地方法例", "來源於聯合國非殖民化機構的國際法授權"], "answer": 0, "explanation": "根據《憲法》第三條，「地方行政機關的權力來源自中央的授權」。"}, {"id": "gx_t2_q013", "topic": 2, "num": 13, "category": "2) 地方行政區劃分", "q": "在單一制國家架構下，中央國家機關在全國所有行政區域範圍內行使甚麼根本權力？", "options": ["中央國家機關僅在各省行使名義上禮儀權力", "中央國家機關在特別行政區完全不行使治權", "中央國家機關將全部防務權讓渡給地方機關", "中央國家機關在全國範圍內行使主權和治權"], "answer": 3, "explanation": "「中央國家機關在全國範圍內行使主權和治權」。"}, {"id": "gx_t2_q014", "topic": 2, "num": 14, "category": "2) 地方行政區劃分", "q": "香港特別行政區與內地的「省、自治區、直轄市」相比，在行政級別層面有何共同點？", "options": ["均完全按照內地體制實施社會主義經濟制度", "均享有由全國人大授予的獨立司法終審權力", "均可自行以獨立關稅區名義簽署自貿協定", "均屬直轄於中央人民政府同級一級地方區域"], "answer": 3, "explanation": "標註：香港特區直轄於中央，屬一級地方行政區域，「與省、自治區、直轄市同級」。"}, {"id": "gx_t2_q015", "topic": 2, "num": 15, "category": "2) 地方行政區劃分", "q": "雖然香港是一級地方行政區，但在實行制度上與普通省市截然不同，其根本特點在於：", "options": ["香港特區完全不受國家憲法的任何原則約束", "香港特區享有完全獨立的外交宣戰主權權利", "根據一國兩制享有高度自治並實行資本主義", "香港特區行政長官不需要向中央人民政府負責"], "answer": 2, "explanation": "香港特區雖屬一級地方區域，但在「一國兩制」下獲中央授予高度自治權，保留資本主義制度、貨幣與司法制度。"}, {"id": "gx_t2_q016", "topic": 2, "num": 16, "category": "2) 地方行政區劃分", "q": "國家設立香港與澳門兩個特別行政區，在國家結構形式和治理實踐上體現了甚麼？", "options": ["表明國家已經正式轉變為西方鬆散聯邦體系", "體現了單一制國家在憲制原則下的制度創新", "意味著特別行政區不再屬於中國的主權領土", "說明國家將逐步取消所有內地省級行政建制"], "answer": 1, "explanation": "特區是中央授權下的一級地方行政區，設立特區實行一國兩制是單一制主權國家下的重大制度創新。"}, {"id": "gx_t2_q017", "topic": 2, "num": 17, "category": "3) 中央與香港的憲制秩序", "q": "核心概念「憲制」是指由憲法確立的哪兩大基本方面的總和？", "options": ["軍事裝備現代化標準與邊界防禦部隊輪換規則", "國家構成的基本制度與國家權力運作基本規則", "外匯交易清算程序與國際大宗商品定價機制法", "公務員晉升考核條例與市政環境保護衛生指引"], "answer": 1, "explanation": "核心概念：憲制指由憲法確立的「國家構成的基本制度（制度構成）」與「國家權力運作的基本規則（權力運作）」。"}, {"id": "gx_t2_q018", "topic": 2, "num": 18, "category": "3) 中央與香港的憲制秩序", "q": "在「國家的憲制秩序」中，人民行使國家權力的法定機關是甚麼？", "options": ["各省級人民政府的常務會議與諮詢委員會室", "全國人民代表大會和地方各級人民代表大會", "最高人民法院與最高人民檢察院各級審判庭", "各跨國商會駐華代表處與外商投資協調機構"], "answer": 1, "explanation": "引用憲法第一條（節錄）：「人民行使國家權力的機關是全國人民代表大會和地方各級人民代表大會」。"}, {"id": "gx_t2_q019", "topic": 2, "num": 19, "category": "3) 中央與香港的憲制秩序", "q": "根據《憲法》第六十二條第十四款，全國人民代表大會行使下列哪項至關重要的職權？", "options": ["直接指揮香港特區各級法院開庭審理民事案", "行使決定特別行政區的設立及其制度的職權", "直接委任香港特區各大專院校校長行政職務", "單方面批准外國商業銀行在港發行法定紙幣"], "answer": 1, "explanation": "引用憲法第62條第(十四款)：全國人民代表大會行使職權「決定特別行政區的設立及其制度」。"}, {"id": "gx_t2_q020", "topic": 2, "num": 20, "category": "3) 中央與香港的憲制秩序", "q": "《香港基本法》第一條開宗明義訂明了特區的憲制地位，其核心條文內容是甚麼？", "options": ["香港特別行政區享有完全獨立主權與外交特權", "香港特別行政區是中華人民共和國不可分離部分", "香港特別行政區在五十年後自動轉為社會主義", "香港特別行政區各項權力高於國家中央最高機關"], "answer": 1, "explanation": "引用《基本法》第一條：「香港特別行政區是中華人民共和國不可分離的部分。」"}, {"id": "gx_t2_q021", "topic": 2, "num": 21, "category": "3) 中央與香港的憲制秩序", "q": "《基本法》第十二條對香港特別行政區的法律地位與隸屬關係作出了甚麼明確規定？", "options": ["享有全面獨立主權的自治共和國直轄聯合國", "由廣東省政府直接領導的省轄經濟特區機構", "與中央人民政府平起平坐的聯邦加盟成員邦", "享有高度自治權的地方行政區域直轄中央政府"], "answer": 3, "explanation": "引用《基本法》第十二條：「香港特別行政區是中華人民共和國的一個享有高度自治權的地方行政區域，直轄於中央人民政府。」"}, {"id": "gx_t2_q022", "topic": 2, "num": 22, "category": "3) 中央與香港的憲制秩序", "q": "在「制度構成」層面，中央與香港特區的憲制秩序主要由哪些要素所奠定？", "options": ["香港與中央透過國際條約結成對等的軍事同盟", "國家依憲法31條設立特區實行一國兩制且直轄中央", "香港特區在政治體制上全盤照搬內地人大制度", "特區立法會有權修改國家憲法中的各項條文"], "answer": 1, "explanation": "核心重點：制度構成維度為「國家根據《憲法》三十一條規定設立香港特區，實行『一國兩制』；香港屬於國家體制的『一級地方行政區』，直轄於中央人民政府」。"}, {"id": "gx_t2_q023", "topic": 2, "num": 23, "category": "3) 中央與香港的憲制秩序", "q": "在「權力運作」層面，中央與香港特別行政區之間的根本法律關係是甚麼？", "options": ["中央與地方相互分權制衡的西方三權對立架構", "地方將部分主權自下而上讓渡給中央行使管理", "特區政府完全享有憲法未明文列舉的固有權力", "授權與被授權關係且特區權力源於中央的授權"], "answer": 3, "explanation": "核心重點：權力運作維度為「授權與被授權，權力源於中央授權；獲授予高度自治權，包括行政、立法、司法及終審權」。"}, {"id": "gx_t2_q024", "topic": 2, "num": 24, "category": "3) 中央與香港的憲制秩序", "q": "中央授予香港特區的高度自治權，其具體包含的四大權力維度是甚麼？", "options": ["包含宣戰媾和權獨立國防權外交使節派遣全權", "包含修改國家憲法權變更特區疆界獨立自主權", "包含自行任命駐聯合國特派全權大使所有權力", "包含行政管理權立法權獨立的司法權和終審權"], "answer": 3, "explanation": "高度自治權包括：「行政、立法、司法及終審權」。"}, {"id": "gx_t2_q025", "topic": 2, "num": 25, "category": "3) 中央與香港的憲制秩序", "q": "關於國家《憲法》與《香港基本法》共同構成特區憲制基礎的理解，下列何者正確？", "options": ["基本法效力高於憲法因此憲法在香港完全無效", "兩者相互矛盾衝突時應當優先適用國際公約", "憲法是母法和最高權限基本法由憲法授權制定", "基本法是英國國會授權制定的特區憲制性法律"], "answer": 2, "explanation": "《憲法》是國家的根本大法，是《基本法》的立法依據和效力來源，《憲法》與《基本法》共同構成特區憲制基礎。"}, {"id": "gx_t2_q026", "topic": 2, "num": 26, "category": "3) 中央與香港的憲制秩序", "q": "香港特區享有的「終審權」是由哪一個司法機構依法行使的？", "options": ["由北京最高人民法院開庭行使最終裁決權", "由特區立法會司法事務委員會投票終審裁決", "由香港特別行政區終審法院獨立行使審判", "由倫敦樞密院司法委員會繼續行使終審管轄"], "answer": 2, "explanation": "基本法第19條明定：香港特別行政區享有獨立的司法權和終審權，終審權屬於香港特區終審法院。"}, {"id": "gx_t2_q027", "topic": 2, "num": 27, "category": "3) 中央與香港的憲制秩序", "q": "香港特區直轄於中央人民政府，這一憲制秩序決定了行政長官的甚麼法律責任？", "options": ["行政長官只對香港本地選民承擔單方面的責任", "行政長官只對特區立法會負責受立法會指令指揮", "行政長官依照基本法規定對中央和香港特區負責", "行政長官直接對聯合國人權委員會承擔法律報告"], "answer": 2, "explanation": "基本法第43條明定：行政長官依照本法規定對中央人民政府和香港特別行政區負責（雙首長、雙重負責）。"}, {"id": "gx_t2_q028", "topic": 2, "num": 28, "category": "3) 中央與香港的憲制秩序", "q": "在「一國兩制」方針下，「一國」與「兩制」在憲制秩序中的正確主從關係是甚麼？", "options": ["兩制是一國的前提和基礎兩者處於平起平坐地位", "實行兩制意味著特區可以排斥一國之內的主權", "一國僅是文化地理概念在法律上兩地互不相屬", "一國是兩制的前提和基礎兩制從屬派生於一國"], "answer": 3, "explanation": "「一國」是「兩制」的前提和根基，沒有「一國」就沒有「兩制」，特區各項權力均來自中央授權。"}, {"id": "gx_t2_q029", "topic": 2, "num": 29, "category": "3) 中央與香港的憲制秩序", "q": "香港特區政治體制中的「行政主導」特點，在憲制秩序上如何體現？", "options": ["立法會掌握最高行政指揮權並隨意任免各司長", "法院可以代替特區政府制定經濟財政各項政策", "行政會議成員全部由外國領事館直接推薦委派", "以行政長官為核心領導特區政府行使各項職權"], "answer": 3, "explanation": "行政主導以行政長官為核心，行政長官具有雙首長地位與雙重負責憲制責任，領導特區依法施政。"}, {"id": "gx_t2_q030", "topic": 2, "num": 30, "category": "3) 中央與香港的憲制秩序", "q": "總結而言，準確理解中央與香港的憲制秩序，最根本的原則基石是甚麼？", "options": ["允許香港特區逐步發展成為完全脫離中央之體", "將普通法體系完全取代國家憲法的最高法律效力", "特區可以隨意拒絕執行全國人大常委會各項決定", "堅定維護國家主權安全發展利益並落實高度自治"], "answer": 3, "explanation": "維護國家主權、安全、發展利益是一國兩制最高原則，在此前提下充分保障特區依法享有的高度自治權。"}, {"id": "gx_t2_q031", "topic": 2, "num": 31, "category": "4) 「剩餘權力」定義與聯邦制", "q": "何謂「剩餘權力」（Residual Powers）？", "options": ["指政府在每年財政預算審批後剩餘的開支額度", "指終審法院在審結所有民事訴訟後的執行權力", "指行政會議因突發公共衛生事件緊急動用資金", "指在憲法中未有列舉而歸屬於地方擁有的權力"], "answer": 3, "explanation": "剩餘權力「指憲法未列舉的權力。在實行聯邦制的國家中，憲法未列舉的權力屬地方所有，稱為剩餘權力」。"}, {"id": "gx_t2_q032", "topic": 2, "num": 32, "category": "4) 「剩餘權力」定義與聯邦制", "q": "「剩餘權力」通常體現在甚麼國家結構形式的國家之中？", "options": ["通常體現在實行單一制高度集權的國家中", "通常體現在實行「聯邦制」體制的國家中", "通常體現在古代君主專制中央統轄的國家中", "通常體現在完全沒有成文憲法保護的國家中"], "answer": 1, "explanation": "「簡單而言，剩餘權力通常體現在實行『聯邦制』的國家中」。"}, {"id": "gx_t2_q033", "topic": 2, "num": 33, "category": "4) 「剩餘權力」定義與聯邦制", "q": "《美國憲法》第十條修正案規定：「憲法未授予合眾國或未禁止各州行使的權力由各州或人民保留。」這說明：", "options": ["美國各州政府的所有行政權限全部源於總統授權", "美國屬於典型的中央人民政府管轄的單一制國家", "美國憲法將聯邦未列舉的剩餘權力保留給各州", "美國聯邦最高法院可以隨意取消各州的保留權力"], "answer": 2, "explanation": "引述美國憲法第10修正案：美國憲法將聯邦權力列舉後，把「剩餘權力」保留給各州政府或人民。"}, {"id": "gx_t2_q034", "topic": 2, "num": 34, "category": "4) 「剩餘權力」定義與聯邦制", "q": "在美國聯邦體制下，由於聯邦憲法未明文將公共衛生列為聯邦專屬權力，導致公共衛生權力屬於誰？", "options": ["公共衛生完全由美國總統一人以行政命令統管", "公共衛生由世界衛生組織直接派駐專員管理", "公共衛生由各私人保險公司董事會聯合掌管", "公共衛生屬於剩餘權力而歸屬各州政府管轄"], "answer": 3, "explanation": "例子：依據美國憲法，聯邦權力為鑄幣外交國防等，未明確指出公共衛生由聯邦負責，「故公共衛生屬於剩餘權力，屬州政府管轄」。"}, {"id": "gx_t2_q035", "topic": 2, "num": 35, "category": "4) 「剩餘權力」定義與聯邦制", "q": "以美國應對新冠疫情為例，說明聯邦制下剩餘權力劃分產生了甚麼治理後果？", "options": ["聯邦政府能迅速統一調配全國醫療物資阻斷病毒", "聯邦與州相互獨立各自為政且應對措施不一致", "各州法律政策高度一致且完全聽從中央統一指令", "最高法院直接宣布全國各州實施統一戒嚴與封城"], "answer": 1, "explanation": "美國聯邦政府與州政府相互獨立，各州處於各自為政狀態，無既定合作管道，封城及經濟重啟措施皆不一致。"}, {"id": "gx_t2_q036", "topic": 2, "num": 36, "category": "4) 「剩餘權力」定義與聯邦制", "q": "聯邦制國家中「地方先於聯邦存在，聯邦權力由各州讓渡而來」的特點，決定了其權力架構具有甚麼屬性？", "options": ["各州享有固有權力並保留未列舉之剩餘權力", "各州所有權限皆由聯邦政府隨時任意收回廢止", "聯邦總統有權直接任命各州的州長與各市市長", "各州法院的判決必須全部報聯邦司法部審查批准"], "answer": 0, "explanation": "聯邦制各邦/州在建國前即享有主權，聯合組建聯邦時將部分權力讓渡，未讓渡的剩餘權力歸各邦固有保留。"}, {"id": "gx_t2_q037 災害與全球氣候影響狀態", "相對處於沒有危險不受內外威脅狀態及保障能力", "完全交由聯合國維和部隊代管防務之安全狀態", "只防範外部軍事衝突而不必理會內部失序狀態"], "answer": 1, "explanation": "《國家安全法》第二條規定，國家安全指國家重大利益「相對處於沒有危險和不受內外威脅的狀態，以及保障持續安全狀態的能力」。"}, {"id": "gx_t3_q002", "topic": 3, "num": 2, "category": "1) 國家安全的含義與基礎認知", "q": "理解國家安全的含義包含四個方面，下列哪一項「不屬於」這四個方面？", "options": ["追求在國際軍事同盟體系中擁有絕對主導地位", "維護國家政權主權統一和領土完整的核心安全", "維持既無外部威脅亦無內在動亂穩定有序狀態", "警惕動態多變風險並具備保障持續安全之能力"], "answer": 0, "explanation": "四個方面為：維護核心利益、維持穩定有序狀態、警惕動態風險、具備保障持續安全能力。A選項錯誤。"}, {"id": "gx_t3_q003", "topic": 3, "num": 3, "category": "1) 國家安全的含義與基礎認知", "q": "「國家安全是一種沒有外部的威脅和侵害，亦沒有內在的動亂和失序的狀態」，這屬於哪一層面理解？", "options": ["屬於維護國家核心與重大利益的安全之層面", "屬於時刻警惕動態多變風險因素之客觀層面", "屬於維持國家內外穩定有序的狀態之層面", "屬於不斷加強持續安全保障能力建設之層面"], "answer": 2, "explanation": "表格說明：「沒有外部的威脅和侵害，亦沒有內在的動亂和失序的狀態」對應「維持內外穩定有序的狀態」。"}, {"id": "gx_t3_q004", "topic": 3, "num": 4, "category": "1) 國家安全的含義與基礎認知", "q": "「現實世界沒有絕對的國家安全，風險因素常在，必須時刻保持警惕」，這體現了國家安全的甚麼特點？", "options": ["說明國家安全是一勞永逸的靜態防禦狀態", "表明國防安全僅存在於冷戰常規軍事威脅", "意味著只要經濟高速發展即可忽視所有風險", "必須時刻警惕各類動態多變的風險因素"], "answer": 3, "explanation": "現實世界沒有絕對安全，風險常在，「警惕動態多變的風險因素」。"}, {"id": "gx_t3_q005", "topic": 3, "num": 5, "category": "1) 國家安全的含義與基礎認知", "q": "在國家安全含義中，「須具備保障持續安全狀態的能力」具體是指國家應當採取甚麼舉措？", "options": ["不斷加強能力建設防範化解風險與實質危害", "僅維持常備陸軍人員數量規模長期不變即可", "封閉所有對外經貿口岸全面禁止外國人入境", "完全依賴國際法庭進行事後被動法律調解之"], "answer": 0, "explanation": "「須具備保障持續安全狀態的能力」是指不斷加強維護國家安全的能力建設，防範和化解風險因素和實質危害。"}, {"id": "gx_t3_q006", "topic": 3, "num": 6, "category": "1) 國家安全的含義與基礎認知", "q": "引用都德名作《最後一課》講述居民被禁學母語的悲劇，旨在闡釋甚麼深刻道理？", "options": ["掌握多種外語對於個人國際商貿往來最重要", "普法戰爭時期德國的初等教育體制更為完善", "地方中小學校可以自行決定課堂使用何語言", "國家安全是國民福祉與文化尊嚴的根本保障"], "answer": 3, "explanation": "《最後一課》表明：國破家亡則文化與自由難存，國家安全是人民福祉、文化尊嚴和個人權利的根本前提。"}, {"id": "gx_t3_q007", "topic": 3, "num": 7, "category": "1) 國家安全的含義與基礎認知", "q": "世界各國均高度重視維護國家安全的法律建設，下列哪一部法律屬於英國的國家安全法規？", "options": ["《國家保安法》與《反騷亂刑事處罰條例》", "《外國投資與國家安全法》及《外患援助法》", "《英國叛逆重罪法》及《反恐和邊境安全法令》", "《外患誘致罪法》與《戰時國土緊急保衛法》"], "answer": 2, "explanation": "表格載明：英國的國安法規包括《英國叛逆重罪法 1848》及《反恐和邊境安全法令 2015》。"}, {"id": "gx_t3_q008", "topic": 3, "num": 8, "category": "1) 國家安全的含義與基礎認知", "q": "歸納現代國家安全面臨的不同方面，下列哪一組涵蓋了導學案列舉的四個不同方面？", "options": ["外部威脅內在動亂資源供應失衡與自然災害", "通貨膨脹貨幣貶值股市波動與民間合約糾紛", "勞工短缺公務員加薪公共房屋不足交通擁堵", "跨國並購版權侵權商標註冊紛爭與技術壁壘"], "answer": 0, "explanation": "總結維護國安的四個方面為：外部威脅/國際衝突、內在動亂/社會秩序和治安國外威脅、資源供應（社經發展）、自然災害。"}, {"id": "gx_t3_q009", "topic": 3, "num": 9, "category": "2) 總體國家安全觀五大要素", "q": "國家主席習近平於2014年首次提出「總體國家安全觀」，其五大要素中的「宗旨」是甚麼？", "options": ["堅持以軍事實力擴張為其宗旨", "堅持以對外貿易出超為其宗旨", "堅持以地緣政治博弈為其宗旨", "堅持以人民安全為最高宗旨"], "answer": 3, "explanation": "五大要素之首是「以人民安全為宗旨」。"}, {"id": "gx_t3_q010", "topic": 3, "num": 10, "category": "2) 總體國家安全觀五大要素", "q": "在「總體國家安全觀」的五大要素中，作為維護國家安全的「根本」的是哪一項？", "options": ["堅持以科技自立自強為根本", "堅持以生態環境保護為根本", "堅持以政治安全為其根本", "堅持以金融資本穩定為根本"], "answer": 2, "explanation": "五大要素中「以政治安全為根本」。"}, {"id": "gx_t3_q011", "topic": 3, "num": 11, "category": "2) 總體國家安全觀五大要素", "q": "在「總體國家安全觀」的五大要素中，維繫國家各項事業發展與安全的「基礎」是甚麼？", "options": ["堅持以文化宣傳引導為基礎", "堅持以經濟安全為其基礎", "堅持以深海極地科考為基礎", "堅持以社會輿論管控為基礎"], "answer": 1, "explanation": "五大要素中「以經濟安全為基礎」。"}, {"id": "gx_t3_q012", "topic": 3, "num": 12, "category": "2) 總體國家安全觀五大要素", "q": "在「總體國家安全觀」的五大要素中，發揮堅強「保障」作用的四大安全領域是甚麼？", "options": ["以生物太空深海極地安全為保障", "以糧食能源金融生態安全為保障", "以網絡數據涉外法治安全為保障", "以軍事科技文化社會安全為保障"], "answer": 3, "explanation": "五大要素中「以軍事、科技、文化、社會安全為保障」。"}, {"id": "gx_t3_q013", "topic": 3, "num": 13, "category": "2) 總體國家安全觀五大要素", "q": "在「總體國家安全觀」的五大要素中，體現中國兼濟天下、命運與共的「依託」是甚麼？", "options": ["堅持以建立跨國軍事基地為依託", "堅持以促進國際安全為其依託", "堅持以推行單邊霸權制裁為依託", "堅持以構築封閉貿易小圈子為依託"], "answer": 1, "explanation": "五大要素中「以促進國際安全為依託」。"}, {"id": "gx_t3_q014", "topic": 3, "num": 14, "category": "2) 總體國家安全觀五大要素", "q": "將「總體國家安全觀」五大要素完整串聯，其法理嚴謹的正確表述是下列哪一項？", "options": ["以軍事實力為宗旨以政治主權為根本以科技研發為基礎", "以國土完整為宗旨以金融穩定為根本以軍事威懾為基礎", "以人民安全為宗旨以政治安全為根本以經濟安全為基礎", "以政權鞏固為宗旨以意識形態為根本以資源儲備為基礎"], "answer": 2, "explanation": "規範表述：以人民安全為宗旨，以政治安全為根本，以經濟安全為基礎，以軍事、科技、文化、社會安全為保障，以促進國際安全為依託。"}, {"id": "gx_t3_q015", "topic": 3, "num": 15, "category": "2) 總體國家安全 圍的法律", "限於香港本地公務員退休福利保障制度之細則"], "answer": 2, "explanation": "任何列入附件三的法律，限於有關國防、外交和其他按本法規定不屬於特區自治範圍的法律。"}, {"id": "gx_t3_q048", "topic": 3, "num": 48, "category": "6) 香港實施全國性法律憲制責任", "q": "香港特區在實施列入附件三的全國性法律時，決定採用公布還是本地立法的考量是甚麼？", "options": ["取決於特區立法會當時是否有足夠議員出席會議", "顧及兩地法律制度及實際情況若有必要適應則本地立法", "視乎外國政府是否就該法案提出雙邊外交交涉", "凡是經濟法案一律本地立法其餘法案一律公布"], "answer": 1, "explanation": "為顧及內地與香港在法律制度和實際情況的差異，若有必要作本地化修改適應才可實施，便透過本地立法；否則公布。"}, {"id": "gx_t3_q049", "topic": 3, "num": 49, "category": "6) 香港實施全國性法律憲制責任", "q": "《中華人民共和國香港特別行政區維護國家安全法》在香港特區是採取甚麼方式落地實施的？", "options": ["由香港特區立法會耗時三年完成三讀立法審議實施", "由香港終審法院全體法官投票一致表決頒布實施", "由全港市民一人一票進行公民投票確認後方實施", "由常委會通過列入附件三特區政府直接刊憲公布實施"], "answer": 3, "explanation": "2020年6月30日人大常委會全票通過國安法列入附件三，香港特區政府刊憲「公布」實施。"}, {"id": "gx_t3_q050", "topic": 3, "num": 50, "category": "6) 香港實施全國性法律憲制責任", "q": "香港特區切實履行實施列入附件三全國性法律的憲制責任，在法理上具有甚麼重要意義？", "options": ["徹底廢除了香港原有的普通法體系與審判傳統", "落實國家主權安全維護憲制秩序並推動良政善治", "使香港特區自動喪失在世界貿易組織中的獨立席位", "要求香港特區每年必須向中央財政繳納行政管理費"], "answer": 1, "explanation": "落實附件三法律是特區法定憲制責任，確保國家主權、安全與尊嚴在特區得到切實維護，維護一國兩制根基。"}, {"id": "gx_t3_q051", "topic": 3, "num": 51, "category": "7) 國安法四類罪行及刑罰", "q": "根據《香港國安法》第三章「罪行和處罰」，法律明確防範、制止和懲治的四類犯罪行為包括哪些？", "options": ["普通洗黑錢罪走私物品罪盜竊商業秘密罪及詐騙罪", "非法集會罪普通襲擊罪妨礙公務罪及毀壞公物罪名", "分裂國家顛覆政權恐怖活動與勾結境外危害國安罪", "未經批准過境罪違反交通法規罪偷稅漏稅罪及重婚罪"], "answer": 2, "explanation": "圖表清晰列出四類罪行：分裂國家罪、顛覆國家政權罪、恐怖活動罪、勾結外國或者境外勢力危害國家安全罪。"}, {"id": "gx_t3_q052", "topic": 3, "num": 52, "category": "7) 國安法四類罪行及刑罰", "q": "針對「分裂國家罪」及「顛覆國家政權罪」，《香港國安法》對首要分子或者罪行重大的規定的刑罰是甚麼？", "options": ["處拘役六個月或者罰款五千港元之行政處罰", "處無期徒刑或者十年以上有期徒刑的法定重刑", "一律判處死刑立即執行且不允許上訴覆核", "處以五年監禁並強制遣送出境永遠不得入境"], "answer": 1, "explanation": "下方註釋特別註明：針對分裂國家罪及顛覆國家政權罪，對首要分子或者罪行重大的，「處無期徒刑或者十年以上有期徒刑」。"}, {"id": "gx_t3_q053", "topic": 3, "num": 53, "category": "7) 國安法四類罪行及刑罰", "q": "組織、策劃、實施旨在將香港特別行政區從中華人民共和國分離出去的行為，構成甚麼罪行？", "options": ["構成《香港國安法》規定的分裂國家罪", "構成香港本地法例中的非法商業壟斷罪", "構成普通法體系中的普通侵權民事訴訟", "構成侵害他人商標專用權的商業違規行為"], "answer": 0, "explanation": "企圖破壞國家統一、將領土分裂出去的行為均構成《香港國安法》規定的「分裂國家罪」。"}, {"id": "gx_t3_q054", "topic": 3, "num": 54, "category": "7) 國安法四類罪行及刑罰", "q": "以武力、威脅使用武力或者其他非法手段旨在推翻中華人民共和國根本制度的行為，屬於甚麼罪行？", "options": ["構成《香港國安法》規定的顛覆國家政權罪", "構成普通刑事法律中的重大責任安全事故罪", "構成破壞社會治安秩序的尋釁滋事違例行為", "構成阻礙消防人員執行救援公務的行政違法"], "answer": 0, "explanation": "企圖以非法手段推翻國家根本制度或政權機關的行為，屬於《香港國安法》規定的「顛覆國家政權罪」。"}, {"id": "gx_t3_q055", "topic": 3, "num": 55, "category": "7) 國安法四類罪行及刑罰", "q": "組織、策劃、實施造成嚴重社會危害的危險活動，意圖脅迫中央人民政府或特區政府，構成甚麼罪？", "options": ["構成特區交通條例中的危險駕駛汽車罪名", "構成《香港國安法》規定的恐怖活動罪", "構成民事法律中的未經許可佔用公共街道罪", "構成違法燃放煙花爆竹的市容環境違例罪名"], "answer": 1, "explanation": "造成嚴重社會危害、危害公眾生命財產並意圖脅迫政府的危險暴力活動，構成「恐怖活動罪」。"}, {"id": "gx_t3_q056", "topic": 3, "num": 56, "category": "7) 國安法四類罪行及刑罰", "q": "為外國機構非法提供涉及國家安全的情報，或請求外國對香港特區施加制裁，構成甚麼罪行？", "options": ["構成勾結外國或者境外勢力危害國家安全罪", "構成海關通關手續中的走私違禁物品貨物罪", "構成普通公司法中的發布虛假商業廣告宣傳", "構成未按期繳納利得稅的稅務遲延行政過失"], "answer": 0, "explanation": "這屬於《香港國安法》第四類重點打擊的罪行：「勾結外國或者境外勢力危害國家安全罪」。"}, {"id": "gx_t3_q057", "topic": 3, "num": 57, "category": "7) 國安法四類罪行及刑罰", "q": "《香港國安法》將重大罪行的最高刑罰設置為「無期徒刑」，其立法設計體現了甚麼特點？", "options": ["與內地法律標準接軌彰顯事權威嚴且特區不設死刑", "完全採用英國普通法傳統的輕微社會服務令標準", "授權法官在審判時不需要任何事實證據即可自由判刑", "規定所有涉案嫌疑人一律不得聘請律師出庭抗辯"], "answer": 0, "explanation": "罰則依據國家法律標準設置，最高罰則與內地法律接軌可判無期徒刑；同時香港特區不設死刑，兼顧兩制差異與中央事權威嚴。"}, {"id": "gx_t3_q058", "topic": 3, "num": 58, "category": "7) 國安法四類罪行及刑罰", "q": "《香港國安法》在打擊範圍與人權保障之間的平衡原則是甚麼？", "options": ["無差別對所有發表批評意見的市民實施全面人身拘留", "強制所有外資在港企業定期繳納額外國家安全保證金", "全面取消香港特別行政區居民享有的所有合法私隱權", "精準打擊極少數嚴重危害國安分子保障廣大市民自由"], "answer": 3, "explanation": "《香港國安法》嚴格精準懲治極少數嚴重危害國安的犯罪分子，切實保障絕大多數市民依法享有的各項權利和自由。"}, {"id": "gx_t3_q059", "topic": 3, "num": 59, "category": "8) 與國安法有關的機構及職能", "q": "香港特別行政區設立的負責承擔維護國家安全主要責任的專門機構全稱是甚麼？", "options": ["香港特區立法會國家安全防務特別委員會", "香港保安局國家安全跨部門緊急聯絡工作組", "香港終審法院國家安全審判巡迴專門法庭", "香港特別行政區維護國家安全委員會"], "answer": 3, "explanation": "特區設立的機構為「香港特別行政區維護國家安全委員會」（國安委）。"}, {"id": "gx_t3_q060", "topic": 3, "num": 60, "category": "8) 與國安法有關的機構及職能", "q": "香港特別行政區維護國家安全委員會（國安委）的主席是由誰擔任？", "options": ["由特區終審法院首席法官出任國安委主席", "由香港特別行政區行政長官親自擔任主席", "由警務處副處長（國家安全）出任國安委主席", "由律政司司長兼任國安委專職主席負責領導"], "answer": 1, "explanation": "香港特區國安委的主席為「香港特別行政區行政長官」。"}, {"id": "gx_t3_q061", "topic": 3, "num": 61, "category": "8) 與國安法有關的機構及職能", "q": "香港特區維護國家安全委員會的主要法定職能包括甚麼？", "options": ["直接下達軍事作戰命令指揮駐軍開展實彈演習任務", "替代各級法院獨立行使審判權並直接判處罪犯刑期", "專門負責審批香港永久性居民前往外國移民之申請", "負責制定特區國安政策並推進法律制度及執行機制"], "answer": 3, "explanation": "標明特區國安委職能為：「制定國安政策」、「推進法律制度及執行機制」。"}, {"id": "gx_t3_q062", "topic": 3, "num": 62, "category": "8) 與國安法有關的機構及職能", "q": "中央人民政府在香港特別行政區設立的維護國家安全機構全稱是甚麼？", "options": ["中央軍委駐香港特別行政區軍事防務指揮司令部", "國務院港澳事務辦公室駐香港特別行政區辦事處", "國家安全部駐香港特別行政區情報收集聯絡總部", "中央人民政府駐香港特別行政區維護國家安全公署"], "answer": 3, "explanation": "標明：中央設立的機構為「中央人民政府駐香港特別行政區維護國家安全公署」（駐港國安公署）。"}, {"id": "gx_t3_q063", "topic": 3, "num": 63, "category": "8) 與國安法有關的機構及職能", "q": "中央駐港國安公署的主要法定職能包括哪些方面？", "options": ["直接指揮香港警務處各警區的日常交通巡邏與執法", "負責督導意見與建議收集情報並依法處理特定案件", "審查並修改香港立法會通過的所有普通民事法律法規", "全權管理香港特區政府的日常財政稅收與開支預算"], "answer": 1, "explanation": "公署職能為：督導、意見/建議、收集情報、依法處理案件。"}, {"id": "gx_t3_q064", "topic": 3, "num": 64, "category": "8) 與國安法有關的機構及職能", "q": "下列哪一項「不屬於」駐港國安公署經批准後對案件行使管轄權的三種特定法定情形？", "options": ["特區內發生涉及兩家跨國商會普通民事商業違約紛爭", "案件涉及外國或者境外勢力介入複雜情況特區管轄有困難", "出現香港特區政府無法有效執行本法之嚴重情況之時", "出現國家安全面臨重大現實威脅情況需要公署管轄之時"], "answer": 0, "explanation": "註釋列出三種情形：外力介入管轄困難、特區無法有效執行、面臨重大現實威脅。A選項屬普通商事糾紛，公署絕不管轄。"}, {"id": "gx_t3_q065", "topic": 3, "num": 65, "category": "9) 國安法實施貫徹一國兩制", "q": "深入思考《香港國安法》的實施如何貫徹「一國兩制」，應從哪兩個維度切入？", "options": ["從「全面管治權」與「高度自治權」兩維度思考", "從「普通法體系」與「大陸法體系」兩維度思考", "從「中央財政撥款」與「特區稅收自留」兩維度思考", "從「國際外交互動」與「區域自由貿易」兩維度思考"], "answer": 0, "explanation": "標題明確給出兩個思考維度：「全面管治權」與「高度自治權」。"}, {"id": "gx_t3_q066", "topic": 3, "num": 66, "category": "9) 國安法實施貫徹一國兩制", "q": "在「全面管治權」維度，全國人大按《憲法》第31條為特區立法，體現了甚麼憲制原則？", "options": ["國家安全屬中央事權中央對特區擁有全面管治權", "中央決定徹底廢除香港特區享有的一切行政管理權力", "香港特區立法會不再具備制定任何本地條例的資格", "香港特區司法機關必須向最高人民檢察院逐筆匯報"], "answer": 0, "explanation": "中央政府按憲法31條規定為特區制定國安法，體現「國家安全屬中央事權」，體現全面管治權。"}, {"id": "gx_t3_q067", "topic": 3, "num": 67, "category": "9) 國安法實施貫徹一國兩制", "q": "在「全面管治權」維度，設立駐港國安公署並保留對極少數危害國安案件的管轄權，體現了甚麼？", "options": ["中央全面接管特區所有的裁判法院與懲教監獄機構", "中央派員直接主持香港各大上市公司董事會會議", "中央對特區行使最終安全管治權與兜底防線作用", "中央禁止香港特區本地律師參與任何法律訴訟辯護"], "answer": 2, "explanation": "公署在特定嚴重情形下行使管轄權，是中央維護國家安全的兜底防線，彰顯中央全面管治權。"}, {"id": "gx_t3_q068", "topic": 3, "num": 68, "category": "9) 國安法實施貫徹一國兩制", "q": "在「兩制／高度自治權」維度，中央「下放權力」在工作機制設置上的最核心體現是甚麼？", "options": ["所有涉案嫌疑人無論情節輕重一律押解移送內地審判", "由中央直接任命內地法官擔任特區法院首席大法官", "特區政府不需要就國安工作向中央承擔任何問責責任", "由特區設國安委承擔主要責任絕大多數案件自行管轄"], "answer": 3, "explanation": "體現高度自治權在於中央「下放權力」，由特區國安委承擔主要責任，絕大多數案件由香港執法及司法部門自行管轄。"}, {"id": "gx_t3_q069", "topic": 3, "num": 69, "category": "9) 國安法實施貫徹一國兩制", "q": "絕大多數國安案件由香港執法部門調查、律政司檢控及特區法院審理，這體現了對特區甚麼制度的尊重？", "options": ["體現對香港本地古代宗法習慣法民間仲裁制度的尊重", "體現對香港特區普通法制度及獨立司法權終審權尊重", "體現對外國議會所作出的各項外交法案與命令的尊重", "體現對國際商業仲裁機構跨國行政管轄特權之尊重"], "answer": 1, "explanation": "案件由特區依本地法定程序與普通法原則獨立審理，充分體現中央對「兩制」及香港特區獨立司法體系的極大尊重。"}, {"id": "gx_t3_q070", "topic": 3, "num": 70, "category": "9) 國安法實施貫徹一國兩制", "q": "特區執法及司法部門在自行管轄案件時，「接受中央人民政府的監督和問責」說明了甚麼？", "options": ["中央人民政府將直接派員介入每一宗案件的每日庭審", "高度自治權不是完全自治而是中央授權下的地方自治", "特區法院法官的所有審判結果必須由中央軍委投票核准", "行政長官不再向香港特區負責而只對國務院部門負責"], "answer": 1, "explanation": "特區權力源於中央授權，行使高度自治權必須接受中央的憲制監督與問責，符合單一制國家原則。"}, {"id": "gx_t3_q071", "topic": 3, "num": 71, "category": "9) 國安法實施貫徹一國兩制", "q": "《香港國安法》的實施如何體現「全面管治權」與「高度自治權」的有機結合？", "options": ["全面管治權取代了特區所有的自治權使兩制完全消失", "高度自治權排斥中央的一切主權行為使特區成為獨立實體", "兩項權力在現實司法審判中完全相互對立且無法並存", "中央掌握最高事權並提供法制保障特區承擔主體管轄責任"], "answer": 3, "explanation": "中央立法立規、設立機構兜底（全面管治權），特區承擔主要責任、自主執法司法（高度自治權），兩者相得益彰。"}, {"id": "gx_t3_q072", "topic": 3, "num": 72, "category": "9) 國安法實施貫徹一國兩制", "q": "總結而言，築牢國家安全屏障對落實「一國兩制」方針的最根本歷史意義是甚麼？", "options": ["徹底消除兩地之間的制度差異並全面實施社會主義法規", "使香港特區放棄作為國際金融中心與自由貿易港之定位", "堅守一國底線為兩制繁榮穩定提供最穩固環境確保行穩致遠", "限制香港企業與海外西方國家開展任何正常貿易往來"], "answer": 2, "explanation": "國家安全是「一國兩制」的基石，「一國」底線越牢，「兩制」優勢越能充分發揮，確保一國兩制實踐行穩致遠。"}, {"id": "gx_t3_q073", "topic": 3, "num": 73, "category": "10) 推動國家安全教育的重要性", "q": "根據《香港國安法》第九條及第十條，特區應當通過哪些渠道和載體積極開展國家安全教育？", "options": ["僅限於香港各高等院校法律系專業課程進行閉門研討", "僅限於特區公務員事務局內部刊物進行非公開通報學習", "通過學校社會團體媒體及網絡等加強宣傳指導監督管理", "僅限於電視廣播電台在深夜時段進行單向公益廣告宣傳"], "answer": 2, "explanation": "引用國安法第9、10條：特區應當對學校、社會團體、媒體、網絡等採取必要措施，開展國安教育。"}, {"id": "gx_t3_q074", "topic": 3, "num": 74, "category": "10) 推動國家安全教育的重要性", "q": "全國人大常委會於2015年通過《國家安全法》，將每年的哪一天確定為「全民國家安全教育日」？", "options": ["確定每年七月一日為全民國家安全教育日", "確定每年十月一日為全民國家安全教育日", "確定每年四月十五日為全民國家安全教育日", "確定每年十二月四日為全民國家安全教育日"], "answer": 2, "explanation": "2015年7月1日人大常委會通過《國家安全法》，將「每年4月15日」確定為全民國家安全教育日。"}, {"id": "gx_t3_q075", "topic": 3, "num": 75, "category": "10) 推動國家安全教育的重要性", "q": "列舉了「惜食——國家糧食安全」、「仿古青銅器工藝坊」等例子，這說明國安教育具有甚麼特點？", "options": ["說明糧食供應和傳統青銅文化與國家安全毫無內在關聯", "表明國家安全教育活動只能在各類歷史博物館室內進行", "貼近生活與中華文化涵蓋非傳統安全非僅死記硬背法條", "要求所有中小學校取消常規體育課全面改為農耕勞動課"], "answer": 2, "explanation": "列舉生動活動，說明國安教育注重融入生活、文化與各重點領域，引導學生多維理解安全內涵。"}, {"id": "gx_t3_q076", "topic": 3, "num": 76, "category": "10) 推動國家安全教育的重要性", "q": "積極推動國家安全教育在「提高公眾安全意識」方面的核心重要性是甚麼？", "options": ["全面理解國安重要性使自覺維護國安成為自發責任良好氛圍", "強制要求全港每位成年市民考取專業安保人員執業資格證", "全面禁止香港居民閱讀任何境外新聞出版機構發表的文章", "直接替代香港警務處各警區負責所有的日常市區治安巡邏"], "answer": 0, "explanation": "答題方向：增強公眾全面認識國安重要性（文化、資源安全等），使自覺維護國安成為自發行為和責任，形成良好氛圍。"}, {"id": "gx_t3_q077", "topic": 3, "num": 77, "category": "10) 推動國家安全教育的重要性", "q": "推動國家安全教育在「增強公眾應對安全風險能力」方面的具體核心價值是甚麼？", "options": ["培養風險識別危機應對緊急避險能力降低損失維護穩定", "要求所有市民必須熟練掌握野外生存與特種作戰實戰技能", "訓練全體公眾參與正規軍事演習的作戰指揮與沙盤推演", "強制所有市民在日常生活中停止使用智能手機電腦網絡"], "answer": 0, "explanation": "培養公眾風險識別、危機應對和緊急避險能力（災害、氣候、網攻、數據等），面臨威脅做出正確反應，最大限度降低損失。"}, {"id": "gx_t3_q078", "topic": 3, "num": 78, "category": "10) 推動國家安全教育的重要性", "q": "面對網絡釣魚詐騙、勒索軟件攻擊及個人敏感數據洩露等非傳統安全威脅，國安教育發揮甚麼防護作用？", "options": ["要求市民徹底放棄在互聯網上進行任何電子商務購物消費", "由政府情報機構接管全港所有私人電腦的日常開機密碼", "禁止任何海外科技企業在香港開展軟件開發與數據存儲", "提升市民網絡數據安全素養築牢抵禦網絡攻擊的人民防線"], "answer": 3, "explanation": "通過國安教育增強全社會對網絡攻擊與數據竊取的防範意識，提高公眾數字素養，有效維護網絡與數據安全。"}, {"id": "gx_t3_q079", "topic": 3, "num": 79, "category": "10) 推動國家安全教育的重要性", "q": "在學校深入開展國家安全教育，對香港青少年學生的長遠成長具有甚麼根本育人價值？", "options": ["迫使學生將全部課外活動時間改為背誦國家安全法條文", "增強國家認同民族自豪感樹立守法意識成長為負責任公民", "限制香港青少年報考任何海外世界知名大學的留學申請", "要求學生在社交媒體上禁止與任何外籍青年進行文化交流"], "answer": 1, "explanation": "學習目標：建立維護國安自覺意識，增強守法意識，培養愛國心、民族認同感，成長為具備世界視野與大局觀的負責任良好公民。"}, {"id": "gx_t3_q080", "topic": 3, "num": 80, "category": "10) 推動國家安全教育的重要性", "q": "總結而言，全社會積極推動國家安全教育，對香港特區繁榮穩定與長治久安的最根本意義是：", "options": ["促使香港特區全面轉變為重工業製造為主的內陸型城市", "築牢維護國家安全社會心理防線營造和諧穩定社會大環境", "大幅削減特區政府在公共基礎設施建設上的財政投資額", "消除香港特區作為自由開放國際大都會的所有傳統優勢"], "answer": 1, "explanation": "國家安全教育築牢社會防線、凝聚全民共識，為社會穩定和人民安居樂業提供堅實保障，護航「一國兩制」行穩致遠。"}, {"id": "gx_t4_q001", "topic": 4, "num": 1, "category": "1) 特區政治體制的特點", "q": "何謂「政治體制」的基本定義？", "options": ["地方各級行政官員進行日常績效考核規範", "民間慈善機構與國際非政府組織聯絡機制", "國家軍事武裝部隊指揮調配之專門法規條", "政治權力行政立法和司法權力的組織形式"], "answer": 3, "explanation": "定義：「政治體制」是指「政治權力（行政、立法和司法權力）的組織形式」。"}, {"id": "gx_t4_q002", "topic": 4, "num": 2, "category": "1) 特區政治體制的特點", "q": "全國人大法工委李飛曾指出，香港特區政治體制保留了原體制行之有效部分，主要表現在甚麼原則？", "options": ["主要表現在實行以特首為核心的行政主導", "主要表現在實行議會至上的立法主導模式", "主要表現在多黨輪流執政的競選對立架構", "主要表現在司法審判權凌駕於一切政治權力"], "answer": 0, "explanation": "「特區的政治體制保留原政治體制行之有效的部分，主要表現在行政主導。」"}, {"id": "gx_t4_q003", "topic": 4, "num": 3, "category": "1) 特區政治體制的特點", "q": "下列哪一項「不屬於」香港特區政治體制的四個特點之一？", "options": ["行政主導且由行政長官領導特區依法施政", "立法會享有凌駕於行政機關之上絕對權力", "行政與立法機關之間相互配合及相互制衡", "司法獨立且行政長官代表香港對中央負責"], "answer": 1, "explanation": "四個特點：1.行政主導；2.行政與立法相互配合及制衡；3.司法獨立；4.行政長官代表香港區對中央負責。A選項錯誤。"}, {"id": "gx_t4_q004", "topic": 4, "num": 4, "category": "1) 特區政治體制的特點", "q": "香港特區政治體制中，「行政主導」與「行政立法相互配合及制衡、司法獨立」處於甚麼關係？", "options": ["行政主導完全排斥任何形式的立法機關監督權", "三者相輔相成並行不悖共同構成政制設計原則", "司法獨立意味著法官可以隨意撤銷所有政府法案", "立法會可以隨意接管行政長官所有日常行政權力"], "answer": 1, "explanation": "「行政主導的原則可以與行政立法相互配合和制衡，以及與司法獨立並行不悖，三者均為特區政制設計背後的原則。」"}, {"id": "gx_t4_q005", "topic": 4, "num": 5, "category": "1) 特區政治體制的特點", "q": "在香港特區政治架構中，代表整個香港特別行政區向中央人民政府負責的最高代表是誰？", "options": ["由特區立法會主席代表全體市民向中央負責", "由香港終審法院首席法官代表特區對外聯絡", "由香港特別行政區行政長官代表特區負責", "由政務司司長統籌領導代表特區向北京報告"], "answer": 2, "explanation": "特區政治體制第四個特點為「行政長官代表香港區對中央負責」。"}, {"id": "gx_t4_q006", "topic": 4, "num": 6, "category": "1) 特區政治體制的特點", "q": "香港特區政治體制設計保留了原有體制行之有效的部分，這體現了甚麼根本方針？", "options": ["體現貫徹落實一國兩制與保持長期繁榮穩定", "體現全盤照搬西方三權分立相互對抗之模式", "體現取消香港普通法傳統改採內地行政法規", "體現使香港特區逐步轉化為完全自治之實體"], "answer": 0, "explanation": "保留原有行之有效的行政主導體制，旨在保證政府施政效率，貫徹「一國兩制」方針，維護香港社會經濟長期繁榮穩定。"}, {"id": "gx_t4_q007", "topic": 4, "num": 7, "category": "1) 特區政治體制的特點", "q": "在特區政制中，「行政與立法相互配合及制衡」的制度價值體現在哪一方面？", "options": ["導致行政機關與立法機關陷入長期的惡性內耗", "賦予立法會隨意推翻行政長官施政報告特權", "促使特區政府所有日常公務員薪酬停發審計", "既保障行政主導施政效率又落實立法合法監督"], "answer": 3, "explanation": "配合確保政府政策順暢推行，制衡防止行政權力濫用，兩者結合確保良政善治。"}, {"id": "gx_t4_q008", "topic": 4, "num": 8, "category": "1) 特區政治體制的特點", "q": "「司法獨立」在香港特區政治體制中發揮著甚麼至關重要的功能？", "options": ["法院可以直接代替特區政府制定經濟發展規劃", "法官有權隨意任命特區各決策局主要官員人選", "司法機關享有向市民直接徵收特別稅款之權限", "法院獨立行使審判權不受任何干涉維護法治"], "answer": 3, "explanation": "司法獨立確保法院純粹依據法律與事實作出公正判決，不受行政與立法機關干涉，守護法治核心價值。"}, {"id": "gx_t4_q009", "topic": 4, "num": 9, "category": "2) 「行政主導」的三大特徵", "q": "在《基本法》規定下，香港「行政主導」的特徵主要從哪三方面體現？", "options": ["財政稅收分配權貨幣發行權與海關監管權力", "行政長官憲制地位立法權以及人事任免權", "防務駐軍指揮權外事條約締結權與領事派駐", "公務員編制審批法定機構監管與諮詢委員會"], "answer": 1, "explanation": "表格明確載明：行政主導特徵從三方面體現：「行政長官的憲制地位」、「立法權」、「任免權」。"}, {"id": "gx_t4_q010", "topic": 4, "num": 10, "category": "2) 「行政主導」的三大特徵", "q": "行政主導特徵（一）中，行政長官具有怎樣的特殊憲制地位？", "options": ["行政長官與立法會主席處於完全平等的地位", "行政長官擁有具備「凌駕性」之憲制地位", "行政長官地位低於終審法院首席法官之權威", "行政長官僅享有禮儀虛位並無任何實質職權"], "answer": 1, "explanation": "特徵（一）紅字填空明確指出：行政長官擁有具「凌駕性」的憲制地位。"}, {"id": "gx_t4_q011", "topic": 4, "num": 11, "category": "2) 「行政主導」的三大特徵", "q": "根據《基本法》第四十三條及第六十條，行政長官在身份架構上兼具哪兩重職位？", "options": ["既是特區立法會主席又是終審法院名譽院長", "既是行政會議首席代表又是外國商會名譽會長", "既是特區首長同時亦是特區政府的首長職責", "既是警務處最高指揮官又是審計署法定主管人"], "answer": 2, "explanation": "基本法第43及60條規定，行政長官是香港特區的首長，同時亦是香港特區政府的首長。"}, {"id": "gx_t4_q012", "topic": 4, "num": 12, "category": "2) 「行政主導」的三大特徵", "q": "為何說行政長官的憲制地位具有「凌駕性」？給出的具體法理表述是：", "options": ["行政長官有權隨意判決任何公民入獄無需經法庭", "行政長官可以單方面宣布廢除香港全部普通法規", "行政長官憲制地位凌駕於立法會主席與首席法官", "行政長官行使職權不需要遵守國家憲法任何規定"], "answer": 2, "explanation": "行政長官代表並領導特區及特區政府，「行政長官憲制地位凌駕於立法會主席及終審法院首席法官之上」。"}, {"id": "gx_t4_q013", "topic": 4, "num": 13, "category": "2) 「行政主導」的三大特徵", "q": "根據《基本法》第七十六條，立法會通過的法案必須履行甚麼程序方能正式生效？", "options": ["法案由立法會主席簽署刊登憲報即可直接生效", "法案必須須經行政長官簽署公布方能生效", "法案必須交由全港選民進行公民投票表決生效", "法案須經終審法院開庭進行司法審查方可生效"], "answer": 1, "explanation": "《基本法》第七十六條規定「香港特別行政區立法會通過的法案，須經行政長官簽署、公布，方能生效」。"}, {"id": "gx_t4_q014", "topic": 4, "num": 14, "category": "2) 「行政主導」的三大特徵", "q": "行政主導特徵（二）表明行政長官在立法層面掌握了甚麼重大權力？", "options": ["行政長官享有直接代替立法會制定法律全權", "行政長官在立法層面掌握了「立法否決權」", "行政長官有權單方面修改立法會表決議事規則", "行政長官可以隨意撤銷立法會所有議員的提案"], "answer": 1, "explanation": "特徵（二）標題明確指出：行政長官掌握「立法否決權」。"}, {"id": "gx_t4_q015", "topic": 4, "num": 15, "category": "2) 「行政主導」的三大特徵", "q": "《基本法》賦予行政長官「立法否決權」，在特區權力架構上深刻反映了甚麼事實？", "options": ["反映立法會在特區體制中處於最高統治地位", "反映特區完全不具備任何形式的地方立法權", "反映立法機關無完整立法權特首具較大權力", "反映特區法院對立法程序享有排他性管轄權"], "answer": 2, "explanation": "這反映了「立法機關並無完整的立法權，《基本法》賦予行政長官較高的地位和較大的權力，更掌握立法否決權」。"}, {"id": "gx_t4_q016", "topic": 4, "num": 16, "category": "2) 「行政主導」的三大特徵", "q": "如果立法會通過一項法案但行政長官拒絕簽署並發回重議，這體現了行政對立法的甚麼關係？", "options": ["體現行政長官公然違法破壞香港法治核心基石", "體現立法會必須立即解散並重新舉行換屆選舉", "體現行政主導下行政對立法制衡及否決機制", "體現特區普通法裁判程序徹底終止且無法運行"], "answer": 2, "explanation": "特首簽署公布法案權是行政主導的重要機制，對立法機關通過的法案行使實質把關與否決權。"}, {"id": "gx_t4_q017", "topic": 4, "num": 17, "category": "2) 「行政主導」的三大特徵", "q": "行政主導特徵（三）表明行政長官在人事架構上享有甚麼權力？", "options": ["行政長官僅能任免初級公務員而無權任免高官", "行政長官對司法機關法官完全不具備任命職能", "行政長官的人事決定必須經過立法會秘密核准", "行政長官擁有「廣泛的政治人事任免權」"], "answer": 3, "explanation": "特徵（三）紅字標題明確載明：行政長官擁有「廣泛的政治人事任免權」。"}, {"id": "gx_t4_q018", "topic": 4, "num": 18, "category": "2) 「行政主導」的三大特徵", "q": "根據《基本法》第四十八條第（五）款，行政長官在主要官員任免上的法定職權是甚麼？", "options": ["直接獨立簽發委任狀任命各司長而無需報中央", "提名並報請中央任命各司長局長並建議免職", "由行政長官組織全民普選直接選出各局局長", "由立法會全體議員以大比數投票任命主要官員"], "answer": 1, "explanation": "第48條第(五)款規定行政長官「提名並報請中央人民政府任命各司長、副司長、局長、專員等主要官員，並建議免除其職務」。"}, {"id": "gx_t4_q019", "topic": 4, "num": 19, "category": "2) 「行政主導」的三大特徵", "q": "根據《基本法》第四十八條，由行政長官提名並報請中央人民政府任命的主要官員不包括誰？", "options": ["各級法院的終審法官及區域法院普通裁判官", "政務司司長財政司司長及律政司各司長副司長", "各決策局局長及廉政專員審計署署長警務處長", "入境事務處處長海關關長等紀律部隊主要首長"], "answer": 0, "explanation": "法官的任命依照《基本法》第八十八條法定程序任免，不屬於第48條第(五)款報請中央任命的政府主要官員名單。"}, {"id": "gx_t4_q020", "topic": 4, "num": 20, "category": "2) 「行政主導」的三大特徵", "q": "根據《基本法》第五十五條，行政長官對行政會議成員行使甚麼樣的人事權限？", "options": ["行會成員必須全部由立法會主席單方面挑選指派", "行會成員全部由公務員事務局按晉升年資論資排輩", "從主要官員議員社會人士中委任其任免由特首決定", "行會成員由外國商會聯席會議投票提名特首備案"], "answer": 2, "explanation": "引用第55條：行政會議成員由行政長官從行政機關主要官員、立法會議員和社會人士中委任，「其任免由行政長官決定」。"}, {"id": "gx_t4_q021", "topic": 4, "num": 21, "category": "2) 「行政主導」的三大特徵", "q": "根據《基本法》第四十八條第（六）及（七）款，行政長官依法還享有哪些廣泛任免權？", "options": ["依照法定程序任免各級法院法官及公職人員", "直接任免全國人大常委會委員長及各省省長", "直接撤換外國駐香港總領事館的全體外交官", "隨意罷免任何一名由市民直接選出的立法會議員"], "answer": 0, "explanation": "特首依照法定程序任免各級法院法官，依照法定程序任免公職人員。"}, {"id": "gx_t4_q022", "topic": 4, "num": 22, "category": "2) 「行政主導」的三大特徵", "q": "行政長官廣泛擁有主要官員提名權、法官與公職任免權及行會成員任免權，這深刻反映了甚麼？", "options": ["反映香港特區政治權力完全集中在終審法院法官手中", "反映立法會掌握實質行政管治權特首僅為附庸顧問", "反映香港特區所有公務員均直接受英國外交部領導", "反映香港政治體制屬由行政長官領導及作為核心"], "answer": 3, "explanation": "總結強調：特首擁有廣泛人事任免權，「反映香港政治體制屬由行政長官領導及作為核心」。"}, {"id": "gx_t4_q023", "topic": 4, "num": 23, "category": "2) 「行政主導」的三大特徵", "q": "在行政主導體制下，特區政府在立法議案提出方面享有甚麼專屬優勢？", "options": ["任何議員均可隨意提出涉及重大財政開支私人草案", "政府提出的所有政策法案必須由外國專家全權起草", "絕大多數法案由政府提出且涉及財政收支法案專屬政府", "立法會議員提出的法律草案享有優先審議表決特權"], "answer": 2, "explanation": "基本法第74條明定：凡涉及公共開支、政治體制或政府運作之法案專屬政府提出，保障行政主導。"}, {"id": "gx_t4_q024", "topic": 4, "num": 24, "category": "2) 「行政主導」的三大特徵", "q": "總結而言，行政長官具凌駕性憲制地位、掌握立法否決權及人事任免權，共同構築了甚麼政制格局？", "options": ["構築了以行政長官為核心的高效行政主導政制體系", "構築了立法會專政並隨時彈劾政府的議會至上體制", "構築了特首享有無限專制權力的君主專制封建體制", "構築了完全脫離中央監督管轄的獨立自主自治體系"], "answer": 0, "explanation": "三大特徵相輔相成，共同確立了香港特區以行政長官為核心、行政主導的高效治理架構。"}, {"id": "gx_t4_q025", "topic": 4, "num": 25, "category": "3) 行政長官產生辦法與職能", "q": "根據《基本法》第四十四條，擔任香港特別行政區行政長官須符合哪些嚴格法定資格？", "options": ["年滿35周歲通常居港滿10年可保留外國國籍永久居民", "年滿40周歲通常居港滿20年無外國居留權永久居民中國公民", "年滿45周歲通常居港滿15年必須具有外國留學背景公民", "年滿50周歲居港滿30年且必須曾出任問責局長之人士"], "answer": 1, "explanation": "引用第44條：行政長官由「年滿四十周歲，在香港通常居住連續滿二十年並在外國無居留權的香港特區永久性居民中的中國公民擔任」。"}, {"id": "gx_t4_q026", "topic": 4, "num": 26, "category": "3) 行政長官產生辦法與職能", "q": "根據《基本法》第四十六條，香港特區行政長官每屆任期幾年？可連任幾次？", "options": ["每屆任期四年且依法最多可連任兩次", "每屆任期五年且連任次數不設任何限制", "每屆任期五年且依法只可連任一次", "每屆任期三年且卸任後終身不得再次參選"], "answer": 2, "explanation": "《基本法》第四十六條規定，行政長官每屆「任期五年，可連任一次」。"}, {"id": "gx_t4_q027", "topic": 4, "num": 27, "category": "3) 行政長官產生辦法與職能", "q": "根據《基本法》附件一，負責選出行政長官候任人的「選舉委員會」共有多少名委員？", "options": ["選舉委員會委員總人數共有一千二百人", "選舉委員會委員總人數共有八百人整", "選舉委員會委員總人數共有二千人整", "選舉委員會委員總人數共有一千五百人"], "answer": 3, "explanation": "完善選舉制度後，選舉委員會委員共1500人。"}, {"id": "gx_t4_q028", "topic": 4, "num": 28, "category": "3) 行政長官產生辦法與職能", "q": "選舉委員會由五大界別人士均衡組成，每個界別的法定委員人數是多少人？", "options": ["五個界別中每個界別各三百人", "五個界別中每個界別各二百人", "五個界別中每個界別各四百人", "界別名額按人口比例隨意浮動"], "answer": 0, "explanation": "第一至第五界別「每界別各300人」，合計1500人。"}, {"id": "gx_t4_q029", "topic": 4, "num": 29, "category": "3) 行政長官產生辦法與職能", "q": "在行政長官選舉中，候選人須獲得不少於多少名選委會委員提名？且每界別不少於幾名？", "options": ["須獲不少於100名委員提名且每界別不少於10名", "須獲不少於150名委員提名且每界別不少於20名", "須獲不少於200名委員提名且每界別不少於30名", "須獲不少於188名委員提名且每界別不少於15名"], "answer": 3, "explanation": "重點摘錄：候選人須獲得不少於188名委員提名，且五個界別中每個界別參與提名的委員須不少於15名。"}, {"id": "gx_t4_q030", "topic": 4, "num": 30, "category": "3) 行政長官產生辦法與職能", "q": "選舉委員會一人一票無記名投票選出行政長官候任人，當選者須獲得超過多少票？", "options": ["必須獲得超過五百票相對多數即可當選", "必須獲得全體選委超過三分之二千票當選", "只要在候選人中得票最高即可宣告當選", "必須獲得超過七百五十票方為當選"], "answer": 3, "explanation": "填空載明：行政長官候任人「須獲得超過750票」（即超過全體1500名委員的半數）。"}, {"id": "gx_t4_q031", "topic": 4, "num": 31, "category": "3) 行政長官產生辦法與職能", "q": "選舉委員會選出行政長官候任人後，行政長官最終是由誰正式予以任命？", "options": ["最終由中央人民政府（國務院）正式任命", "由特區立法會全體議員投票確認後正式任命", "由終審法院首席法官簽署法律文書宣告任命", "由全國人民代表大會常務委員會委員長任命"], "answer": 0, "explanation": "行政長官由選舉委員會根據基本法選出，「由中央人民政府任命」，中央具有實質任命權。"}, {"id": "gx_t4_q032", "topic": 4, "num": 32, "category": "3) 行政長官產生辦法與職能", "q": "根據《基本法》第四十八條，下列哪一項屬於行政長官依法行使的重大法定職權？", "options": ["直接開庭主持重大刑事案件死刑覆核審判", "單方面決定向任何主權國家宣布進入戰爭", "決定政府政策發布行政命令並簽署法案", "直接撤銷全國人大常委會做出的各項決議"], "answer": 2, "explanation": "圖表列明特首職權：執行中央指令、領導政府、決定政策、發布命令、人事任免、簽署法案、執行法律等。"}, {"id": "gx_t4_q033", "topic": 4, "num": 33, "category": "4) 行政長官權力特徵與憲制地位", "q": "《基本法》賦予行政長官怎樣獨特而崇高的「憲制地位」？", "options": ["賦予行政長官「雙首長」的憲制地位", "賦予行政長官單一內閣首長的憲制地位", "賦予行政長官多黨聯盟主席的憲制地位", "賦予行政長官名譽虛位元首的憲制地位"], "answer": 0, "explanation": "標題及填空明確標示：行政長官的「憲制地位」為「雙首長」。"}, {"id": "gx_t4_q034", "topic": 4, "num": 34, "category": "4) 行政長官權力特徵與憲制地位", "q": "行政長官「雙首長」憲制地位的具體內涵是指哪兩重法定首長身份？", "options": ["既是特區立法會主席又是特區終審法院法官院長", "是「特別行政區」首長同時是「特區政府」首長", "既是香港總商會會長又是匯豐銀行名譽董事主席", "既是中央政治局委員又是廣東省人民政府副省長"], "answer": 1, "explanation": "行政長官是「特別行政區」的首長（代表香港特區），行政長官同時是「特別行政區政府」的首長（領導特區政府）。"}, {"id": "gx_t4_q035", "topic": 4, "num": 35, "category": "4) 行政長官權力特徵與憲制地位", "q": "《基本法》第四十三條規定行政長官對誰負責，體現了甚麼獨特權力運作特徵？", "options": ["僅對特區立法會負責體現了西方議會內閣負責制", "對中央政府和特區負責體現「雙重負責」特徵", "僅對全體本地選民負責體現了純粹直接民選體制", "直接對聯合國人權理事會負責承擔國際法律義務"], "answer": 1, "explanation": "基本法第43條規定行政長官對中央人民政府和香港特別行政區負責，體現了「雙重負責」的權力特徵。"}, {"id": "gx_t4_q036", "topic": 4, "num": 36, "category": "4) 行政長官權力特徵與憲制地位", "q": "行政長官作為「特別行政區政府首長」，其施政職能主要體現於下列哪一方面？", "options": ["領導特區政府制定公共政策推動社經民生發展", "向國家主席述職匯報地方軍事武裝部署情況", "以中國國家元首身份出席聯合國全體首腦峰會", "直接指揮人民解放軍海陸空三軍進行常規作戰"], "answer": 0, "explanation": "作為「特區政府首長」，職能是「領導香港特區政府」、「制定公共政策推動香港社經民生發展」（如發表年度施政報告）。"}, {"id": "gx_t4_q037", "topic": 4, "num": 37, "category": "4) 行政長官權力特徵與憲制地位", "q": "行政長官作為「國家一級地方首長」及「特區首長」，必須向中央履行甚麼憲制義務？", "options": ["每年向中央財政部門無償全額上繳特區財政盈餘", "由中央直接接管特區所有的民政事務辦公室運作", "對中央負責接受監督並定期向中央領導人述職", "特區所有公立醫院日常門診排期須報國務院審批"], "answer": 2, "explanation": "作為「特區首長」，屬國家一級地方首長，「須對中央負責，接受中央政府監督，向上級政府匯報工作（述職）」。"}, {"id": "gx_t4_q038", "topic": 4, "num": 38, "category": "4) 行政長官權力特徵與憲制地位", "q": "行政長官以地區領導人身份代表「中國香港」出席亞太經合組織（APEC）會議，是基於甚麼身份？", "options": ["基於香港外國記者協會特邀觀察員的民間身份", "基於特別行政區首長代表香港特區的憲制身份", "基於香港本地各進出口貿易商會聯合代理身份", "基於普通跨國商業銀行董事局成員的個人身份"], "answer": 1, "explanation": "作為「特區首長」，其工作包括「以地區領導人身份代表中國香港參加國際會議或禮節活動」。"}, {"id": "gx_t4_q039", "topic": 4, "num": 39, "category": "4) 行政長官權力特徵與憲制地位", "q": "展示了行政長官李家超向國家主席習近平述職的照片，這生動體現了甚麼？", "options": ["體現特區政府與中央政府屬於平起平坐對等主體", "體現行政長官對中央負責接受中央監督憲制秩序", "體現中央領導人直接干預特區法院具體民事審判", "體現行政長官不再承擔領導香港本地施政之職責"], "answer": 1, "explanation": "述職是行政長官向中央政府匯報工作的重要制度安排，體現中央對特區的全面管治權及特首「雙重負責」中的對中央負責。"}, {"id": "gx_t4_q040", "topic": 4, "num": 40, "category": "4) 行政長官權力特徵與憲制地位", "q": "行政長官每年發表《施政報告》，全面規劃特區公共政策，這主要體現了特首的哪重身份？", "options": ["主要體現最高立法機關常務委員會委員之職責", "主要體現終審法院首席法官宣布重大判決之職責", "主要體現特區政府首長領導政府推動民生之職責", "主要體現民間慈善機構理事會主席勸募之職責"], "answer": 2, "explanation": "發表施政報告是行政長官作為特區政府首長，行使行政管理權、領導特區政府規劃社經發展的核心體現。"}, {"id": "gx_t4_q041", "topic": 4, "num": 41, "category": "4) 行政長官權力特徵與憲制地位", "q": "行政長官「雙重負責」的憲制設計，在協調「中央」與「特區」關係上發揮了甚麼橋樑作用？", "options": ["使特區可以隨意拒絕貫徹執行中央的任何行政指令", "使中央政府完全不需要了解特區市民的民生訴求", "使行政長官可以免除遵守基本法所規定的任何義務", "上對中央負責維護主權下對特區負責維護港人利益"], "answer": 3, "explanation": "特首既代表特區對中央負責，維護國家主權安全，又領導特區政府對特區負責，服務市民繁榮，是兩者有機結合的樞紐。"}, {"id": "gx_t4_q042", "topic": 4, "num": 42, "category": "4) 行政長官權力特徵與憲制地位", "q": "根據《基本法》第四十八條第（一）款，行政長官行使的首要職權是甚麼？", "options": ["領導香港特別行政區政府", "直接指揮特區所有新聞媒體的社論審查", "兼任香港各商業銀行的首席財務審計官", "直接制定香港股市每日股票交易手續費"], "answer": 0, "explanation": "引述第48條第(一)款：行政長官行使職權「（一）領導香港特別行政區政府」。"}, {"id": "gx_t4_q043", "topic": 4, "num": 43, "category": "4) 行政長官權力特徵與憲制地位", "q": "根據《基本法》第四十八條第（二）款，行政長官在執行中央政策方面的職責是甚麼？", "options": ["可以隨意拒絕執行中央關於外交國防的任何指令", "執行中央人民政府就本法規定的事務發出的指令", "將中央發出的所有行政公函交由立法會秘密投票", "要求中央人民政府向特區政府定期支付諮詢費用"], "answer": 1, "explanation": "表格載明：執行中央指令和辦理中央授權事務——「執行中央人民政府就本法規定的有關事務發出的指令」。"}, {"id": "gx_t4_q044", "topic": 4, "num": 44, "category": "4) 行政長官權力特徵與憲制地位", "q": "根據《基本法》第四十八條，立法會通過的財政預算案和決算經行政長官簽署後，須履行甚麼程序？", "options": ["須報請聯合國開發計劃署進行國際專家審計", "須報請行政會議全體非官守成員重新投票表決", "須在報章刊登公告後由市民一人一票公投批准", "須將財政預算案和決算報中央人民政府備案"], "answer": 3, "explanation": "表格載明：簽署立法會通過的財政預算案，「將財政預算、決算報中央人民政府備案」。"}, {"id": "gx_t4_q045", "topic": 4, "num": 45, "category": "5) 行政會議的組成運作與重要性", "q": "根據《基本法》第五十四條，香港特別行政區「行政會議」的根本性質與職能定位是甚麼？", "options": ["是擁有獨立最高立法權的議會機構", "是協助行政長官決策的機構", "是負責審理貪污訴訟案件的司法機構", "是負責管理全港公立醫院的行政總部"], "answer": 1, "explanation": "《基本法》第五十四條規定，香港特別行政區行政會議是「協助行政長官決策的機構」。"}, {"id": "gx_t4_q046", "topic": 4, "num": 46, "category": "5) 行政會議的組成運作與重要性", "q": "根據《基本法》第五十五條，行政會議由誰親自主持？其成員主要包括哪些人員？", "options": ["由政務司司長主持且全額由退休公務員組成", "由立法會主席主持且成員全部由民選議員兼任", "由終審法院首席法官主持且成員均為資深律師", "由行政長官主持包括官守議員和非官守議員"], "answer": 3, "explanation": "行政會議由行政長官主持，主席為行政長官，成員包括官守議員和非官守議員。"}, {"id": "gx_t4_q047", "topic": 4, "num": 47, "category": "5) 行政會議的組成運作與重要性", "q": "根據《基本法》第五十五條，擔任行政會議成員在國籍與居留權上有何嚴格要求？", "options": ["可以隨意擁有英美等外國雙重國籍及永久居留權", "凡在香港居住滿七年的任何外籍人士均可自由擔任", "由在外國無居留權的香港特區永久居民中國公民擔任", "僅限於在內地出生並具有內地戶籍的各級官員出任"], "answer": 2, "explanation": "紅字填空明確指出：行政會議成員「由在外國無居留權的香港特別行政區永久性居民中的中國公民擔任」。"}, {"id": "gx_t4_q048", "topic": 4, "num": 48, "category": "5) 行政會議的組成運作與重要性", "q": "根據《基本法》第五十六條，行政長官在作出哪些重大行動前「必須」徵詢行政會議意見？", "options": ["進行日常公務員例行薪酬微調與年終考評之前", "批准任何一家外資民營企業在香港商業登記前", "決定公立學校每學期的暑假放假具體日期之前", "重要決策提交法案制定附屬法規和解散立法會前"], "answer": 3, "explanation": "行政長官在「作出重要決策、向立法會提交法案、制定附屬法規和解散立法會前，須徵詢行政會議的意見」。"}, {"id": "gx_t4_q049", "topic": 4, "num": 49, "category": "5) 行政會議的組成運作與重要性", "q": "行政長官在作出重大決策前須徵詢行會意見，但下列哪三項特殊事務屬於法定「除外」範疇？", "options": ["制定附屬法規施政報告與向立法會提交法案除外", "推動北部都會區發展計劃與興建跨境高鐵除外", "調整法定最低工資水平與公立醫院收費標準除外", "人事任免紀律制裁和緊急情況下採取的措施除外"], "answer": 3, "explanation": "須徵詢行會意見，「但人事任免、紀律制裁和緊急情況下採取的措施除外」。"}, {"id": "gx_t4_q050", "topic": 4, "num": 50, "category": "5) 行政會議的組成運作與重要性", "q": "根據《基本法》第五十六條，如果行政長官最終不採納行政會議多數成員的意見，必須如何處理？", "options": ["該項決策自動廢除且行政長官必須引咎辭職", "必須立即報請全國人民代表大會進行全體裁決", "由行政會議全體非官守議員投票否決特首職權", "行政長官應當將具體理由記錄在案以備查核"], "answer": 3, "explanation": "行政長官如不採納行政會議多數成員的意見，「應將具體理由記錄在案」。"}, {"id": "gx_t4_q051", "topic": 4, "num": 51, "category": "5) 行政會議的組成運作與重要性", "q": "行政會議通常多久召開一次會議？其會議決策貫徹甚麼重要運作原則？", "options": ["每月召開一次會議且所有成員投票紀錄向社會直播", "每兩月召開一次會議且實行少數服從多數公開記名制", "每季度召開一次會議且任何決議必須經由公投確認", "通常每星期舉行一次會議且所有決議均屬集體決議"], "answer": 3, "explanation": "「知識增潤」指出：行政會議通常每星期舉行一次會議，由行政長官主持；成員以個人身份提意見，但「所有決議均屬集體決議」。"}, {"id": "gx_t4_q052", "topic": 4, "num": 52, "category": "5) 行政會議的組成運作與重要性", "q": "重點討論指出，行政會議對特首及政府決策的重要性（一）是甚麼？", "options": ["直接取代特區立法會進行所有的法案表決工作", "負責審核香港各大外資跨國公司的年度財務報表", "專門用於監督香港警隊日常市區交通抄牌執法", "提升施政效能降低施政阻力優化政府各項政策"], "answer": 3, "explanation": "主題明確列出重要性（1）為：「提升施政效能，降低施政阻力」。"}, {"id": "gx_t4_q053", "topic": 4, "num": 53, "category": "5) 行政會議的組成運作與重要性", "q": "為何行政會議成員能發揮「政府智囊團」作用，有力「提升施政效能」？", "options": ["成員享有不受任何刑事法律調查起訴的永久豁免", "成員來自不同業界精英專才具備專業知識經驗豐富", "成員均持有外國知名高校的工商管理博士學位", "成員有權直接向財政司司長下達撥款行政命令"], "answer": 1, "explanation": "行會成員包括不同業界、精英專才、前公職人員（政府智囊團），具備專業知識、熟悉政府運作，提供多元建議全面考慮，優化政策。"}, {"id": "gx_t4_q054", "topic": 4, "num": 54, "category": "5) 行政會議的組成運作與重要性", "q": "行政會議非官守成員具有代表性與認受性，這如何幫助特區政府「降低施政阻力」？", "options": ["可以強制要求所屬行業協會無條件服從政府安排", "擁有廣泛人際脈絡向所屬界別吸納意見並尋求支持", "可以動用私人安保力量消除社會上所有反對聲音", "可以向所有支持政策推行的市民提供免稅優惠券"], "answer": 1, "explanation": "分析：行會成員為社會領袖，擁有廣泛人際脈絡及影響力，能向所屬界別吸納意見尋求支持，凝聚社會共識認同，減少推行阻力。"}, {"id": "gx_t4_q055", "topic": 4, "num": 55, "category": "5) 行政會議的組成運作與重要性", "q": "行政會議對特首及政府決策的重要性（二）是甚麼？", "options": ["使特區政府可以隨意取消立法會所有質詢環節", "促進行政與立法之間的溝通交流和互相支持配合", "由行政長官一人全權包攬立法會所有議案審查", "將立法會通過的每一項法案移送外國機構核准"], "answer": 1, "explanation": "主題明確列出重要性（2）為：「促進行政與立法之間的溝通和互相配合」。"}, {"id": "gx_t4_q056", "topic": 4, "num": 56, "category": "5) 行政會議的組成運作與重要性", "q": "行政會議成員包括兼任立法會議員的「雙料議員」，他們在決策中扮演甚麼關鍵角色？", "options": ["充當雙向溝通橋樑促進溝通協調分歧共尋妥協方案", "在立法會投票時可以一人投下兩票否決反對提案", "有權隨意罷免任何一名持有不同政治見解的議員", "直接兼任高等法院法官開庭審理行政訴訟官司"], "answer": 0, "explanation": "雙料議員吸納政黨意見帶入行政機關、帶入政府立場、清晰彼此見解、促進溝通、協調分歧、凝聚共識，提升施政時效性。"}, {"id": "gx_t4_q057", "topic": 4, "num": 57, "category": "5) 行政會議的組成運作與重要性", "q": "列舉了現任行政會議成員，下列哪一位屬於「官守議員」的典型代表？", "options": ["新民黨主席葉劉淑儀女士", "政務司司長陳國基先生", "前金管局首位總裁任志剛先生", "鄉議局主席劉業強先生"], "answer": 1, "explanation": "表格：官守議員為政府主要官員（如政務司司長陳國基、文體旅局長羅淑佩、醫衛局長盧寵茂）；其餘三位為非官守議員。"}, {"id": "gx_t4_q058", "topic": 4, "num": 58, "category": "5) 行政會議的組成運作與重要性", "q": "行政會議的運作實行嚴格的「保密制」與「集體負責制」，其根本目的是甚麼？", "options": ["防止市民監督特區政府在公共財政上的每筆開支", "使非官守議員可以免除承擔任何政治上的法律責任", "確保成員能暢所欲言客觀議事決策後對外團結一致", "避免新聞媒體對政府各項施政成就進行公開報道"], "answer": 2, "explanation": "保密制讓成員無顧慮提出坦誠專業意見，集體負責制要求決策後全體行會成員公開支持政府立場，確保管治威信。"}, {"id": "gx_t4_q059", "topic": 4, "num": 59, "category": "6) 立法會產生辦法與職權", "q": "根據《基本法》第六十六條，香港特別行政區的立法機關是甚麼？", "options": ["香港特別行政區立法會", "香港特別行政區行政會議", "香港特區律政司公訴處", "特區終審法院司法委員會"], "answer": 0, "explanation": "《基本法》第六十六條規定，香港特別行政區立法會是香港特別行政區的立法機關。"}, {"id": "gx_t4_q060", "topic": 4, "num": 60, "category": "6) 立法會產生辦法與職權", "q": "2021年3月30日全國人大常委會修訂《基本法》附件二後，立法會每屆議員總人數為多少？", "options": ["每屆立法會議員總人數為九十人", "每屆立法會議員總人數為七十人", "每屆立法會議員總人數為六十人", "每屆立法會議員總人數為一百二十人"], "answer": 0, "explanation": "香港特別行政區立法會議員每屆90人。"}, {"id": "gx_t4_q061", "topic": 4, "num": 61, "category": "6) 立法會產生辦法與職權", "q": "完善選舉制度後，90席立法會議員通過三種方式選舉產生，其議席分配比例是甚麼？", "options": ["選舉委員會30席功能團體30席分區直選30席", "選舉委員會45席功能團體25席分區直選20席", "選舉委員會40席功能團體30席分區直選20席", "選舉委員會35席功能團體35席分區直選20席"], "answer": 2, "explanation": "選舉委員會選舉40席、功能團體選舉30席、分區直接選舉20席（即40:30:20架構）。"}, {"id": "gx_t4_q062", "topic": 4, "num": 62, "category": "6) 立法會產生辦法與職權", "q": "根據《基本法》第七十三條第（一）款，立法會行使「立法權」的具體內容是甚麼？", "options": ["有權隨意制定違反國家憲法和基本法的本地法規", "根據本法規定並依照法定程序制定修改和廢除法律", "可以直接修改全國人民代表大會制定的國籍法律", "有權授權外資企業在香港境內自行頒布治安條例"], "answer": 1, "explanation": "表格列出：立法權為「根據本法規定並依照法定程序制定、修改和廢除法律」。"}, {"id": "gx_t4_q063", "topic": 4, "num": 63, "category": "6) 立法會產生辦法與職權", "q": "根據《基本法》第七十三條，立法會享有的「批准權」主要體現在審批甚麼事務？", "options": ["負責批准政府提出的稅收和公共開支預算", "負責批准行政長官每年前往北京述職之行程", "負責批准所有外國駐港跨國銀行的商業貸款額", "負責批准香港各公立大學每年錄取學生之名單"], "answer": 0, "explanation": "表格標明：批准權包括「批准稅收和公共開支」。"}, {"id": "gx_t4_q064", "topic": 4, "num": 64, "category": "6) 立法會產生辦法與職權", "q": "立法會議員聽取行政長官施政報告並對政府工作提出質詢，體現了立法會的甚麼職權？", "options": ["體現了立法機關對行政機關行使司法審判權", "體現了基本法賦予立法會行使的監督權", "體現了立法會主席單方面掌握的全國宣戰權", "體現了議員免受任何基本法規範約束特權"], "answer": 1, "explanation": "表格指出：監督權體現為「對政府的工作提出質詢」。"}, {"id": "gx_t4_q065", "topic": 4, "num": 65, "category": "6) 立法會產生辦法與職權", "q": "根據《基本法》第七十三條第（九）款，立法會行使「彈劾權」的聯合動議法定門檻是甚麼？", "options": ["只需由任何三名立法會議員書面聯名提出即可", "須由立法會全體議員三分之二多數聯合動議提出", "須由立法會全體議員四分之一聯合動議
