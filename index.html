的中國公民擔任」。"}, {"id": "gx_t4_q072", "topic": 4, "num": 72, "category": "7) 司法機關與上訴權", "q": "終審法院法官和高等法院首席法官的任命或免職，除法定推薦外還須履行甚麼憲制程序？", "options": ["須由行政長官徵得立法會同意並報全國人大常委會備案", "須報請英國國會上議院進行司法事務覆核與備案手續", "須由全港大律師公會全體會員以三分之二多數投票批准", "須由聯合國人權理事會發布國際司法人員資格確認證書"], "answer": 0, "explanation": "終審法院法官和高等法院首席法官的任命或免職，「還須由行政長官徵得立法會同意，並報全國人民代表大會常務委員會備案」。"}, {"id": "gx_t4_q073", "topic": 4, "num": 73, "category": "8) 愛國者治港標準與實踐", "q": "「愛國者治港」最早由哪位國家領導人提出？他闡明港人治港的界限和標準是甚麼？", "options": ["鄧小平提出強調必須由以愛國者為主體的港人治港", "毛澤東提出強調必須由工農聯盟代表治理香港特區", "周恩來提出強調必須由商界外資跨國精英聯合治港", "江澤民提出強調必須由各大專院校學者教授治港"], "answer": 0, "explanation": "「愛國者治港」最早來自鄧小平對「一國兩制」的設想。他闡明，「港人治港」有個界限和標準，就是「必須由以愛國者為主體的港人來治理香港」。"}, {"id": "gx_t4_q074", "topic": 4, "num": 74, "category": "8) 愛國者治港標準與實踐", "q": "鄧小平提出的「愛國者」三項具體標準包括下列哪一組？", "options": ["必須加入執政黨定期向黨組織匯報思想且放棄個人財產", "必須具有內地戶籍並精通內地各省地方方言與風俗習慣", "尊重自己民族誠心誠意擁護恢復行使主權不損害繁榮穩定", "不得與任何海外親友通信且禁止在國際外資機構中任職"], "answer": 2, "explanation": "愛國者標準：1.尊重自己民族；2.誠心誠意擁護祖國恢復行使對香港的主權；3.不損害香港的繁榮和穩定。"}, {"id": "gx_t4_q075", "topic": 4, "num": 75, "category": "8) 愛國者治港標準與實踐", "q": "香港特區在實踐「愛國者治港」時，對主要官員及首長在國籍上確立了甚麼嚴格規定？", "options": ["允許特區主要首長保留外國護照居留權以展現國際大都會", "要求所有公職人員必須同時具備中國及英聯邦雙重國籍身", "規定主要官員首長只能擁有單一國籍展示對國家民族尊重", "對主要官員國籍完全不設限制任何外國公民皆可出任局長"], "answer": 2, "explanation": "實踐原則第一點：基本法規定主要官員首長「只能擁有單一國籍，以國籍及身份的選擇展示對國家民族的尊重」。"}, {"id": "gx_t4_q076", "topic": 4, "num": 76, "category": "8) 愛國者治港標準與實踐", "q": "根據《基本法》規定，下列哪一組特區公職人員「必須」在外國無居留權的永久居民中國公民？", "options": ["特區公立醫院的全體住院醫生護士以及登記護士人員", "全港所有資助中小學全體註冊科任教師與校工管理員", "特首行會成員立法會主席主要官員終審高院首席法官", "香港各大公共交通運輸機構全體列車司機與站台人員"], "answer": 2, "explanation": "行政長官、行會成員、立法會主席、政府主要官員、終審法院和高等法院首席法官必須符合在外國無居留權的香港永久居民中國公民。"}, {"id": "gx_t4_q077", "topic": 4, "num": 77, "category": "8) 愛國者治港標準與實踐", "q": "根據《基本法》第一百零四條，特區主要公職人員就職時依法必須履行甚麼法定義務？", "options": ["向立法會全體議員進行個人及家族私人財產公開拍賣", "簽署永久放棄在香港購置任何私人住宅物業之承諾書", "定期前往各紀律部隊訓練基地進行封閉特種軍事集訓", "依法宣誓擁護基本法並效忠中華人民共和國香港特區"], "answer": 3, "explanation": "特首、主要官員、行會成員、立法會議員、法官就職時，「必須依法宣誓擁護中華人民共和國香港特別行政區基本法，效忠中華人民共和國香港特別行政區」。"}, {"id": "gx_t4_q078", "topic": 4, "num": 78, "category": "8) 愛國者治港標準與實踐", "q": "根據《公務員守則》，香港特區受聘的公務員必須宣誓或簽署聲明承擔甚麼職責？", "options": ["保證在任職期間絕不提出任何改進公共政策之建議", "必須定期向外國領事館匯報特區內部各項施政進展", "承諾一旦政府面臨財政赤字自願放棄全部退休金待遇", "擁護基本法效忠香港特區盡忠職守對特區政府負責"], "answer": 3, "explanation": "受聘公務員必須宣誓或簽署聲明「擁護《基本法》、效忠香港特區、盡忠職守和對香港特區政府負責」。"}, {"id": "gx_t4_q079", "topic": 4, "num": 79, "category": "8) 愛國者治港標準與實踐", "q": "特區政府要求公職人員依法宣誓或簽署聲明，這在落實「愛國者治港」中起到甚麼制度作用？", "options": ["旨在禁止公職人員在私人時間慶祝西方傳統節日習俗", "旨在消除香港原有的公務員常任制與專業行政管理隊伍", "確立政治效忠法定標準為特區治理把關確保管治權安全", "旨在要求公務員在審理市民申訴時偏向特定商業集團"], "answer": 2, "explanation": "宣誓是莊嚴的法律承諾與憲制義務，明確政治規矩，確保由真心擁護國家與特區的人掌握政權管治權。"}, {"id": "gx_t4_q080", "topic": 4, "num": 80, "category": "8) 愛國者治港標準與實踐", "q": "總結而言，全面準確落實「愛國者治港」原則，對香港「一國兩制」實踐具有甚麼深遠意義？", "options": ["確保一國兩制實踐始終沿正確軌道行穩致遠促進良政善治", "將香港特區轉變為與內地制度完全無差別的單純經濟省份", "使香港特區放棄普通法司法獨立原則改採行政干預體制", "使香港完全閉關自守不再參與任何國際經貿合作交流論壇"], "answer": 0, "explanation": "愛國者治港是「一國兩制」的核心要義，只有把管治權牢牢掌握在愛國者手中，香港才能告別政治內耗，聚焦發展經濟、改善民生，實現長治久安。"}, {"id": "gx_t5_q001", "topic": 5, "num": 1, "category": "1) 法治應包含的主要原則", "q": "下列哪一項「不屬於」現代法治應包含的五大主要原則之一？", "options": ["法律具備凌駕性且擁有最高法律地位", "法律面前人人平等與司法審判保持獨立", "法律必須尊重並充分保障個人權利自由", "行政機關享有超越法律約束之特權"], "answer": 3, "explanation": "法治五大原則：法律具凌駕性、法律面前人人平等、尊重和保障人權自由、依法守法（限權機制）、司法獨立。D選項違背法治原則。"}, {"id": "gx_t5_q002", "topic": 5, "num": 2, "category": "1) 法治應包含的主要原則", "q": "「法律具凌駕性」是法治的核心原則，其在社會管治中的具體含義是指甚麼？", "options": ["政府高級官員在行使公權力時可凌駕法例之上", "法律具有最高地位任何人或機關均須受約束", "富商階層可以透過支付高額賠償免除刑事起訴", "法例條文可以隨時由執法警務人員在現場修改"], "answer": 1, "explanation": "法律具凌駕性意味著法律「具有最高的地位」，所有公私主體均必須受法律約束，無人凌駕於法律之上。"}, {"id": "gx_t5_q003", "topic": 5, "num": 3, "category": "1) 法治應包含的主要原則", "q": "法治原則強調「公職人員及市民依法守法」，對政府及公職人員而言這本質上是甚麼？", "options": ["賦予公務人員在執法過程中享有完全免責特權", "要求市民對政府做出的任何行政決策絕對服從", "專門用於提高政府各部門徵收各項罰款的途徑", "規範並約制公共權力不被濫用的「限權機制」"], "answer": 3, "explanation": "標註：公職人員及市民依法守法本質上是「限權機制」，確保公權力依法行使，防止濫權。"}, {"id": "gx_t5_q004", "topic": 5, "num": 4, "category": "1) 法治應包含的主要原則", "q": "在1995年「詹承宗訴懲教署署長」案中，懲教署抽起囚犯報章馬經，署長辯稱是依內部常規。法官對此作出了甚麼裁決？", "options": ["法官裁定懲教署內部指引效力等同立法會正式法律", "法官判定在囚人士在服刑期間徹底喪失一切訴訟權", "法官直接判處懲教署長個人承擔巨額民事侵權賠償", "法官裁定內部未公開常規不能成為該措施法律依據"], "answer": 3, "explanation": "法官認為常規只是內部文件且未公開讓囚犯知曉，「並不能構成懲教署實行這項措施的法律依據」。"}, {"id": "gx_t5_q005", "topic": 5, "num": 5, "category": "1) 法治應包含的主要原則", "q": "在詹承宗案中，法官行使獨立審判，未因一方為政府部門而偏私並判政府措施不合規，體現了甚麼原則？", "options": ["體現了法官行使審判權時嚴守「司法獨立」原則", "體現了立法會對政府各行政部門行使直接監督權", "體現了刑事法規在實施過程中嚴格恪守時效原則", "體現了行政長官掌握對各級法院人事之絕對免職權"], "answer": 0, "explanation": "表格指出：法官獨立審判，未因一方為政府而偏私，判定措施不合規，體現了「司法獨立」。"}, {"id": "gx_t5_q006", "topic": 5, "num": 6, "category": "1) 法治應包含的主要原則", "q": "在詹承宗案中，在囚人士獲得公平公開審訊，未因其囚犯身份階級而受不合理對待，體現了甚麼原則？", "options": ["體現了行政機關在緊急情況下享有的自由裁量權", "體現了普通法體系下法院審判案件必須一罪不二審", "體現了終審法院法官任期受憲制保障不受免職影響", "體現了「法律面前人人平等」的崇高法治原則"], "answer": 3, "explanation": "表格載明：囚犯獲得公平審訊，未因其身份階級而受不合理區別對待，體現「法律面前人人平等」。"}, {"id": "gx_t5_q007", "topic": 5, "num": 7, "category": "1) 法治應包含的主要原則", "q": "法庭裁定懲教署內部文件不能作為行使職權的法律依據，這體現了法治對政府行為的甚麼要求？", "options": ["要求行政機關在開展所有日常工作前舉行全港公投", "體現政府行使權力必須有法律依據並表述於法例", "意味著政府部門不得在內部編寫任何員工操作手冊", "表明司法機關可以隨意接管各監獄的日常保安工作"], "answer": 1, "explanation": "表格指出：體現「公職人員依法守法」，即政府行使權力須有法律依據，並須表述於法例之中。"}, {"id": "gx_t5_q008", "topic": 5, "num": 8, "category": "1) 法治應包含的主要原則", "q": "在詹承宗案中，囚犯就個人權益提出司法覆核訴訟，這在體現「法治精神」層面反映了甚麼？", "options": ["反映囚犯拒絕遵守監獄管理條例進行惡意對抗訴訟", "展示囚犯信任司法覆核限權機制並認同法律追求公義", "說明香港特區監獄保安管理體系存在嚴重安全漏洞", "證明司法覆核制度可以直接代替立法會制定全新法規"], "answer": 1, "explanation": "第2題答案：在囚犯方面，透過行使法律權利爭取權益，「展示囚犯信任司法覆核的限權機制＋認同利用法律追求公義的重要」。"}, {"id": "gx_t5_q009", "topic": 5, "num": 9, "category": "2) 法治精神的內涵", "q": "何謂「法治精神」的核心內涵？", "options": ["指執法人員在盤問刑事嫌疑人時展現的個人職業道德", "指統治階層利用嚴厲刑罰手段控制民眾思想之專用名詞", "指法律從業人員熟練背誦全部法規條文之專業技能水平", "強調社會不同持份者擁抱法治信念並實踐於體制中"], "answer": 3, "explanation": "法治精神強調「社會不同持份者都擁抱與法治相符的信念，並實踐於整個法律制度中」。"}, {"id": "gx_t5_q010", "topic": 5, "num": 10, "category": "2) 法治精神的內涵", "q": "法治精神的內涵具體包含哪三項核心實踐要求？", "options": ["制定法律強制執行法規對違法者施加嚴厲肉體刑罰", "遵守法律尊重法律權威利用法律追求公義排解紛爭", "宣傳法規審查社會言論強制全體市民參加法律考核", "修改法律廢除陳舊法規全面特赦所有被判監禁罪犯"], "answer": 1, "explanation": "紅字填空明確標示三項內涵：（1）遵守法律；（2）尊重法律權威；（3）利用法律去追求公義／權益／排解紛爭。"}, {"id": "gx_t5_q011", "topic": 5, "num": 11, "category": "2) 法治精神的內涵", "q": "法治精神內涵中的「遵守法律」，其對社會各階層的基本要求是甚麼？", "options": ["不論身份地位所有公職人員與市民皆自覺受法律約束", "只遵守符合個人利益的法規而不合理的條文可以違抗", "只有在警務人員在場親自監督時市民才需要遵紀守法", "只要未被執法人員當場抓獲違法行為就不算損害法治"], "answer": 0, "explanation": "遵守法律是法治基石，要求全體社會成員無論貧富貴賤，均自覺認同並嚴格服從具有普遍約束力的法律。"}, {"id": "gx_t5_q012", "topic": 5, "num": 12, "category": "2) 法治精神的內涵", "q": "「尊重法律權威」在社會生活中的具體表現是甚麼？", "options": ["認同司法機構獨立判決服從法庭命令維護司法公信力", "認為行政長官在公開場合發表的演說效力高於成文法", "在民事商業糾紛中優先採取私力救濟或網絡暴力施壓", "盲目遵從古代所有宗族家規而排斥特區現行制定法規"], "answer": 0, "explanation": "尊重法律權威要求公眾尊重法院依法作出的獨立裁決，服從法庭判決與禁制令，維護法治至上尊嚴。"}, {"id": "gx_t5_q013", "topic": 5, "num": 13, "category": "2) 法治精神的內涵", "q": "法治精神強調「利用法律去追求公義／權益／排解紛爭」，這體現了法律在文明社會中的甚麼角色？", "options": ["法律純粹是政府統治者用以懲罰和限制市民自由的枷鎖", "法律是繁瑣且毫無必要的司法程序只會增加訴訟成本費用", "法律是保護公民合法權利和平解決矛盾的制度保障途徑", "法律鼓勵市民訴諸街頭私鬥以武力解決一切商業利益爭端"], "answer": 2, "explanation": "公民透過法律途徑尋求司法救濟、解決紛爭，體現了法律作為維護正義、和平解決社會矛盾的文明機制。"}, {"id": "gx_t5_q014", "topic": 5, "num": 14, "category": "2) 法治精神的內涵", "q": "如果社會各界普遍缺乏法治精神，只在對己有利時才守法，將帶來甚麼嚴重後果？", "options": ["將會促使特區立法機關以更快的速度通過更多的新法條文", "有助於大幅度提升特區政府各決策局推展基建之行政效率", "不會對外資企業在香港的各項商業投資決策造成任何影響", "法律失去普遍適用特質與權威導致社會秩序走向混亂崩潰"], "answer": 3, "explanation": "法治精神是法治運行的文化和心理土壤，缺乏守法與尊重法律的自覺，法律將淪為具文，社會穩定將蕩然無存。"}, {"id": "gx_t5_q015", "topic": 5, "num": 15, "category": "3) 守護法治精神的重要性", "q": "維護與守護法治精神具有哪三大核心重要性？", "options": ["保障人權維持穩定促進社經繁榮以及監督約制政府權力", "加強軍事實力擴大外匯儲備推行全民強制外語義務教育", "提高公務員福利待遇增設各級法院並擴大監獄收容容量", "大幅壓縮公共衛生財政預算加速舊區物業無償強制拆遷"], "answer": 0, "explanation": "標題明確歸納三大重要性：1.保障人權及維持社會穩定；2.促進香港社經發展和繁榮；3.監督及約制政府權力。"}, {"id": "gx_t5_q016", "topic": 5, "num": 16, "category": "3) 守護法治精神的重要性", "q": "2008年高等法院就兩名在囚人士司法覆核案作出裁決，時任法官張舉能判決囚犯享有甚麼憲法權利？", "options": ["判決囚犯享有在服刑期間自由離開監獄前往海外度假權", "判決在囚人士及受羈押人士依法應該享有公開投票權力", "判決囚犯有權自行挑選每日監獄餐食標準與單人牢房權", "判決在囚人士有權拒絕接受任何懲教署職員的紀律監管"], "answer": 1, "explanation": "高院裁定兩名在囚人士司法覆核得直，判定囚犯及羈留人士應該享有投票權。"}, {"id": "gx_t5_q017", "topic": 5, "num": 17, "category": "3) 守護法治精神的重要性", "q": "在2008年在囚人士投票權案中，法官判詞指出剝奪囚犯投票權違反了哪兩部法律的相關規定？", "options": ["違反《基本法》第二十六條及《香港人權法案》第二十一條", "違反《基本法》第十八條第二款及《刑事罪行條例》第十條", "違反《立法會條例》附則及《公司條例》有關股東表決權條", "違反國家《憲法》第十五條及《中華人民共和國國籍法》條"], "answer": 0, "explanation": "判詞指出：限制投票等同將囚犯定形造成不合理歧視，違反《基本法》第26條及《人權法》第21條；囚犯雖受監禁，不代表可剝奪其憲法權利。"}, {"id": "gx_t5_q018", "topic": 5, "num": 18, "category": "3) 守護法治精神的重要性", "q": "2009年特區政府依據法庭判決修訂法例並通過《在囚人士投票條例》，容許囚犯登記為甚麼身份投票？", "options": ["容許其登記為「海外永久選民」並委託家屬進行代理投票", "容許在囚人士合法登記為「受羈押選民」參與公開投票", "容許其登記為「保釋候審選民」且免除其正在執行的刑罰", "容許其登記為「臨時特權選民」並享有額外的加權投票額"], "answer": 1, "explanation": "條例為在囚人士設立明確法律架構，容許他們登記為「受羈押選民」，可以在公開選舉中投票。"}, {"id": "gx_t5_q019", "topic": 5, "num": 19, "category": "3) 守護法治精神的重要性", "q": "在囚人士投票權案的判決及後續立法修訂，充分體現了守護法治精神的哪一項重要性？", "options": ["體現重要性二：促使特區政府全面削減每年的選舉開支預算", "體現重要性三：使立法會審議政府法案的平均耗時大幅縮減", "體現重要性一：切實保障人權及有效維持社會大局穩定", "體現重要性四：徹底免除香港各級裁判法院積壓的民事案件"], "answer": 2, "explanation": "該案例體現重要性（1）「保障人權及維持社會穩定」：任何人可藉司法制度提出申訴，以法律程序追求公義平息紛爭。"}, {"id": "gx_t5_q020", "topic": 5, "num": 20, "category": "3) 守護法治精神的重要性", "q": "為何說「透過法律程序追求公義有助於維持社會穩定」？其背後的制度邏輯是甚麼？", "options": ["只要法院判決原告敗訴市民就會自然放棄所有的個人訴求", "訴訟程序極度繁瑣漫長能夠使大部分申訴人主動放棄維權", "法庭可以在審判時命令執法機關對不服判決者實施行政拘禁", "為市民提供公正救濟渠道以和平方式平息紛爭防止社會激化"], "answer": 3, "explanation": "解釋：任何人可藉司法制度申訴糾紛以確保權力合法行使；透過法律程序追求公義，有助社會以法律平息紛爭，達到維持社會穩定效果。"}, {"id": "gx_t5_q021", "topic": 5, "num": 21, "category": "3) 守護法治精神的重要性", "q": "加拿大菲沙研究所《世界經濟自由度年度報告》長年評選香港為全球最自由經濟體之一，其核心基石是甚麼？", "options": ["在香港特區境內擁有駐軍規模龐大的常備海陸空軍事要塞", "良好法治社會穩定自由開放以及嚴謹完備的商業財產法律", "特區政府對所有進口商品全面徵收極高的保護性關稅壁壘", "特區政府直接接管並全額控股所有在港運營的民營外資企業"], "answer": 1, "explanation": "香港靠良好法治、社會穩定和自由開放，訂有嚴謹的商業法及財產法，故法治被形容為香港國際金融中心成功的基石。"}, {"id": "gx_t5_q022", "topic": 5, "num": 22, "category": "3) 守護法治精神的重要性", "q": "香港訂有嚴謹的商業法及財產法，下列哪一組領域全部屬於導學案列舉的商事法律範疇？", "options": ["涵蓋婚姻家庭法遺產繼承法領養條例及收養民事程序法規", "涵蓋知識產權保護合約法公司法財務及競爭法例所有範疇", "涵蓋刑事公訴程序法監獄規例道路交通違章條例及戒毒法規", "涵蓋國籍審批法外事特權豁免法領事裁判規例及引渡協定法"], "answer": 1, "explanation": "香港訂有嚴謹的商業法及財產法，涵蓋知識產權保護、合約法、公司、財務及競爭法例的所有範疇。"}, {"id": "gx_t5_q023", "topic": 5, "num": 23, "category": "3) 守護法治精神的重要性", "q": "從海外投資者選擇投資地點的角度分析，良好法治如何「促進香港社經發展和繁榮」？", "options": ["建立公平競爭營商環境保障產權並提供優質仲裁解決爭議", "保證所有外資跨國企業在香港的商業運營永遠不出現虧損", "允許大型外國財團在香港享有免受任何本地環保法規監管", "由政府直接干預法庭審判以確保外資企業在官司中取得勝訴"], "answer": 0, "explanation": "解釋：投資者考慮守法意識、社會穩定、法律對權利保障；維護法治建立公平競爭營商環境，商業爭議出現時可獲優質法律與仲裁服務。"}, {"id": "gx_t5_q024", "topic": 5, "num": 24, "category": "3) 守護法治精神的重要性", "q": "當跨國商業爭議出現時，香港健全的普通法法治環境為商界提供了甚麼關鍵專業優勢？", "options": ["提供世界頂尖的法律服務以及高效可靠的中立商業仲裁服務", "由特區行政長官親自開庭對跨國合約進行調解並強制執行之", "強迫雙方當事人將全部爭議資產無償捐贈給香港本地慈善會", "允許商業巨頭自行組建私人武裝安保部隊查封對方的辦公室"], "answer": 0, "explanation": "香港普通法體系健全、仲裁制度與國際高度接軌，為全球投資者提供公平、透明、高效的爭議解決機制，是國際商貿中心的核心競爭力。"}, {"id": "gx_t5_q025", "topic": 5, "num": 25, "category": "3) 守護法治精神的重要性", "q": "引用審計署就安達臣道行人天橋工程未完成設計即招標超支近10億元的報告，說明了甚麼？", "options": ["審計署可以直接解散負責工程招標的特區政府發展局全部架構", "審計署發揮獨立監督功能促使政府有效運用資源保障大眾權益", "特區政府有權以行政命令宣布將審計署全體審計人員予以免職", "工程承建商有權向終審法院申請禁制令全面封殺審計署之報告"], "answer": 1, "explanation": "審計署揭露工程大幅更改令與超支問題，體現「監督及約制政府權力」，促進政府更有效運用公共資源，保障大眾權益。"}, {"id": "gx_t5_q026", "topic": 5, "num": 26, "category": "3) 守護法治精神的重要性", "q": "2016年廉政公署調查前副秘書長馮永業涉收受利益案，馮在區域法院被裁定「公職人員行為失當罪」成判囚9個月，這體現了甚麼？", "options": ["證明特區高級公務員享有免受廉政公署任何刑事調查起訴之特權", "說明區域法院只能審理民間輕微租務糾紛而無權管轄公職人員罪", "說明高級公職人員一旦涉案可以由行政會議內部通報批評即了事", "體現監督公職人員依法行使權力維護法律凌駕性確保公權不被濫用"], "answer": 3, "explanation": "法庭對失當公職人員定罪判刑，體現重要性（3）監督約制政府權力，維護法律凌駕性，確保公共權力不被濫用（減少以權謀私、徇私枉法）。"}, {"id": "gx_t5_q027", "topic": 5, "num": 27, "category": "3) 守護法治精神的重要性", "q": "區域法院法官游德康在對馮永業案判刑時，為何明確指出法庭需要判處「阻嚇性刑罰」？", "options": ["因涉案工程合約款項在審判前尚未完全結清需要追繳經濟罰金", "因被告在任職期間從未向任何慈善機構進行過個人無償捐款之", "因法官必須嚴格遵循英國國會外交委員會發布的秘密行政指導", "因其行為違反公務員誠信打擊公眾對公職人員與廉潔制度的信心"], "answer": 3, "explanation": "判詞載明：法官指出馮的行為違反公務員誠信、影響公務員聲譽、打擊公眾對公務員的信心，明言法庭需要判處阻嚇性刑罰。"}, {"id": "gx_t5_q028", "topic": 5, "num": 28, "category": "3) 守護法治精神的重要性", "q": "守護法治精神在「監督及約制政府權力」方面的核心要求是甚麼？", "options": ["鼓勵市民以暴力手段衝擊各政府決策局辦公大樓以表達不同政見", "由司法機關全面接管特區政府各局的日常行政運作與公務員招聘", "要求特區政府所有立法提案必須先徵得全體市民無記名公投同意", "確保社會具備有效權力制衡機制監督政府及公職人員依法行使權力"], "answer": 3, "explanation": "解釋：社會具備有效權力制衡機制，監督部門及公職人員依法行使權力，維護法律凌駕性，確保公共權力受有效制約（減少以權謀私、徇私枉法）。"}, {"id": "gx_t5_q029", "topic": 5, "num": 29, "category": "3) 守護法治精神的重要性", "q": "綜合在囚人士投票權案、自由貿易營商環境及馮永業案，三個案例共同指向的法治價值是甚麼？", "options": ["只要政府經濟發展保持高增長司法公正與人權保障可以置之不理", "法治是保障人權促進經濟發展以及防止公共權力被濫用的最高基石", "法律主要用於保護少數社會富商精英階層的既得商業特權利益之", "特區法院的審判工作完全從屬於行政長官發布的臨時行政指令之"], "answer": 1, "explanation": "三大案例分別從人權保障、經濟營商及監督公權三個維度，生動且深刻地證明了守護法治精神是香港社會繁榮穩定不可動搖的基石。"}, {"id": "gx_t5_q030", "topic": 5, "num": 30, "category": "3) 守護法治精神的重要性", "q": "如果一個社會喪失了對政府權力的法律監督與約制，最直接產生的惡劣弊端是甚麼？", "options": ["會促使外來跨國商業投資資本以成倍速度大規模湧入該地區市場", "會使該地區所有公立學校學生的學業考試成績得到跨越式大提升", "導致公權力缺乏有效制約滋生以權謀私徇私枉法並嚴重侵害公民利益", "能夠徹底消除該地區歷史上存在的所有社會階層分工與貧富差距"], "answer": 2, "explanation": "失去監督與限權機制，公權力必將被濫用，以權謀私、徇私枉法滋生，公民合法權利將面臨非法侵害，良政善治與社會和諧將蕩然無存。"}, {"id": "gx_t5_q031", "topic": 5, "num": 31, "category": "4) 普通法的特點", "q": "香港特別行政區現行實施的法律體系屬於哪一個世界大法系？", "options": ["屬於源自歐洲大陸法典化傳統的民法法系", "屬於源自英國歷史傳統的普通法系體系", "屬於以宗教教規為最高準則的伊斯蘭法系", "屬於完全由古代習慣法組成的部族盟約法系"], "answer": 1, "explanation": "標題明確指出：香港實施的法系為「普通法」。"}, {"id": "gx_t5_q032", "topic": 5, "num": 32, "category": "4) 普通法的特點", "q": "普通法最早發源於哪一個國家？始於哪一年英皇威廉一世著手建立全國性法律？", "options": ["發源於法國且始於公元一七八九年", "發源於英國且始於公元一零六六年", "發源於美國且始於公元一七七六年", "發源於德國且始於公元一八七一年"], "answer": 1, "explanation": "普通法源自英國，在1066年英皇威廉一世和他以後的繼承者著手建立一套全國性法律制度。"}, {"id": "gx_t5_q033", "topic": 5, "num": 33, "category": "4) 普通法的特點", "q": "普通法制度最核心的「兩個特點」分別是甚麼？", "options": ["以嚴格成文法典為唯一依據且完全禁止法官援引任何歷史案例", "所有刑事及民事審判必須秘密進行且判詞嚴格禁止向公眾公開", "遵循先例原則以及以法官判例為骨幹累積成普遍適用的法律", "法官可以不受任何法律條文約束隨意依據個人當日好惡判案"], "answer": 2, "explanation": "紅字填空明確指出普通法兩大特點：1.遵循先例：同類案件、同類處理（先例判決有約束力）；2.以判例為骨幹，由法官的判例累積成「普遍適用」的法律。"}, {"id": "gx_t5_q034", "topic": 5, "num": 34, "category": "4) 普通法的特點", "q": "在普通法運行機制中，「遵循先例」（Doctrine of Precedent）的具體要求是甚麼？", "options": ["同類案件同類處理且上級法院判決先例對下級法院具有法律約束力", "每審理一宗新案件法官都必須全盤推翻過去所有判例重新立法裁決", "下級法院法官享有推翻終審法院歷史判決之排他性最高司法特權", "法官在審案時只需聽從行政機關長官口頭指引而無需參考歷史判案"], "answer": 0, "explanation": "遵循先例即同類案件、同類處理（先例判決有約束力），上級法院判例對下級法院有約束力，使判案不會因不同法官而異。"}, {"id": "gx_t5_q035", "topic": 5, "num": 35, "category": "4) 普通法的特點", "q": "《香港特別行政區基本法》第八條對香港原有的法律體系作出了甚麼重要規定？", "options": ["香港特區在回歸當日必須全面廢除普通法改採內地大陸法法典體系", "原有法律即普通法衡平法條例附屬立法和習慣法除抵觸者外予以保留", "普通法傳統僅在香港外資商業銀行內部保留適用五年期滿後自動取消", "特區立法會有權隨意發布行政通告廢止普通法所有案例的司法約束力"], "answer": 1, "explanation": "引用《基本法》第八條：香港原有法律，即普通法、衡平法、條例、附屬立法和習慣法，除同本法相抵觸或經特區立法機關修改者外，予以保留。"}, {"id": "gx_t5_q036", "topic": 5, "num": 36, "category": "4) 普通法的特點", "q": "在「一國兩制」原則下，香港作為中國境內唯一的普通法管轄區，其法律體系架構基礎是：", "options": ["以普通法輔以成文法為基礎具有獨特制度優勢", "純粹以行政命令為唯一權威排除任何成文法律", "完全採用古代大清律例作為審理民商案件的依據", "直接照搬外國憲法並否定國家憲法的最高法律效力"], "answer": 0, "explanation": "根據「一國兩制」原則，香港特區法律制度有別於內地，回歸後《基本法》第八條保留了普通法傳統，「以普通法輔以成文法為基礎」。"}, {"id": "gx_t5_q037", "topic": 5, "num": 37, "category": "5) 普通法下香港法律特點", "q": "根據《基本法》第八十二條及八十四條，香港普通法在判例引用方面有何獨特之處？", "options": ["香港各級法院嚴格禁止參考任何海外普通法地區法官撰寫的判詞內容", "香港法院審理所有案件必須強制向英國最高法院申請先例引用許可證", "不限於單一管轄區可參考和納入所有普通法適用地區之案例司法判決", "所有引用的海外判例必須事先經過特區立法會全體議員逐一投票確認"], "answer": 2, "explanation": "紅字填空指出：香港普通法「不限於取自單一司法管轄區的司法判例，可以參考和納入所有普通法適用地區的案例和司法判決」。"}, {"id": "gx_t5_q038", "topic": 5, "num": 38, "category": "5) 普通法下香港法律特點", "q": "根據《基本法》第八十二條，香港終審法院在審判人員組成上享有甚麼制度優勢？", "options": ["終審法院全體法官必須全部由外國國家元首直接簽署委任狀指派產生", "終審法院院長必須由在香港居住未滿一年的外籍人士輪流擔任主席官", "終審法院審判庭開庭時必須由外國領事館代表列席並行使最終否決權", "終審法院可根據需要邀請其他普通法適用地區的資深法官參加審判"], "answer": 3, "explanation": "引用《基本法》第八十二條：香港特區的終審權屬於終審法院，「終審法院可根據需要邀請其他普通法適用地區的法官參加審判」。"}, {"id": "gx_t5_q039", "topic": 5, "num": 39, "category": "5) 普通法下香港法律特點", "q": "總結，普通法下香港法律具備哪兩個至關重要的法治特點？", "options": ["保持法律的穩定性和一貫性以及嚴格堅持法不溯及既往原則", "賦予法官隨意朝令夕改權限以及允許刑法隨時追溯既往行為", "確立行政命令至高無上地位以及全面推行常態化閉門秘密審訊", "允許公權力不受約束隨意定罪以及取消所有被告合法抗辯權力"], "answer": 0, "explanation": "兩大特點：特點（1）保持法律的穩定性和一貫性；特點（2）法不溯及既往。"}, {"id": "gx_t5_q040", "topic": 5, "num": 40, "category": "5) 普通法下香港法律特點", "q": "「法律不能朝令夕改讓社會無所適從……遵循先例使判案不因法官而異」，這具有甚麼價值？", "options": ["旨在確保特區政府各行政部門可以免除承擔任何法定審計責任", "旨在使特區立法機關在五年任期內不再需要制定任何全新法案", "旨在確立主審法官個人的道德觀念凌駕於成文制定法條文之上", "有助於保持法律穩定性和一貫性維護司法公平及司法公信力"], "answer": 3, "explanation": "保持法律的穩定性和一貫性，「有助維護司法公平及司法公信力」。"}, {"id": "gx_t5_q041", "topic": 5, "num": 41, "category": "5) 普通法下香港法律特點", "q": "何謂現代刑法法治原則中的「法不溯及既往」（Non-retroactivity）？", "options": ["新刑法通過生效後可以追溯處罰公民在過去三十年間的所有行為", "凡被法院起訴之被告人其直系親屬過去所有的言行一併追究刑責", "刑法只適用於其生效以後的行為對生效以前行為不得適用定罪", "所有被判處有罪的刑事罪犯在服刑五年後其罪行記錄自動被消除"], "answer": 2, "explanation": "法不溯及既往是指「刑法只適用於其生效以後的行為，對其生效以前的行為不得適用」。"}, {"id": "gx_t5_q042", "topic": 5, "num": 42, "category": "5) 普通法下香港法律特點", "q": "普通法制度堅定貫徹「法不溯及既往」原則，最核心的制度目的在於甚麼？", "options": ["防止公共權力被濫用並保障公民行為的可預測性與正當合法權益", "防止法庭審判時間過長以大幅度減少司法機構財政預算經常性開支", "確保所有曾參與違法犯罪的嫌疑人均能輕易逃脫法律應有的制裁懲戒", "完全禁止特區立法機關針對新興犯罪形態制定任何新的刑事處罰法例"], "answer": 0, "explanation": "紅字明確指出：法不溯及既往的核心在於「防止公共權力被濫用」，保護公民免受事後法律的任意懲罰。"}, {"id": "gx_t5_q043", "topic": 5, "num": 43, "category": "5) 普通法下香港法律特點", "q": "香港法例第1章《釋義及通則條例》第20條對條例生效時間作出了甚麼法定規範？", "options": ["所有法例在立法會三讀通過當日午夜十二點整自動立即生效實施", "條例在行政長官親自簽署後滿三個月方可在香港境內公布實施之", "任何條例均須在憲報刊登且除有規定外在刊登當日開始時生效", "法例必須經由終審法院首席法官在高等法院大樓宣讀後方可生效"], "answer": 2, "explanation": "引用條例規定：任何條例均須在憲報刊登，在該條例刊登當日開始時生效，或按條文規定在另一日生效。"}, {"id": "gx_t5_q044", "topic": 5, "num": 44, "category": "5) 普通法下香港法律特點", "q": "《中華人民共和國香港特別行政區維護國家安全法》第三十九條規定如何體現「法不溯及既往」？", "options": ["規定可以追溯懲處香港特區成立以前發生的所有重大政治歷史事件", "明文規定「本法施行以後的行為適用本法定罪處刑」恪守原則", "規定國安法生效前的所有涉案人員一律免除審查直接判處行政監禁", "規定國安法在特區實施滿五年後方可正式適用於具體刑事違法案件"], "answer": 1, "explanation": "《香港國安法》第三十九條規定「本法施行以後的行為，適用本法定罪處刑」，充分體現法不溯及既往原則。"}, {"id": "gx_t5_q045", "topic": 5, "num": 45, "category": "6) 司法獨立的深層意義", "q": "司法獨立的深層意義主要從哪兩個維度進行深入理解？", "options": ["主要從「法院財政預算完全獨立」與「法官外交豁免特權」理解", "主要從「陪審團制度絕對獨立」與「大律師公會行業自治」理解", "主要從「司法體制和司法權獨立」與「法官獨立」兩維度理解", "主要從「檢控機關行政獨立」與「懲教部門管教自主權限」理解"], "answer": 2, "explanation": "表格明確劃分司法獨立的兩大深層意義：1.「司法體制和司法權獨立」；2.「法官獨立」。"}, {"id": "gx_t5_q046", "topic": 5, "num": 46, "category": "6) 司法獨立的深層意義", "q": "根據《基本法》第八十條及第八十二條，香港特區司法體制獨立的核心表現是甚麼？", "options": ["特區終審法院的所有民事判決必須報請立法會司法委員會投票批准", "特區法院享有審判權和終審權且司法機關獨立於行政立法不受干涉", "特區各級法院法官在審判前必須向行政長官辦公室遞交審理提綱備案", "特區司法機構隸屬於北京最高人民法院直接設立之華南巡迴法庭管轄"], "answer": 1, "explanation": "特區享有審判權和終審權，司法機關獨立於行政及立法機關，不受立法機關和行政機關干涉。"}, {"id": "gx_t5_q047", "topic": 5, "num": 47, "category": "6) 司法獨立的深層意義", "q": "特別強調，在「一國兩制」憲制關係下，特區司法權與國家司法權處於甚麼關係？", "options": ["香港特區司法權完全從屬於廣東省高級人民法院的二審終審管轄體系", "中央人民政府各部委有權隨時向香港終審法院下達具體案件改判公函", "香港特區司法權亦獨立於國家司法權且中央亦不得干預特區司法權行使", "香港法院審理的所有刑事案件必須由最高人民檢察院派駐檢察官起訴"], "answer": 2, "explanation": "重點強調：在「一國兩制」憲制關係下，「香港特區的司法權亦獨立於國家司法權，中央亦不得干預香港特區司法權的行使」。"}, {"id": "gx_t5_q048", "topic": 5, "num": 48, "category": "6) 司法獨立的深層意義", "q": "根據《基本法》第八十五條，司法人員在履行審判職責時享有甚麼重要法治保障？", "options": ["法院獨立進行審判不受任何干涉司法人員履行審判職責行為不受追究", "法官在審理重大商事糾紛時享有直接扣押任何民營企業銀行帳戶特權", "法官及其全體家屬享有終身免向特區政府稅務局繳納個人薪俸稅優待", "主審法官享有兼任特區立法會議員並就自己審理的法案進行投票特權"], "answer": 0, "explanation": "引用基本法第八十五條：法院獨立審判不受任何干涉，司法人員履行審判職責的行為不受法律追究（享司法豁免權，所有人不得質疑）。"}, {"id": "gx_t5_q049", "topic": 5, "num": 49, "category": "6) 司法獨立的深層意義", "q": "「法官獨立」的根本價值在於確保司法人員在裁決案件時能達到甚麼裁判境界？", "options": ["法官能純粹根據法律專業獨立和公正無私地裁決案件不受外部壓力左右", "法官能優先考慮特區政府財政司的稅收利益以最大程度維護庫房收入", "法官能迎合社會主流大眾當前網絡輿論呼聲以避免引發媒體批評報道", "法官能嚴格遵循跨國外資銀行董事會的商業訴求以維護國際商業投資"], "answer": 0, "explanation": "法官獨立使法官「能純粹根據法律專業、獨立和公正無私地裁決案件」，免受政治、金錢或輿論干預。"}, {"id": "gx_t5_q050", "topic": 5, "num": 50, "category": "6) 司法獨立的深層意義", "q": "若行政官員、立法會議員或外國政客公開對正在審訊的司法案件施加輿論壓力，這違反了甚麼？", "options": ["符合西方民主社會所倡導之完全不受任何限制的言論自由正當表達權", "屬於國際人權組織授權外國使節行使正當外事監督權力的法定外交豁免", "符合普通法體系中鼓勵公眾廣泛參與法庭陪審團討論的公開審查原則", "公然違反《基本法》第八十五條確立的法院獨立審判不受任何干涉原則"], "answer": 3, "explanation": "《基本法》第85條明定審判不受任何干涉，任何公私主體企圖干預審訊、左右法官判決，均是對司法獨立的嚴重踐踏與違法行為。"}, {"id": "gx_t5_q051", "topic": 5, "num": 51, "category": "6) 司法獨立的深層意義", "q": "在香港特區司法管轄範圍內，法官在審理案件時是否需要向行政長官或特區政府進行工作請示？", "options": ["涉及特區政府作為被告的案件主審法官必須事先向行政長官提交判詞", "絕對不需要法官獨立行使審判權只服從法律事實不受任何行政指令干涉", "索賠金額超過一億港元的重大商事案件必須由律政司司長親自審核批覆", "凡是涉及外國籍當事人的案件主審裁判官必須報請外國駐港領事館核准"], "answer": 1, "explanation": "法官審理案件獨立行使審判權，只服從法律與事實，嚴禁向任何行政機構或個人進行請示，確保司法中立公正。"}, {"id": "gx_t5_q052", "topic": 5, "num": 52, "category": "6) 司法獨立的深層意義", "q": "關於「司法獨立」與「司法公開透明」兩者之間的關係，下列敘述何者最為正確？", "options": ["司法獨立要求法官在判詞中詳盡闡述事實分析與法律理據並公開接受檢驗", "司法獨立要求各級法院對所有刑事審判一律實行全面閉門秘密庭審程序", "司法獨立意味著裁判結果無需告知公眾且判詞完全不具備任何約束效力", "只有在被告人當庭認罪伏法的前提下法院才可以對外公布判決書全部內容"], "answer": 0, "explanation": "司法獨立要求程序正義與公開透明，法官必須在公開發布的判詞中詳細論證法律理據，接受法律專業與社會公眾的客觀檢驗。"}, {"id": "gx_t5_q053", "topic": 5, "num": 53, "category": "7) 基本法對司法獨立的保障", "q": "除了《基本法》第80、82及85條外，基本法還通過哪兩項關鍵條文保障司法獨立？", "options": ["第十五條市場經濟條款以及第二十五條計劃生育", "第四十三條行政長官職權以及第四十八條任命權", "第七十三條立法會職權以及第七十四條提案權限", "第八十八條任命安排以及第八十九條任期保障"], "answer": 3, "explanation": "兩大制度保障條文：第88條（任命安排）與第89條（任期保障）。"}, {"id": "gx_t5_q054", "topic": 5, "num": 54, "category": "7) 基本法對司法獨立的保障", "q": "根據《基本法》第八十八條，香港特別行政區法院法官的法定任命程序是甚麼？", "options": ["由特區行政長官單方面直接挑選政治盟友並發布行政命令予以正式任命", "由特區立法會全體議員透過競選大會一人一票直接選舉產生各級法官", "由北京最高人民法院直接派遣內地在職資深法官全面接管特區審判職責", "根據當地法官和法律界及知名人士組成的獨立委員會推薦由行政長官任命"], "answer": 3, "explanation": "引用《基本法》第八十八條：法官根據當地法官和法律界及其他方面知名人士組成的獨立委員會推薦，由行政長官任命。"}, {"id": "gx_t5_q055", "topic": 5, "num": 55, "category": "7) 基本法對司法獨立的保障", "q": "由於獨立委員會推薦影響力舉足輕重，根據以往慣例，行政長官對法官的任命權呈現甚麼特點？", "options": ["行政長官對法官的任命權呈現「形式性多於實質性」", "行政長官對法官的任命權呈現「實質性多於程序性」", "行政長官對法官的任命權呈現「隨意撤換不受約束性」", "行政長官對法官的任命權呈現「完全否定獨立委員會性」"], "answer": 0, "explanation": "紅字填空明確指出：由於獨立委員會推薦極具權威，根據慣例，特首的任命權「『形式性』多於『實質性』」，防止行政干預司法人事。"}, {"id": "gx_t5_q056", "topic": 5, "num": 56, "category": "7) 基本法對司法獨立的保障", "q": "根據《基本法》第八十九條，法院法官在甚麼法定嚴格情況下，行政長官才可啟動免職程序？", "options": ["法官連續三次判處特區政府在行政訴訟中敗訴時", "法官年齡滿五十歲且個人政治見解與特首不一致", "特區立法會多數議員對法官判詞提出口頭不信任", "只有在「無力履行職責或行為不檢」的情況下"], "answer": 3, "explanation": "《基本法》第八十九條規定法官「只有在無力履行職責或行為不檢的情況下」，方可予以免職，享有極高的任期保障。"}, {"id": "gx_t5_q057", "topic": 5, "num": 57, "category": "7) 基本法對司法獨立的保障", "q": "行政長官免除一般法院法官職務時，依法必須依據甚麼法定機構提出的建議方可執行？", "options": ["根據行政會議全體非官守成員以秘密投票形式作出的集體免職決議案", "根據香港警務處國家安全處發布之內部刑事調查結論報告予以免職處分", "根據終審法院首席法官任命的不少於三名當地法官組成審議庭之建議", "根據特區審計署對司法機構日常辦公經費開支提出的全面核查整改建議"], "answer": 2, "explanation": "特首免除法官，「才可根據終審法院首席法官任命的不少於三名當地法官組成的審議庭的建議，予以免職」。"}, {"id": "gx_t5_q058", "topic": 5, "num": 58, "category": "7) 基本法對司法獨立的保障", "q": "若要依法免除「終審法院首席法官」職務，行政長官必須履行甚麼更嚴格的審議程序？", "options": ["由特區立法會全體議員組成特別彈劾委員會直接行使全權免除首席法官", "由律政司司長一人單獨發布行政公報宣布終止首席法官的所有司法職責", "交由外國最高法院首席大法官聯席會議開庭進行國際司法道德違紀仲裁", "行政長官任命不少於五名當地法官組成審議庭審議並依照法定程序免職"], "answer": 3, "explanation": "免除終審法院首席法官，行政長官「才可任命不少於五名當地法官組成的審議庭進行審議，並可根據其建議，依照本法規定的程序，予以免職」。"}, {"id": "gx_t5_q059", "topic": 5, "num": 59, "category": "8) 司法獨立是法治重要基石", "q": "「司法獨立是法治的重要基石」主要由哪兩個重要觀點及理據所支持？", "options": ["保障公民權利維護社會信任基礎以及制衡權力防止濫權關鍵機制", "大幅加速刑事審判定罪率以及最大限度節省特區司法行政經費開支", "賦予特區公務員完全免責權以及簡化立法會審批各項公共財政開支", "樹立行政長官最高絕對權威以及徹底防範外資跨國企業撤資之風險"], "answer": 0, "explanation": "標題明確列出兩個支持觀點：觀點（1）司法獨立是保障公民權利、維護社會信任的基礎；觀點（2）司法獨立是制衡權力、防止濫權的關鍵機制。"}, {"id": "gx_t5_q060", "topic": 5, "num": 60, "category": "8) 司法獨立是法治重要基石", "q": "為何說司法獨立是「保障公民權利、維護社會信任的基礎」？", "options": ["使法院可以隨意宣告所有原告勝訴以迅速討好社會大眾弱勢階層心理", "使全體市民不再需要履行任何遵守本地法律與繳納各項稅款之義務", "使市民確信權利受侵害時能透過公正司法程序獲得救濟弱勢獲保護", "使富商階層可以享有專門設立之閉門秘密調解通道以規避法律責任"], "answer": 2, "explanation": "理據指出：司法獨立使市民確信，無論侵害來自他人或政府，都能透過公正程序獲得救濟，弱勢群體亦獲公平保護，維護社會對法治的信任。"}, {"id": "gx_t5_q061", "topic": 5, "num": 61, "category": "8) 司法獨立是法治重要基石", "q": "嚴正指出，若司法獨立受到外部操控或干預，將會對法治造成甚麼災難性崩潰？", "options": ["弱勢群體無法獲公平保護法律失去普遍適用特質且社會信任崩潰", "將會促使全球海外跨國投資資本以成倍速度大規模湧入本地商業市場", "特區政府推動各項重大公共工程建設之行政效率將獲得爆發式提升", "香港特區法律體系將會自動轉化為完全以不成文習慣法為主的體系"], "answer": 0, "explanation": "若司法受干預，「弱勢群體可能無法獲得公平的保護，法律亦將失去『普遍適用』的特質，社會對法治的信任也會崩潰」。"}, {"id": "gx_t5_q062", "topic": 5, "num": 62, "category": "8) 司法獨立是法治重要基石", "q": "法治的核心原則是「法律至上／法律的凌駕性」，其對一切公共權力提出了甚麼根本要求？", "options": ["允許行政機關在面臨經濟下行壓力時隨意突破法律框架實施特殊手段", "授權執法警務人員在執行公務時享有免受司法機關監督之排他性特權", "要求所有公共權力和公職人員必須在法律框架內運行並做到依法守法", "規定立法會議員可以隨意通過任何違反國家憲法和基本法的本地法律"], "answer": 2, "explanation": "理據指出：法治核心原則要求「所有公共權力／公職人員必須在法律框架內運行，依法守法」。"}, {"id": "gx_t5_q063", "topic": 5, "num": 63, "category": "8) 司法獨立是法治重要基石", "q": "為何說司法獨立是「制衡權力、防止濫權的關鍵機制」？", "options": ["賦予法院可以直接代替政府各局局長制定城市規劃與產業補貼政策", "確保法院能客觀中立審查政府行為和決策是否合憲合規合法防止濫權", "授權各級法官有權直接解散特區立法會並重新委任臨時立法會議員", "允許司法機關向各行政部門派駐財務監督審計專員直接行使否決權"], "answer": 1, "explanation": "理據指出：「司法獨立確保法院能夠客觀、中立地審查政府行為和決策是否合規合法（符合憲法及基本法原則）」。"}, {"id": "gx_t5_q064", "topic": 5, "num": 64, "category": "8) 司法獨立是法治重要基石", "q": "若司法機關受到行政或立法機關的干預與左右，市民在維護自身權利時將陷入甚麼絕境？", "options": ["市民可以直接向行政會議全體非官守議員提出私人刑事公訴維護權益", "所有民商事合同糾紛將會自動由民間行會仲裁機構提供免費全額調解", "市民將難以通過司法途徑追究權力濫用且法治的公正性也會徹底喪失", "公眾對特區政府各項施政決策的社會認同度與滿意度將大幅提高上漲"], "answer": 2, "explanation": "若司法機關受干預，「便無法有效制衡權力，市民將難以通過司法途徑追究權力濫用，法治的公正性也會喪失」。"}, {"id": "gx_t5_q065", "topic": 5, "num": 65, "category": "8) 司法獨立是法治重要基石", "q": "香港法律體系中的「司法覆核」（Judicial Review）制度，在制衡權力方面發揮著甚麼關鍵功能？", "options": ["普通市民用以挑戰終審法院確定終審判決的唯一常規普通民事途徑", "立法會專門用於彈劾行政長官嚴重違法瀆職行為的最高司法審判程序", "法院審查行政機關的決定或行為是否超越法定權限或違法的重要機制", "警務處內部專門用於審查警務人員違紀行為並實施紀律處分的聽證會"], "answer": 2, "explanation": "司法覆核是法院監督行政機關依法施政、糾正違法行政決定、保護公民合法權益不受非法公權力侵害的核心司法機制。"}, {"id": "gx_t5_q066", "topic": 5, "num": 66, "category": "8) 司法獨立是法治重要基石", "q": "「司法獨立使市民相信，無論侵害來自他人或政府，都能透過公正程序獲得救濟」，這維繫了甚麼？", "options": ["促使特區政府全面取消所有公立綜合醫院的住院門診醫療收費標準", "使香港特區的所有商業合約簽署均不再需要律師提供法律專業審查", "維繫了社會各界對法律公正性與特區法治體制的堅定信心與社會穩定", "強制所有外資跨國企業必須將其全球仲裁總部永久性遷移至香港特區"], "answer": 2, "explanation": "司法獨立是社會正義的守門人，為市民提供公正救濟，是維繫社會成員對法律信仰與公信力的核心紐帶。"}, {"id": "gx_t5_q067", "topic": 5, "num": 67, "category": "8) 司法獨立是法治重要基石", "q": "法官在審理涉及特區政府政策爭議的案件時，其恪守「中立」的法治底線是甚麼？", "options": ["優先配合特區政府推動政策落地的現實行政需要作出有利政府的判決", "只依據事實證據與法律原則審查決策是否合法而不受政治政策偏好影響", "完全迎合網絡社交媒體上最激烈的大眾群體情緒以避免法院遭受圍堵", "主動邀請外國司法界政要向法院發布指導意見以展示審判的國際視野"], "answer": 1, "explanation": "法官職責在於適用法律，不參與政治政策制定，中立客觀審查行政行為是否合憲合法，體現法官不偏不倚的司法品格。"}, {"id": "gx_t5_q068", "topic": 5, "num": 68, "category": "8) 司法獨立是法治重要基石", "q": "總結而言，一個文明法治社會如果沒有司法獨立作為堅強後盾，將會產生甚麼根本惡果？", "options": ["特區立法會的法案辯論審議時間將會由過去數月大幅縮短至數小時內", "所有公立教育機構的常規學術研究經費將會獲得聯合國直接全額撥款", "法律至上淪為空談且權益救濟化為泡影社會終將陷入強權統治之深淵", "香港市民在海外所有主權國家均可隨意享受免辦理護照出入境的優待"], "answer": 2, "explanation": "沒有司法獨立，審判公正性難存，法律至上與公民權益救濟將化為泡影，公權力得不到制衡，法治社會將名存實亡。"}, {"id": "gx_t5_q069", "topic": 5, "num": 69, "category": "9) 法律面前人人平等與機構", "q": "「香港居民在法律面前一律平等」莊嚴規定於《香港基本法》的哪一條文之中？", "options": ["明文規定於《香港基本法》第十八條第一款中", "明文規定於《香港基本法》第三十九條第二款", "明文規定於《香港基本法》第二十五條之中", "明文規定於《香港基本法》第八十條司法章節"], "answer": 2, "explanation": "《香港基本法》第二十五條規定「香港居民在法律面前一律平等」。"}, {"id": "gx_t5_q070", "topic": 5, "num": 70, "category": "9) 法律面前人人平等與機構", "q": "「法律面前人人平等」包含哪兩個互為表裡的關鍵內涵？", "options": ["司法平等法律適用上一律平等以及人人守法無超越法律特權", "全民經濟收入分配絕對均等以及各行業從業人員工資完全一致", "所有市民在教育資源分配上一律享受完全相同的高等學府學位", "在特區立法會選舉中每一位選民均可享有投下五張選票之特權"], "answer": 0, "explanation": "紅字填空明確指出兩大內涵：1.司法平等：法律適用上一律平等（不論身份、地位、財產、種族等差異）；2.人人守法：無超越法律的特權（任何人不得享有法律以外的特權）。"}, {"id": "gx_t5_q071", "topic": 5, "num": 71, "category": "9) 法律面前人人平等與機構", "q": "不論是政府高官、立法會議員還是富商名流，一旦觸犯法律同樣受到制裁，這直接印證了甚麼？", "options": ["普通市民觸犯刑法條例可以由社區長老調解而不必接受法庭審判", "人人守法原則任何人均不得享有超越法律規範之外的任何特殊權力", "只有社會低收入貧困階層才需要遵守特區立法會制定的各項法規", "公職人員因對社會作出重大貢獻在刑事審判中享有自動免罰特權"], "answer": 1, "explanation": "任何人觸犯法律均受制裁，不因財富、政見或官職而有所區別，證明無人能享有法律以外的特權。"}, {"id": "gx_t5_q072", "topic": 5, "num": 72, "category": "9) 法律面前人人平等與機構", "q": "陳先生面對錢債官司需要聘請律師，但他因公司倒閉經濟極度困難，他應向香港哪個機構求助？", "options": ["應當向消費者委員會投訴並申請商業賠償退款處理", "應當向破產管理署申請全額免除所有的民事債務合約", "應當向申訴專員公署投訴商業銀行未提供免息貸款處", "應當向特區政府法律援助署申請專業法律援助服務"], "answer": 3, "explanation": "表格明確載明：面對官司缺乏經濟能力尋求律師服務，對應的專門機構是「法律援助署」。"}, {"id": "gx_t5_q073", "topic": 5, "num": 73, "category": "9) 法律面前人人平等與機構", "q": "外籍人士亞倫先生認為自己在工作場所因種族膚色受到上司惡意歧視，他應向香港哪個法定機構投訴？", "options": ["應當向個人資料私隱專員公署申請查封上司個人電腦處", "應當向香港警務處反恐特勤隊報案要求拘捕公司全體高管", "應當向香港特別行政區平等機會委員會提出正式投訴", "應當向勞工處申請領取全額破產欠薪保障基金補助款項"], "answer": 2, "explanation": "表格明確標示：受到種族膚色歧視，對應的專門機構是「平等機會委員會」（平機會）。"}, {"id": "gx_t5_q074", "topic": 5, "num": 74, "category": "9) 法律面前人人平等與機構", "q": "根據重點知識，香港現行的「四條反歧視條例」包括下列哪一組？", "options": ["《宗教信仰條例》《年齡保障條例》《身材外貌條例》《文化方言條例》", "《政治見解條例》《學歷文憑條例》《財富資產條例》《住宅租賃條例》", "《職業工種條例》《籍貫方言條例》《工作年資條例》《社團活動條例》", "《殘疾歧視條例》《性別歧視條例》《種族歧視條例》《家庭崗位歧視條例》"], "answer": 3, "explanation": "香港四條反歧視條例為：《殘疾歧視條例》、《性別歧視條例》、《種族歧視條例》、《家庭崗位歧視條例》。"}, {"id": "gx_t5_q075", "topic": 5, "num": 75, "category": "10) 公平公正審訊的六大原則", "q": "公平公正審訊原則（一）規定「審訊必須公開」，其在司法實踐中的具體要求是甚麼？", "options": ["法庭審判庭必須允許電視台商業娛樂節目在庭內進行現場帶貨直播", "法院乃公開地方公眾人士有權自由進出旁聽且審訊結果判詞須公開", "陪審團全體成員在閉門評議案件時的私人對話記錄必須向全網廣播", "審訊庭審過程只允許持有特定政府記者證件的公職公務員入內記錄"], "answer": 1, "explanation": "法院乃公開的地方，公眾人士均有權自由進出觀察運作，審訊的結果和判詞同樣須公開予公眾知悉（陽光司法）。"}, {"id": "gx_t5_q076", "topic": 5, "num": 76, "category": "10) 公平公正審訊的六大原則", "q": "公平公正審訊原則（二）規定「被告人有權盡早接受公正審判」，這主要是為了防止甚麼弊端？", "options": ["要求執法警員在拘捕嫌疑人後的一小時之內必須草率完成結案程序", "允許刑事被告人可以無限期申請將正式開庭審訊日期延後至數年後", "防止司法機關隨意無故拖延審訊以保障被合法拘捕人士之法定權利", "授權檢控官在證據不足時可以任意延長對犯罪嫌疑人的拘留看管期"], "answer": 2, "explanation": "任何人在被合法拘捕後，享有盡早接受司法機關公正審判的權利，「不得隨意拖延」（遲來的正義非正義）。"}, {"id": "gx_t5_q077", "topic": 5, "num": 77, "category": "10) 公平公正審訊的六大原則", "q": "在普通法刑事審訊中，「無罪推定」（Presumption of Innocence）原則的舉證責任如何分配？", "options": ["被告人必須自費聘請私人偵探搜集全部不在場證明自證清白無辜", "由主審法官全權承擔搜集證明被告人有罪或無罪的全部法定責任", "控辯雙方均不需要提供任何實質證據純憑陪審團成員之主觀印象", "在未經判罪前假定無罪且證明有罪的舉證責任在於控方而非被告人"], "answer": 3, "explanation": "任何人在未經判罪前均假定無罪，證明被告觸犯法律的「舉證責任在於控方」，被告人有權但沒有責任自證無罪。"}, {"id": "gx_t5_q078", "topic": 5, "num": 78, "category": "10) 公平公正審訊的六大原則", "q": "普通法刑事審訊要求控方提出的證據必須達到甚麼法定舉證標準，法庭方可將被告定罪？", "options": ["只要控方證據達到百分之五十一的相對可能性衡量標準即可定罪", "只要受害人單方面口供情真意切且當庭流淚法庭即可直接定罪處罰", "必須達到「沒有任何合理的疑點」（超越合理疑點）的最高標準", "只要執法警務人員書面保證案件事實真實可信法庭即推定罪名成立"], "answer": 2, "explanation": "普通法要求控方提出的證據必須達到「『沒有任何合理的疑點』的標準才可將被告入罪」。"}, {"id": "gx_t5_q079", "topic": 5, "num": 79, "category": "10) 公平公正審訊的六大原則", "q": "關於公平公正審訊原則（四）中的「緘默權」（Right to Silence），下列法律解釋何者最準確？", "options": ["被告人有權拒絕作供且法院或陪審團均不能因其行使緘默權作不利推斷", "被告人在警誡盤問時保持緘默將會被主審法庭直接視為默認自己有罪", "緘默權僅適用於輕微交通違例罰款案件而在重大刑事案件中完全無效", "執法警員有權對行使緘默權的嫌疑人實施連續疲勞審訊迫使其開口供"], "answer": 0, "explanation": "被告沒有責任自證無罪，有權保持緘默拒絕作供，「法院或陪審團均不能因他行使緘默權而就案情對他作出不利的推斷」。"}, {"id": "gx_t5_q080", "topic": 5, "num": 80, "category": "10) 公平公正審訊的六大原則", "q": "何謂公平公正審訊原則（六）中的「一罪不二審」（Double Jeopardy）原則？", "options": ["同一被告人不能因同一犯罪事實被重複起訴審判或處罰兩次或以上", "同一宗刑事訴訟案件在開庭時必須由兩名主審法官共同負責審理之", "凡被法院裁定罪名不成立的公民在一年之內不得再次進入任何法庭", "任何觸犯普通法刑事條例的罪犯其法定最高監禁刑期不得超過兩年"], "answer": 0, "explanation": "一罪不二審原則是指「同一被告人不能因同一犯罪事實被起訴、審判或處罰兩次或以上」，免受無休止追訴。"}, {"id": "gx_t6_q001", "topic": 6, "num": 1, "category": "1) 香港居民的分類與居留權資格", "q": "根據《香港基本法》第二十四條，香港特別行政區居民依法劃分為哪兩個類別？", "options": ["中國籍居民以及外國籍居住者", "本地出生居民以及移居入籍者", "常住就業居民以及流動打工者", "永久性居民以及非永久性居民"], "answer": 3, "explanation": "根據《基本法》第二十四條，香港居民包括「永久性居民」和「非永久性居民」。"}, {"id": "gx_t6_q002", "topic": 6, "num": 2, "category": "1) 香港居民的分類與居留權資格", "q": "根據《基本法》第二十四條，下列哪類中國公民符合資格成為特區永久性居民？", "options": ["在特區成立以前或以後在香港出生的中國公民", "僅限特區成立以前在香港出生長大的中國公民", "持探親簽注在香港累計短暫逗留滿三年者", "在香港購買自住物業並居住滿一年的外籍人士"], "answer": 0, "explanation": "《基本法》第二十四條第（一）款規定：在香港特別行政區成立以前或以後在香港出生的中國公民為永久性居民。"}, {"id": "gx_t6_q003", "topic": 6, "num": 3, "category": "1) 香港居民的分類與居留權資格", "q": "中國公民在香港特別行政區通常居住連續滿多少年，方可依法取得香港居留權？", "options": ["在香港通常居住連續滿三年以上", "在香港通常居住連續滿五年以上", "在香港通常居住連續滿七年以上", "在香港通常居住連續滿十年以上"], "answer": 2, "explanation": "《基本法》第二十四條第（二）款規定：在香港特別行政區成立以前或以後在香港通常居住連續七年以上的中國公民為永久性居民。"}, {"id": "gx_t6_q004", "topic": 6, "num": 4, "category": "1) 香港居民的分類與居留權資格", "q": "非中國籍人士要成為香港特區永久性居民，除持有效旅行證件並居港滿七年外還須滿足甚麼條件？", "options": ["必須在香港全款自置一處豪宅物業", "必須與香港永久居民登記結婚滿三年", "必須以香港為其個人的永久居住地", "必須放棄原國籍並加入中國國籍身份"], "answer": 2, "explanation": "引用《基本法》第二十四條第（四）款：持有效旅行證件進入香港、通常居住連續七年以上「並以香港為永久居住地」的非中國籍的人。"}, {"id": "gx_t6_q005", "topic": 6, "num": 5, "category": "1) 香港居民的分類與居留權資格", "q": "非中國籍香港永久性居民在香港所生的子女，在甚麼年齡條件下享有香港居留權？", "options": ["在香港所生的未滿十八周歲的子女", "在香港所生的未滿二十一周歲子女", "不限年齡終身享有香港特區居留權", "年滿二十五周歲並在香港工作納稅"], "answer": 1, "explanation": "《基本法》第二十四條第（五）款規定：在香港所生的「未滿二十一周歲的子女」為永久性居民。"}, {"id": "gx_t6_q006", "topic": 6, "num": 6, "category": "1) 香港居民的分類與居留權資格", "q": "根據《基本法》第二十四條，何謂「香港特別行政區非永久性居民」？", "options": ["完全未持有任何合法出入境簽證的偷渡客", "在香港投資超過三千萬港元的海外富商", "有資格取得香港身份證但無居留權的人", "持有旅遊證件短暫來港觀光購物的旅客"], "answer": 2, "explanation": "非永久性居民是指「有資格依照香港特別行政區法律取得香港居民身份證，但沒有居留權的人」。"}, {"id": "gx_t6_q007", "topic": 6, "num": 7, "category": "1) 香港居民的分類與居留權資格", "q": "在案例中，南丫島原居民、著名演員周潤發屬於哪類香港居民？", "options": ["非永久性居民因其常年在海外拍攝好萊塢電影", "非永久性居民因其未持有特區政府發放回港證", "流動受限制居民因其戶籍仍屬於廣東省新安縣", "永久性居民因其為在香港出生的中國公民"], "answer": 3, "explanation": "表格分析：周潤發屬於「永久性居民」，依據是《基本法》第24條第（一）款「在香港出生的中國公民」。"}, {"id": "gx_t6_q008", "topic": 6, "num": 8, "category": "1) 香港居民的分類與居留權資格", "q": "在德國出生的盛智文曾任海洋公園主席，他屬於香港永久性居民，法理依據是甚麼？", "options": ["因為他在香港特區成立以前在九龍半島出生長大", "因為他在海外出生但父母雙方均為中國籍公務員", "在香港通常居住連續滿七年並以香港為永久居住地", "因為他曾擔任特區政府公職因而自動獲賜居留權"], "answer": 2, "explanation": "表格分析：盛智文屬於永久性居民，說明依據為「在香港通常居住連續七年以上並以香港為永久居住地的非中國籍的人」（第24條第4款）。"}, {"id": "gx_t6_q009", "topic": 6, "num": 9, "category": "1) 香港居民的分類與居留權資格", "q": "前國家跳水隊運動員郭晶晶居港滿七年，她在香港居民身份分類上屬於甚麼類別？", "options": ["永久性居民依據居港連續滿七年以上的中國公民", "非永久性居民因其曾代表國家隊出戰各項賽事", "外籍流動居民因其未辦理脫離內地戶籍的手續", "臨時居留人士因其配偶為香港特區立法會議員"], "answer": 0, "explanation": "表格指出：郭晶晶屬於「永久性居民」，依據是「在香港通常居住連續七年以上的中國公民」（基本法第24條第2款）。"}, {"id": "gx_t6_q010", "topic": 6, "num": 10, "category": "1) 香港居民的分類與居留權資格", "q": "黑山籍外援球員丹恩奴域於2021年來港踢球，他在香港居民分類中屬於哪一類？", "options": ["永久性居民因其榮獲香港足球先生體育殊榮", "非法居留人士因其尚未取得香港居民身份證", "非永久性居民因其不符合永久居民法定條件", "外交豁免人士因其持有黑山共和國官方護照"], "answer": 2, "explanation": "表格指出：丹恩奴域剛來港效力，未滿足通常居港七年等條件，「不符基本法第二十四條規定永久性居民的條件」，屬於「非永久性居民」。"}, {"id": "gx_t6_q011", "topic": 6, "num": 11, "category": "1) 香港居民的分類與居留權資格", "q": "永久性居民與非永久性居民在法律權利上最核心的區別是甚麼？", "options": ["非永久性居民在香港境內完全不得使用公立醫院", "永久性居民在香港享有免向政府繳納各項稅款特權", "永久性居民享有居留權及依法享有選舉與被選舉權", "非永久性居民在香港法庭訴訟中不得聘請辯護律師"], "answer": 2, "explanation": "表格列出：永久性居民「享有居留權（其他：如選舉權等）」，非永久性居民「沒有居留權（其他：如選舉權等）」。"}, {"id": "gx_t6_q012", "topic": 6, "num": 12, "category": "1) 香港居民的分類與居留權資格", "q": "根據《基本法》第二十六條，下列哪一項政治權利是「專屬於香港永久性居民」享有的？", "options": ["在香港特區境內享有各項言論出版新聞自由", "在香港特區境內享有通訊秘密與宗教信仰自由", "向香港各級法庭提起訴訟並尋求法律援助權利", "依法享有特區各項公職選舉權和被選舉權"], "answer": 3, "explanation": "《基本法》第26條規定：「香港特別行政區永久性居民依法享有選舉權和被選舉權」，非永久性居民不享有此項政治權利。"}, {"id": "gx_t6_q013", "topic": 6, "num": 13, "category": "1) 香港居民的分類與居留權資格", "q": "香港居民身份證上的星號標註「***」代表持證人具備甚麼條件？", "options": ["年滿十八歲或以上及有資格申領特區回港證", "年齡為十一至十七歲且在海外出生的青少年", "持有者在香港逗留期間受到入境事務處限制", "持有者為香港公務員享有終身免費醫療福利"], "answer": 0, "explanation": "「*** 代表：年齡為18歲或以上及有資格申領香港特別行政區回港證」。"}, {"id": "gx_t6_q014", "topic": 6, "num": 14, "category": "1) 香港居民的分類與居留權資格", "q": "香港居民身份證上的星號標註「*」代表持證人處於甚麼年齡段？", "options": ["年齡為十八歲或以上且享有香港特區居留權", "年齡為六十五歲或以上享有長者生活津貼者", "年齡為十一歲以下且未持有有效旅行證件者", "年齡為十一至十七歲及有資格申領回港證"], "answer": 3, "explanation": "「* 代表：年齡為11-17歲及有資格申領香港特別行政區回港證」。"}, {"id": "gx_t6_q015", "topic": 6, "num": 15, "category": "1) 香港居民的分類與居留權資格", "q": "香港身份證上的字母標註「A」代表甚麼法律權益？", "options": ["代表持有者擁有香港特別行政區居留權", "代表持證人在香港的居留受到入境處限制", "代表持證人報稱在中國大陸地區出生長大", "代表持證人享有免向稅務局繳稅之外交豁免"], "answer": 0, "explanation": "圖表標明：「A」代表「擁有香港居留權」（Right of Abode）。"}, {"id": "gx_t6_q016", "topic": 6, "num": 16, "category": "1) 香港居民的分類與居留權資格", "q": "香港身份證上的字母標註「C」代表持證人處於甚麼入境狀態？", "options": ["代表持有者擁有香港特別行政區永久居留權", "代表持證人報稱在香港本地醫院出生長大", "代表持證人有資格直接申領香港特區護照", "代表持證人在香港的居留受到入境處限制"], "answer": 3, "explanation": "圖表標明：「C」代表「在香港的居留受到入境處限制」（通常為持簽證逗留的非永久性居民）。"}, {"id": "gx_t6_q017", "topic": 6, "num": 17, "category": "1) 香港居民的分類與居留權資格", "q": "在香港身份證的出生地代碼中，字母「Z」代表甚麼報稱出生地？", "options": ["代表持證人報稱在中國大陸出生", "代表持證人報稱在其他外國出生", "代表持證人出生地點目前尚不明確", "代表持證人報稱在香港本地出生"], "answer": 3, "explanation": "「Z」代表「報稱在香港出生」。"}, {"id": "gx_t6_q018", "topic": 6, "num": 18, "category": "1) 香港居民的分類與居留權資格", "q": "在香港身份證的出生地代碼中，字母「X」代表甚麼報稱出生地？", "options": ["代表持證人報稱在中國大陸出生", "代表持證人報稱在香港本地出生", "代表持證人報稱在其他海外國家出生", "代表持證人持有外國護照居留權身份"], "answer": 0, "explanation": "「X」代表「報稱在中國大陸出生」。"}, {"id": "gx_t6_q019", "topic": 6, "num": 19, "category": "1) 香港居民的分類與居留權資格", "q": "在香港身份證的出生地代碼中，數字「O」代表持證人甚麼出生情況？", "options": ["代表持證人報稱在香港特區出生", "代表持證人報稱在澳門特區出生", "代表持證人報稱在其他國家出生", "代表持證人未向入境處申報出生地"], "answer": 2, "explanation": "「O」代表「報稱在其他國家出生」。"}, {"id": "gx_t6_q020", "topic": 6, "num": 20, "category": "1) 香港居民的分類與居留權資格", "q": "根據鞏固練習，周潤發（成年、有居留權、香港出生）的正確符號標註是：", "options": ["正確符號標註為「***AO」", "正確符號標註為「***AX」", "正確符號標註為「***CO」", "正確符號標註為「***AZ」"], "answer": 3, "explanation": "表格答案：周潤發年滿18歲（***）、有居留權（A）、在香港出生（Z），標註為「***AZ」。"}, {"id": "gx_t6_q021", "topic": 6, "num": 21, "category": "1) 香港居民的分類與居留權資格", "q": "盛智文先生（成年、有居留權、在德國出生）在其香港身份證上的正確符號標註是：", "options": ["正確符號標註為「***AZ」", "正確符號標註為「***AX」", "正確符號標註為「***CO」", "正確符號標註為「***AO」"], "answer": 3, "explanation": "表格答案：盛智文年滿18歲（***）、有居留權（A）、其他國家出生（O），標註為「***AO」。"}, {"id": "gx_t6_q022", "topic": 6, "num": 22, "category": "1) 香港居民的分類與居留權資格", "q": "郭晶晶女士（成年、有居留權、在內地河北出生）在其身份證上的正確符號標註是：", "options": ["正確符號標註為「***AZ」", "正確符號標註為「***AO」", "正確符號標註為「***AX」", "正確符號標註為「***CO」"], "answer": 2, "explanation": "表格答案：郭晶晶年滿18歲（***）、有居留權（A）、在中國大陸出生（X），標註為「***AX」。"}, {"id": "gx_t6_q023", "topic": 6, "num": 23, "category": "1) 香港居民的分類與居留權資格", "q": "外援球員丹恩奴域（成年、受入境處逗留限制、黑山出生）在其身份證上的正確符號標註是：", "options": ["正確符號標註為「***AZ」", "正確符號標註為「***AO」", "正確符號標註為「***CO」", "正確符號標註為「***AX」"], "answer": 2, "explanation": "表格答案：丹恩奴域年滿18歲（***）、居留受限制（C）、其他國家出生（O），標註為「***CO」。"}, {"id": "gx_t6_q024", "topic": 6, "num": 24, "category": "1) 香港居民的分類與居留權資格", "q": "在香港特區成立以前或以後，香港永久居民在香港以外所生的中國籍子女，其地位是：", "options": ["依法屬於受入境處逗留限制的非居民", "必須在香港連續居住滿七年方可成為居民", "一律不具備獲得香港居留權之法定資格", "依法屬於香港特別行政區永久性居民"], "answer": 3, "explanation": "《基本法》第二十四條第（三）款規定：第(一)、(二)項所列居民在香港以外所生的中國籍子女，為香港特別行政區永久性居民。"}, {"id": "gx_t6_q025", "topic": 6, "num": 25, "category": "1) 香港居民的分類與居留權資格", "q": "在香港通常居住連續滿七年並取得永久居民身份證的人士，享有甚麼特有權限？", "options": ["在香港享有免受任何香港本地刑事法律審判", "在香港享有居留權且入境不受任何限制條件", "在香港享有隨意進出特區政府機密部門特權", "在香港享有免交任何水費電費及差餉物業稅"], "answer": 1, "explanation": "享有香港居留權意味著擁有在香港自由進出、逗留、工作且不附帶任何逗留期限或條件的權利。"}, {"id": "gx_t6_q026", "topic": 6, "num": 26, "category": "1) 香港居民的分類與居留權資格", "q": "持單程證來港定居未滿七年的內地人士，在香港居民分類中屬於哪一類？", "options": ["有資格取得居民身份證的非永久性居民", "已經完全享有選舉權的特區永久性居民", "不屬於香港居民而屬於海外非法滯留者", "享有雙重國籍待遇的特區高級公職人員"], "answer": 0, "explanation": "持單程證來港定居但未住滿七年者，持有香港居民身份證，但在住滿七年前屬於「非永久性居民」。"}, {"id": "gx_t6_q027", "topic": 6, "num": 27, "category": "1) 香港居民的分類與居留權資格", "q": "非永久性居民在香港通常居住連續滿七年後，若想成為永久性居民，須履行甚麼程序？", "options": ["向入境事務處申請核實其永久性居民身份資格", "必須親自前往北京國務院辦公廳領取委任狀", "必須由全體立法會議員投票一致表決批准之", "自動由香港警務處向其郵寄永久身份證證件"], "answer": 0, "explanation": "符合通常居住七年條件後，須向特區入境事務處提交證明文件申請核實永久性居民資格，獲批後換領永久居民身份證。"}, {"id": "gx_t6_q028", "topic": 6, "num": 28, "category": "1) 香港居民的分類與居留權資格", "q": "釐清香港居民中「永久性居民」與「非永久性居民」的劃分，最根本的法律依據是甚麼？", "options": ["最根本的法律依據是英國國會發布的樞密院令", "最根本的法律依據是《基本法》第二十四條", "最根本的法律依據是香港大律師公會的會議記錄", "最根本的法律依據是聯合國難民署國際難民公約"], "answer": 1, "explanation": "《基本法》第二十四條詳細界定了香港永久性居民的六大類別及非永久性居民的定義，是特區居民身份的最高憲制依據。"}, {"id": "gx_t6_q029", "topic": 6, "num": 29, "category": "2) 香港居民的基本權利", "q": "法學概念中何謂公民的「權利」（Right）？", "options": ["指政府公務人員在執法時專屬享有的特權", "指法律所賦予及保障人民享有的利益", "指全體市民自發承擔的社會道德倫理義務", "指民間慈善團體每年分配的無償救濟資金"], "answer": 1, "explanation": "重點（1）明確定義：「權利」是指「法律所賦予及保障人民享有的利益」。"}, {"id": "gx_t6_q030", "topic": 6, "num": 30, "category": "2) 香港居民的基本權利", "q": "《香港特別行政區基本法》規定並保障香港居民基本權利，主要集中在哪一章？", "options": ["集中規定於《基本法》第三章條文之中", "集中規定於《基本法》第一章總則之中", "集中規定於《基本法》第二章中央關係中", "集中規定於《基本法》第四章政治體制中"], "answer": 0, "explanation": "《基本法》保障香港居民的基本權利，主要在「第三章規定的香港居民基本權利」，部分亦分散於其他章節。"}, {"id": "gx_t6_q031", "topic": 6, "num": 31, "category": "2) 香港居民的基本權利", "q": "將《基本法》保障香港居民的基本權利歸納為哪四大核心範疇？", "options": ["外交豁免權單方面宣戰權國防指揮與軍購權限", "免稅進口權跨國並購權外匯定價與貨幣印發權", "法律及司法權利政治參與經濟社文與人身自由", "土地自決權特區疆界變更權與設立私人審判庭"], "answer": 2, "explanation": "歸納為四大範疇：法律及司法權利、政治參與權利、經濟社會及文化權利、人身自由。"}, {"id": "gx_t6_q032", "topic": 6, "num": 32, "category": "2) 香港居民的基本權利", "q": "《基本法》第二十五條規定「香港居民在法律面前一律平等」，這屬於哪一範疇？", "options": ["屬於香港居民享有的政治參政權利範疇", "屬於香港居民享有的法律及司法權利範疇", "屬於香港居民享有的經濟社會文化權利範疇", "屬於香港居民享有人身自由與私隱權利範疇"], "answer": 1, "explanation": "將《基本法》第二十五條歸入「法律及司法權利」範疇。"}, {"id": "gx_t6_q033", "topic": 6, "num": 33, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第三十五條，香港居民在獲得法律服務方面享有哪些重大權利？", "options": ["有權自行設立民營法庭審理鄰居侵權糾紛訴訟", "有權要求特區政府無償承擔一切商業合同違約金", "有權得到秘密法律諮詢向法院起訴並獲司法補救", "有權拒絕遵守終審法院依法律程序作出的判決書"], "answer": 2, "explanation": "引述第35條：居民有權得到秘密法律諮詢、向法院提起訴訟、選擇律師及時保護權益或獲得司法補救。"}, {"id": "gx_t6_q034", "topic": 6, "num": 34, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第三十五條第二款，香港居民對政府部門行政行為享有甚麼救濟權利？", "options": ["有權對行政部門和行政人員的行為向法院起訴", "有權直接罷免任何一名決策局常任秘書長職務", "有權私自拘禁任何在執法過程中有過失的警員", "有權封鎖政府總部大樓要求撤銷相關行政決定"], "answer": 0, "explanation": "引用第35條第2款：「香港居民有權對行政部門和行政人員的行為向法院提起訴訟」（如司法覆核）。"}, {"id": "gx_t6_q035", "topic": 6, "num": 35, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第八十七條，任何人在被合法拘捕後享有甚麼關鍵司法審判權利？", "options": ["享有不向執法法庭提供任何個人身份證明特權", "享有立即無條件保釋且免受一切刑事調查之特權", "享有隨意指定特定法官擔任主審法官之選擇權", "享有盡早接受公正審判權利未判罪前假定無罪"], "answer": 3, "explanation": "引用第87條：任何人在被合法拘捕後，「享有盡早接受司法機關公正審判的權利，未經司法機關判罪之前均假定無罪」（無罪推定）。"}, {"id": "gx_t6_q036", "topic": 6, "num": 36, "category": "2) 香港居民的基本權利", "q": "《基本法》第二十一條規定，香港特區居民中的中國公民依法享有甚麼政治權利？", "options": ["直接擔任全國各省省級人民政府省長行政職務", "享有完全免除遵守國家憲法所有原則之特殊優待", "直接制定並修改國家對外徵收進口關稅之稅則表", "依法參與國家事務管理並選出港區全國人大代表"], "answer": 3, "explanation": "引述第21條：居民中的中國公民依法參與國家事務管理，按名額選出香港特區全國人大代表，參加最高國家權力機關工作。"}, {"id": "gx_t6_q037", "topic": 6, "num": 37, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第二十七條，香港居民在政治與公民表達方面享有哪些廣泛自由？", "options": ["享有在互聯網上隨意造謠誹謗他人免受起訴特權", "享有未經批準在公共道路上私自搭建路障的自由", "享有言論新聞出版結社集會遊行示威罷工等自由", "享有任意煽動推翻國家根本制度免受制裁之特權"], "answer": 2, "explanation": "引述第27條：香港居民享有言論、新聞、出版的自由，結社、集會、遊行、示威的自由，組織和參加工會、罷工的權利和自由。"}, {"id": "gx_t6_q038", "topic": 6, "num": 38, "category": "2) 香港居民的基本權利", "q": "《基本法》第六條在經濟權利範疇作出了甚麼具有重大保障意義的規定？", "options": ["所有私營工商業企業每隔十年必須實施公有化", "政府可以不經法庭審批直接無償徵收任何物業", "外資企業在香港的所有銀行存款利息一律充公", "香港特別行政區依法保護私有財產權不受侵犯"], "answer": 3, "explanation": "引述第6條：香港特別行政區依法保護私有財產權。"}, {"id": "gx_t6_q039", "topic": 6, "num": 39, "category": "2) 香港居民的基本權利", "q": "《基本法》第三十三條在勞動就業自由層面賦予了香港居民甚麼基本權利？", "options": ["特區政府必須無條件為每位市民安排公務員職位", "員工可以隨時離職且僱主必須全額發放終身工資", "香港居民享有自由選擇職業從事工作的權利", "所有市民享有免向強制性公積金供款之個人特權"], "answer": 2, "explanation": "引述第33條：香港居民有選擇職業的自由。"}, {"id": "gx_t6_q040", "topic": 6, "num": 40, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第三十四條，香港居民在文化活動領域享有甚麼憲制自由？", "options": ["有進行學術研究文學藝術創作其他文化活動自由", "有隨意在各類歷史古蹟建築物上噴漆塗鴉的自由", "有未經原創作者同意隨意商業翻印他人版權自由", "有在居民住宅區深夜使用超大喇叭製造噪音自由"], "answer": 0, "explanation": "引述第34條：香港居民有進行學術研究、文學藝術創作和其他文化活動的自由。"}, {"id": "gx_t6_q041", "topic": 6, "num": 41, "category": "2) 香港居民的基本權利", "q": "《基本法》第三十六條規定香港居民享有享受社會福利權利，勞工的哪些權益受保護？", "options": ["全體勞工每年享有連續半年之帶薪海外培訓假期", "勞工的福利待遇和退休保障權益受法律充分保護", "全體僱員享有免除接受任何僱主工作績效考評權", "僱員在離職時可以隨意拿走公司的所有核心專利"], "answer": 1, "explanation": "引述第36條：香港居民有依法享受社會福利的權利。勞工的福利待遇和退休保障受法律保護。"}, {"id": "gx_t6_q042", "topic": 6, "num": 42, "category": "2) 香港居民的基本權利", "q": "《基本法》第三十七條保護香港居民在婚姻家庭生活方面的甚麼權利？", "options": ["父母有權強制包辦成年子女婚姻家庭之特有權利", "香港居民的婚姻自由和自願生育權利受法律保護", "公民享有隨意解除民事婚姻關係免受財產分割權", "家庭成員享有免繳特區政府公共房屋租金之特權"], "answer": 1, "explanation": "引述第37條：香港居民的婚姻自由和自願生育的權利受法律保護。"}, {"id": "gx_t6_q043", "topic": 6, "num": 43, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第二十八條，在保護「人身自由」方面作出了哪些嚴厲的法律禁令？", "options": ["禁止警務人員在犯罪現場逮捕持槍暴力襲擊嫌疑人", "禁止法院在任何情況下判處重大罪犯監禁式刑罰", "禁任意非法逮捕拘留監禁搜身酷刑非法剝奪生命", "禁止執法人員依法截查任何形跡可疑之過境車輛"], "answer": 2, "explanation": "引述第28條：居民人身自由不受侵犯，不受任意或非法逮捕、拘留、監禁，禁止非法搜身酷刑及非法剝奪生命。"}, {"id": "gx_t6_q044", "topic": 6, "num": 44, "category": "2) 香港居民的基本權利", "q": "《基本法》第二十九條規定「香港居民的住宅不受侵犯」，其核心禁令是甚麼？", "options": ["禁止屋宇署對任何違章危險建築發出拆除整改命令", "禁止物業管理公司向業主收取日常清潔物業服務費", "禁止消防處救援隊員在火災危急時破門進行搜救", "禁止任何部門或個人任意或非法搜查侵入居民住宅"], "answer": 3, "explanation": "引述第29條：香港居民的住宅和其他房屋不受侵犯。禁止任意或非法搜查、侵入居民的住宅和其他房屋。"}, {"id": "gx_t6_q045", "topic": 6, "num": 45, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第三十條，在甚麼特殊法定情況下，有關機關才可依法對通訊進行檢查？", "options": ["因商業銀行推廣個人信用卡業務之日常市場調查", "因公共安全和追查刑事犯罪需要並依照法定程序", "因網絡電訊營運商隨機抽查客戶通話通訊之質量", "因地方社區組織了解居民日常家庭生活狀況之需"], "answer": 1, "explanation": "引述第30條：除因公共安全和追查刑事犯罪的需要，由有關機關依照法律程序對通訊進行檢查外，任何部門或個人不得以任何理由侵犯通訊自由和通訊秘密。"}, {"id": "gx_t6_q046", "topic": 6, "num": 46, "category": "2) 香港居民的基本權利", "q": "《基本法》第三十一條保障香港居民享有遷徙自由，其具體包含哪些內容？", "options": ["被依法限制離境之涉案嫌疑人仍可隨意出境出國", "可以在未辦理任何通關證件下任意橫越特區邊界", "有在境內遷徙移居海外旅行和出入境的各項自由", "可以隨意進入任何外國主權國家領土免辦理簽證"], "answer": 2, "explanation": "引述第31條：香港居民有境內遷徙、移居其他國家地區、旅行和出入境自由，持有效證件者除非受法律制止，可自由離開特區無需特別批准。"}, {"id": "gx_t6_q047", "topic": 6, "num": 47, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第三十二條，香港居民在宗教信仰領域享有甚麼權利？", "options": ["享有強制要求其他市民共同皈依某特定宗教之特權", "享有宗教信仰自由公開傳教舉行參加宗教活動自由", "享有在未經批準下隨意佔用公共街道舉行祭祀之權", "享有免除遵守特區所有刑法規範之宗教裁判特權"], "answer": 1, "explanation": "引述第32條：香港居民有信仰的自由；有宗教信仰的自由，有公開傳教和舉行、參加宗教活動的自由。"}, {"id": "gx_t6_q048", "topic": 6, "num": 48, "category": "2) 香港居民的基本權利", "q": "《基本法》保障的人身自由範疇中，「私隱權」具體體現在哪三個維度？", "options": ["名譽權不受批評肖像權不受拍攝收入完全不公開", "人身不受侵犯住宅不受侵犯通訊自由與通訊秘密", "商業帳戶免受審計個人歷史完全保密免受背景調查", "行蹤完全免受出入境紀錄通話記錄免受電訊公司存檔"], "answer": 1, "explanation": "表格梳理：私隱權體現為：1.人身不受侵犯；2.住宅不受侵犯；3.通訊自由和通訊秘密。"}, {"id": "gx_t6_q049", "topic": 6, "num": 49, "category": "2) 香港居民的基本權利", "q": "香港居民享有「選擇職業的自由」，這對特區自由市場經濟運作產生了甚麼推動作用？", "options": ["使各行業僱主可以隨意拒絕向僱員支付約定工資", "促使特區政府全面取消對各行業專業資格考試評定", "保障勞動力自主流動激發個人潛能並促進人才競爭", "使香港本地失業率在任何經濟波動下始終保持為零"], "answer": 2, "explanation": "職業自由保障個人依才能自主擇業，促進人力資本合理配置與公平競爭，是香港市場經濟活力的基石。"}, {"id": "gx_t6_q050", "topic": 6, "num": 50, "category": "2) 香港居民的基本權利", "q": "《基本法》保障居民的「文學藝術創作自由」，在實際生活中的積極體現是：", "options": ["允許任何人以藝術為名公然宣揚恐怖主義暴力活動", "允許在無任何牌照下隨意佔用公共道路徹夜喧嘩演奏", "禁止社會大眾對任何已發布文藝作品提出批評意見", "文藝工作者可自由創作影視小說戲劇繁榮文化市場"], "answer": 3, "explanation": "創作自由保護藝術家探索與創作，豐富香港文化多樣性，推動中外文化藝術交流中心建設。"}, {"id": "gx_t6_q051", "topic": 6, "num": 51, "category": "2) 香港居民的基本權利", "q": "根據《基本法》第八十七條，普通法刑事審訊中「保留原在香港適用的原則」，包括甚麼？", "options": ["保留古代封建宗法審判制度中採用刑訊逼供之手段", "保留所有民商事爭議由行政總督一人裁決之舊體制", "保留無罪推定原則抗辯權緘默權以及陪審團制度等", "保留外國領事法官在香港享有治外法權的歷史裁判"], "answer": 2, "explanation": "包括無罪推定、控方舉證責任、超越合理疑點標準、抗辯權、緘默權、一罪不二審及陪審團審訊等普通法程序正義原則。"}, {"id": "gx_t6_q052", "topic": 6, "num": 52, "category": "2) 香港居民的基本權利", "q": "香港居民享有「提起訴訟和獲得司法補救的權利」，這如何保護弱勢群體利益？", "options": ["當合法權益受侵害時可依法透過司法程序獲得救濟", "使弱勢群體在打官司時自動享有法庭勝訴法定優待", "使法院判決可以完全脫離法律依據隨意給予巨額賠償", "允許經濟困難人士在法庭審理時無需提交任何證據"], "answer": 0, "explanation": "司法補救權確保人人平等享有尋求法律保護的機會，防止強權欺凌弱勢，體現正義面前人人平等。"}, {"id": "gx_t6_q053", "topic": 6, "num": 53, "category": "2) 香港居民的基本權利", "q": "香港居民享有在特區境內遷徙自由，下列哪項屬於對這項權利的正確理解？", "options": ["市民可以隨意在全港各大郊野公園核心保護區搭棚定居", "市民可以未經業主許可任意搬進他人空置房屋內居住", "市民可以隨意阻斷主要公路幹線並搭建帳篷安居生活", "市民可自由選擇在特區任何區域合法租賃居住生活"], "answer": 3, "explanation": "遷徙自由保障公民在法律許可範圍內自由選擇居所與遷移，但必須遵守土地、規劃與產權等相關法律規範。"}, {"id": "gx_t6_q054", "topic": 6, "num": 54, "category": "2) 香港居民的基本權利", "q": "在香港特區，非永久性居民（如在港求學工作人士）享有哪些基本人身權利？", "options": ["享有包括人身自由私隱權信仰自由司法平等諸項權利", "享有特區行政長官與立法會選舉中的候選人被選舉權", "享有在特區政府各決策局出任常任秘書長之高級公職", "享有免除接受香港本地裁判法院任何刑事審判之特權"], "answer": 0, "explanation": "除專屬永久居民的特定政治權利（如選舉被選舉權）外，非永久居民在香港同樣依法享有人身自由、財產保護、司法平等、言論信仰等基本權利。"}, {"id": "gx_t6_q055", "topic": 6, "num": 55, "category": "2) 香港居民的基本權利", "q": "《基本法》規定保障居民享有的基本權利，在香港法律位階中處於甚麼地位？", "options": ["具有憲制性法律保障地位任何本地條例均不得抵觸", "僅屬於非強制性的道義倡議政府可隨時發通告暫停", "地位低於特區各局內部發布之一般行政指導性手冊", "完全從屬於外國商業評級機構發布之人權考核指標"], "answer": 0, "explanation": "基本法第三章規定的權利受憲制性文件保護，香港特區任何本地立法或行政決定均不得與基本法保障的權利相抵觸。"}, {"id": "gx_t6_q056", "topic": 6, "num": 56, "category": "2) 香港居民的基本權利", "q": "總結而言，基本法賦予香港居民廣泛的基本權利和自由，為香港社會提供了甚麼基石？", "options": ["提供了市民可以隨意違反法律法規而不受制裁的依據", "提供了特區政府可以完全取消所有公共治安警察的理由", "提供了保障人權維護社會公平正義與繁榮穩定的基石", "提供了商業財團壟斷所有公用事業隨意加價的法律途徑"], "answer": 2, "explanation": "廣泛而堅實的權利保障，激發了社會創造力，守護了人的尊嚴，為「一國兩制」下的長期繁榮穩定提供了制度保障。"}, {"id": "gx_t6_q057", "topic": 6, "num": 57, "category": "2) 香港居民的基本權利", "q": "《基本法》第四十一條對在香港特區境內的非香港居民權益保障作出了甚麼規定？", "options": ["非香港居民在香港境內完全不享有任何法庭審判救濟權", "非香港居民必須繳納雙倍市政稅收方可進入公共圖書館", "非香港居民在香港逗留期間一律不受特區任何法律保護", "非香港居民在香港境內依法享有基本法規定的權利自由"], "answer": 3, "explanation": "基本法第41條規定：在香港特別行政區境內的香港居民以外的其他人，依法享有本章規定的香港居民的權利和自由。"}, {"id": "gx_t6_q058", "topic": 6, "num": 58, "category": "2) 香港居民的基本權利", "q": "香港特區居民依法享有廣泛的「學術研究自由」，這一權利對特區發展高等教育的意義是：", "options": ["保障學者能獨立自主開展科學探索推動建設創科中心", "允許大專院校完全取消對學生任何形式的考試成績評定", "授權科研機構可以隨意挪用政府財政撥款炒賣私人股票", "禁止特區高校與內地及海外任何學術科研機構開展合作"], "answer": 0, "explanation": "學術研究自由為學者探索真理、追求創新提供廣闊空間，是香港高等教育保持世界一流水平與國際競爭力的關鍵制度保障。"}, {"id": "gx_t6_q059", "topic": 6, "num": 59, "category": "3) 香港居民應履行的義務與平衡", "q": "法學概念中何謂公民的「義務」（Duty）？", "options": ["指個人根據心情好壞隨機選擇履行的自發性業餘愛好", "指商業機構單方面強制消費者購買附屬商品之合約", "指市民向外國政府申請出國簽證時必須填報的個人資料", "指公民應盡之責任如道德責任以及法律責任之總和"], "answer": 3, "explanation": "重點（1）明確定義：「義務」是指「應盡之責任，如道德及法律責任」。"}, {"id": "gx_t6_q060", "topic": 6, "num": 60, "category": "3) 香港居民應履行的義務與平衡", "q": "《香港特別行政區基本法》第四十二條對守法義務作出了甚麼莊嚴規定？", "options": ["香港居民和在香港的其他人有遵守特區實行法律的義務", "香港居民只有在完全贊成某項法律時才承擔守法的義務", "在香港的外國籍人士不需要遵守香港特區任何本地法規", "香港居民只需遵守基本法無需遵守立法會制定的各條例"], "answer": 0, "explanation": "完整引用《基本法》第四十二條：「香港居民和在香港的其他人有遵守香港特別行政區實行的法律的義務。」"}, {"id": "gx_t6_q061", "topic": 6, "num": 61, "category": "3) 香港居民應履行的義務與平衡", "q": "表格明確指出，香港居民的「首要義務」是甚麼？", "options": ["遵守香港特別行政區的憲制性法律《基本法》", "每年自願向特區政府庫房捐獻個人三分之一工資收入", "精通掌握英國普通法中所有的中世紀拉丁文案例判詞", "每逢週末必須前往各社區老人中心參與無償義工勞動"], "answer": 0, "explanation": "表格載明：《基本法》是特區憲制性法律，「遵守《基本法》是香港居民的首要義務」。"}, {"id": "gx_t6_q062", "topic": 6, "num": 62, "category": "3) 香港居民應履行的義務與平衡", "q": "除了遵守特區法律外，香港居民在國家層面還負有甚麼重要責任？", "options": ["每年必須前往北京向國務院港澳辦呈交個人思想匯報材料", "尊重憲法履行公民要求關心國家發展維護國家安全榮譽利益", "主動放棄普通法賦予的所有人身自由權利改用內地行政法規", "必須熟練背誦全國所有省級人民政府頒布之地方城市條例"], "answer": 1, "explanation": "香港居民亦有責任「尊重《憲法》，及履行《憲法》對公民的要求、關心國家發展與維護國家安全、榮譽和利益」。"}, {"id": "gx_t6_q063", "topic": 6, "num": 63, "category": "3) 香港居民應履行的義務與平衡", "q": "香港市民應當遵守的香港法律體系包括多個層面，下列哪一項「不屬於」導學案所列法律範疇？", "options": ["特區憲制性法律《基本法》以及予以保留的香港原有法律", "外國議會單方面通過並要求香港特區強制執行的制裁法案", "香港特區立法會根據法定程序制定公布並生效的各項法律", "列於《基本法》附件三的全國性法律及緊急狀態全國性法律"], "answer": 1, "explanation": "香港市民應遵守的法律體系包括憲制法、原有普通法條例、立法會法律及附件三全國性法律；外國法案對香港完全無法律效力。"}, {"id": "gx_t6_q064", "topic": 6, "num": 64, "category": "3) 香港居民應履行的義務與平衡", "q": "根據《基本法》第十八條第四款，在甚麼特殊情況下，中央可命令在香港實施全國性法律？", "options": ["當香港股市恆生指數在短期內出現超過一千點劇烈下跌時", "當特區立法會因夏季休會期間暫停召開全體會議審議法案", "宣布戰爭狀態或特區發生動亂危及統一安全進入緊急狀態", "當香港出現季節性輕微流感且公立醫院候診時間超過兩小時"], "answer": 2, "explanation": "引述第18條第4款：全國人大常委會宣布戰爭狀態，或特區發生政府不能控制的危及國家統一或安全的動亂而決定特區進入緊急狀態時，中央可命令實施相關全國性法律。"}, {"id": "gx_t6_q065", "topic": 6, "num": 65, "category": "3) 香港居民應履行的義務與平衡", "q": "提到旺角行人專用區取消後街頭表演引發問題，街頭表演屬行使基本法哪項權利？", "options": ["行使《基本法》第十八條第二款實施全國性法律之特殊權利", "行使《基本法》第三十四條文學藝術創作文化活動自由", "行使《基本法》第二十五條居民在法律面前一律平等之權利", "行使《基本法》第四十三條行政長官發布行政命令之特權"], "answer": 1, "explanation": "(a)答案明確指出：市民進行街頭表演屬行使《基本法》第三十四條「文學藝術創作和其他文化活動的自由」。"}, {"id": "gx_t6_q066", "topic": 6, "num": 66, "category": "3) 香港居民應履行的義務與平衡", "q": "街頭表演者在公共街道演奏樂器，根據香港法例第228章《簡易程序治罪條例》，須履行甚麼義務？", "options": ["必須事先獲得該街道所有臨街商鋪簽名同意方可在街道奏樂", "除非得到相關當局允許並取得許可證否則不得在街道奏樂", "必須向特區政府文化體育及旅遊局繳納五萬港元商業保證金", "只要表演者不收取金錢打賞便可隨時隨地演奏任何樂器項目"], "answer": 1, "explanation": "根據《簡易程序治罪條例》（第228章），街頭表演演奏樂器應向警方申請並得到允許（履行守法義務）。"}, {"id": "gx_t6_q067", "topic": 6, "num": 67, "category": "3) 香港居民應履行的義務與平衡", "q": "街頭表演若使用擴音設備產生過大噪音，會受香港哪部法例規管？表演者應履行甚麼責任？", "options": ["受《建築物條例》規管應拆除所有舞台設備並繳納罰金", "受《噪音管制條例》規管應控制音量平衡公眾安寧權利", "受《進出口條例》規管應補交所有音響器材之關稅證明", "受《公司條例》規管應將全部打賞款項納入企業年報審計"], "answer": 1, "explanation": "噪音受《噪音管制條例》（第400章）規管；表演者應控制音量，平衡自身文化權利與其他公眾人士享有安寧的權利。"}, {"id": "gx_t6_q068", "topic": 6, "num": 68, "category": "3) 香港居民應履行的義務與平衡", "q": "根據《香港人權法案》第十六條，人人享有的發表意見自由附有特別責任及義務，法律可為哪些目的予以限制？", "options": ["為確保政府官員免受公眾批評以及增加庫房商業牌照收入", "為尊重他人權利名譽或保障國家安全公共秩序衛生風化", "為限制外國文化商品進口以及消除民間所有不同學術見解", "為推行單一官方藝術審美標準並強制全體市民參加音樂會"], "answer": 1, "explanation": "《香港人權法案》第16條規定限制必須經法律規定且為：（甲）尊重他人權利或名譽；（乙）保障國家安全或公共秩序、公共衛生或風化所必要者為限。"}, {"id": "gx_t6_q069", "topic": 6, "num": 69, "category": "3) 香港居民應履行的義務與平衡", "q": "總結，街頭表演者在行使基本法文化權利時，應當同時履行哪兩大方面的法律義務？", "options": ["應履行加入特區官方劇團組織以及宣誓效忠特定商業品牌", "應履行每週向懲教署匯報表演曲目以及放棄全部知識產權", "應履行遵守法律以及依法規定尊重他人權利維護公共秩序", "應履行免費為路過行人提供飲食以及接受全天候警務監視"], "answer": 2, "explanation": "(b)答案指出：應履行的義務包括「遵守法律」以及「依法律規定尊重其他人的權利及維護公共秩序」。"}, {"id": "gx_t6_q070", "topic": 6, "num": 70, "category": "3) 香港居民應履行的義務與平衡", "q": "在公共空間行使個人自由權利時，「尊重他人權利及維護公共秩序」對表演者提出了甚麼具體要求？", "options": ["強迫路過的行人必須停下腳步駐足鼓掌並投入至少十元硬幣", "在公共行人道上私自搭建永久性圍欄將道路改為私人收費區", "擅自驅趕在同一公共休憩花園內進行晨運或散步的其他市民", "佔用公共空間不能阻礙行人和車輛且奏樂使用揚聲器控制音量"], "answer": 3, "explanation": "不能對行人或車輛造成阻礙，奏樂使用揚聲器時控制音量，平衡文化權利與公眾享有安寧的權利。"}, {"id": "gx_t6_q071", "topic": 6, "num": 71, "category": "3) 香港居民應履行的義務與平衡", "q": "學習目標及價值觀深刻指出，關於公民「基本權利」的性質，下列哪項理解最為正確認識？", "options": ["權利並非沒有限制受法律規限同時尊重社會倫理道德標準", "基本權利是絕對無限的任何公權力或法例均不得進行約束", "法律只規定了公民的繁重義務而從不賦予人民實質的利益", "只要享有個人權利即可承擔法定義務純屬個人自願的選擇"], "answer": 0, "explanation": "價值觀明確指出：「理解權利並非沒有限制，受法律規限，同時尊重社會倫理與道德標準」，權責統一。"}, {"id": "gx_t6_q072", "topic": 6, "num": 72, "category": "3) 香港居民應履行的義務與平衡", "q": "現代法治社會中「權利和義務的平衡」關係，下列概括最為精準客觀的是哪一項？", "options": ["享有權利是履行義務的前提不履行任何義務的人享有更多權", "權利與義務相互依存公民享有自由同時必須履行法定責任", "政府只享有無限權力市民只承擔單向義務毫無權利可言", "法律賦予的各項自由權利可以作為危害國家安全正當藉口"], "answer": 1, "explanation": "權利與義務不可分割。公民充分享有權利自由的同時，必須履行守法、尊重他人權利及維護公共秩序安全義務，方能維繫社會穩定。"}, {"id": "gx_t6_q073", "topic": 6, "num": 73, "category": "3) 香港居民應履行的義務與平衡", "q": "如果一個人在公眾地方行使集會遊行權利時，故意阻塞交通、破壞公物並襲擊執法人員，其行為性質是：", "options": ["屬於受到基本法絕對保護之完全免責的正當藝術行為表達", "符合國際人權公約所倡導之無條件不受限制的政治和平集會", "純屬普通市民日常娛樂無傷大雅警察不得進行任何執法制止", "超越了法定權利邊界干犯法律破壞公共秩序須承擔刑事責任"], "answer": 3, "explanation": "行使自由必須以合法和平為前提，一旦超越法定界限破壞公共秩序、危害他人安全，即屬違法，必須承擔法律後果。"}, {"id": "gx_t6_q074", "topic": 6, "num": 74, "category": "3) 香港居民應履行的義務與平衡", "q": "公民在行使言論自由時，如果公開發布煽動分裂國家、散佈恐怖主義思想的言論，法律將如何處置？", "options": ["屬於嚴重危害國家安全的犯罪行為依法必須受到法律嚴厲制裁", "受香港人權法案絕對保護任何司法機構均不得對其起訴審判", "特區政府只能對其進行道德勸誡而不能採取任何刑事執法手續", "只要是在網絡虛擬空間匿名發表的言論法律就一律免除責任"], "answer": 0, "explanation": "言論自由受法律保護，但絕不能危害國家安全。《香港人權法案》第16條與《香港國安法》明定危害國安的言論不屬自由範疇，依法嚴懲。"}, {"id": "gx_t6_q075", "topic": 6, "num": 75, "category": "3) 香港居民應履行的義務與平衡", "q": "香港特區居民依法負有維護國家安全、榮譽和利益的義務，這一義務在現實生活中的具體體現是：", "options": ["要求所有市民必須在工作時間隨身攜帶個人資產證明與存折", "強制所有市民在私人住宅客廳安裝與警務處聯網的監控設備", "禁止香港學生報考任何外國大專院校進行正常學術知識研習", "自覺自發遵守國安法與相關法例警惕外部干涉維護社會大局"], "answer": 3, "explanation": "維護國安義務體現為自覺守法、具備國家觀念、防範化解危害國安行為，共同營造繁榮穩定的良好環境。"}, {"id": "gx_t6_q076", "topic": 6, "num": 76, "category": "3) 香港居民應履行的義務與平衡", "q": "在香港特區，一名負責任的良好公民在「行使個人基本權利」與「履行法定義務」時應抱持甚麼態度？", "options": ["只爭取個人利益最大化且盡可能採取各種手段偷逃法定義務", "具國家觀念尊重守法在法律框架內行使權利並主動承擔義務", "認為法律是統治者的工具因此在日常生活中應當盡量牴觸之", "完全不過問任何社會公共事務只專注於個人的私人經濟消費"], "answer": 1, "explanation": "價值觀明確提出：培養守法觀念及法治精神，培養具國家觀念、尊重守法和負責任的良好公民，在行使權利與履行義務時具備成熟理性態度。"}, {"id": "gx_t6_q077", "topic": 6, "num": 77, "category": "3) 香港居民應履行的義務與平衡", "q": "為什麼說「沒有無義務的權利，也沒有無權利的義務」？下列法理解釋何者最準確？", "options": ["人人履行義務才能保障人人的權利權利與義務辯證統一互為前提", "法律只會偏袒履行更多稅收義務的富裕階層保障其特權利益", "義務只是在法庭審理重大刑事訴訟時由法官口頭提出的宣傳口號", "享有權利的人不需要承擔責任承擔責任的人不需要享有各項自由"], "answer": 0, "explanation": "公民權利的享有依賴於他人和社會對義務的履行，只有每個人守法、尊重他人，個人權利與自由才能得到最切實的法律保障。"}, {"id": "gx_t6_q078", "topic": 6, "num": 78, "category": "3) 香港居民應履行的義務與平衡", "q": "總結全篇導學案，香港特區居民在《基本法》保障下享有的權利與應履行的義務，共同構成了甚麼體系？", "options": ["構成了西方宗主國對海外殖民屬地實施全面軍事管制之統治框架", "構成了「一國兩制」下特區憲制秩序人權保障與法治治理完整體系", "構成了各大跨國外資商業銀行垄斷香港特區各項公用事業之依據", "構成了地方立法會逐步取代中央人民政府行使國家主權之法理圖謀"], "answer": 1, "explanation": "基本法規定的權利與義務相輔相成，既彰顯了「兩制」下人權自由的充沛保障，又奠定了「一國」之內愛國守法的法治底線，保障特區行穩致遠。"}, {"id": "gx_t6_q079", "topic": 6, "num": 79, "category": "3) 香港居民應履行的義務與平衡", "q": "市民在社區生活中行使各項日常自由（如消閒、商業經營、文化聚會）時，應當如何處理鄰里關係？", "options": ["以個人自由至上為藉口完全忽視鄰居老人與兒童享有安寧之需求", "換位思考兼顧他人權益遵守公德秩序避免對鄰里造成噪音與阻礙", "要求所有鄰里居民必須配合自己的生活習慣調整他們的作息時間", "遇有爭議立即向各商業電視台投訴而不願透過法例與友好協商溝通"], "answer": 1, "explanation": "權利的行使必須尊重他人權利，在社區生活中注重社會倫理與道德標準，遵法守禮，共同營造和諧共融的社區生活空間。"}, {"id": "gx_t6_q080", "topic": 6, "num": 80, "category": "3) 香港居民應履行的義務與平衡", "q": "在香港特區，當個人自由權利的主張與公共秩序、公共衛生或國家安全發生衝突時，法律裁決的根本原則是甚麼？", "options": ["依據法律比例原則在保障公共重大利益前提下給予權利必要合理限制", "個人自由在任何情況下一律享有超越國家安全與公共衛生的最高效力", "一律由政府行政長官口頭命令直接取消所有涉案市民的人身自由權", "完全交由國際非政府組織派駐香港的仲裁小組進行單方面終局裁決"], "answer": 0, "explanation": "法治原則堅持比例原則（Proportionality），權利非無限制，為維護國家安全、公共秩序、公共衛生等重大利益，法律可依法作出合憲合法的必要限制。"}]</script>

const BEASTS={qingniao:['青鳥','療傷與淨化'],xiangliu:['相柳','劇毒攻擊'],jiuweihu:['九尾狐','精神攻擊'],leishen:['雷神','昏迷重擊'],yinglong:['應龍','冰凍攻擊'],jingwei:['精衛','沉默攻擊'],bian:['狴犴','嘲諷護體'],zhuyan:['朱厭','提高攻擊'],dangkang:['當康','提高防禦與療傷'],baize:['白澤','精神抵抗'],qiongqi:['窮奇','吸血'],xingtian:['刑天','低血量狂暴'],kui:['夔牛','反擊'],feiyi:['肥遺','抗毒與回春'],zhulong:['燭龍','寒暑之息・冰凍'],changyou:['長右','四耳震懾・昏迷'],wenyao:['文鰩魚','飛翼禁聲・沉默'],zheng:['猙','五尾威壓・嘲諷'],luwu:['陸吾','崑崙神威・提高攻擊'],xuangui:['旋龜','玄甲護身・提高防禦']};
const WEAPONS=[null,{name:'溯源・定海劍',type:'劍',symbol:0,hpBonus:35,atkBonus:12,defBonus:3},{name:'承憲・兩儀戟',type:'戟',symbol:1,hpBonus:25,atkBonus:10,defBonus:6},{name:'鎮域・守安槍',type:'槍',symbol:2,hpBonus:30,atkBonus:11,defBonus:4},{name:'御政・紫宸刀',type:'刀',symbol:3,hpBonus:20,atkBonus:14,defBonus:2},{name:'明律・裁衡尺',type:'尺',symbol:4,hpBonus:45,atkBonus:8,defBonus:6},{name:'同心・護民扇',type:'扇',symbol:5,hpBonus:40,atkBonus:9,defBonus:5}];
const MANUALS=[{id:'hp',name:'神農長生卷',label:'生命上限',gain:280,unit:'HP',key:'maxHp',floor:100,loss:140},{id:'mp',name:'北冥真氣卷',label:'內力上限',gain:90,unit:'MP',key:'maxMp',floor:30,loss:45},{id:'atk',name:'軒轅破陣劍譜',label:'攻擊力',gain:44,unit:'',key:'atk',floor:10,loss:22},{id:'def',name:'玄武金鐘罡氣',label:'防禦力',gain:36,unit:'',key:'def',floor:5,loss:18},{id:'eva',name:'凌波御風身法',label:'閃避率',gain:8,unit:'百分點',key:'eva',floor:0,loss:4},{id:'ult',name:'蒼龍破穹絕學',label:'必殺倍率',gain:60,unit:'百分點',key:'ultMult',floor:100,loss:30}];
const STAT_LABELS={maxHp:'生命',maxMp:'內力',atk:'攻擊',def:'防禦',eva:'閃避',ultMult:'必殺'};
const EFFECT_KEYS=['hpBonus','mpBonus','atkBonus','defBonus','evaBonus','ultBonus'];
let state=null,local={records:[],feedback:null,result:null,baseline:null,createdAt:null},page='welcome',studyPage=1,studyTopic=0,studySearch='',recordTopic=0,recordMode='all',toastTimer;
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||('gx-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const seed=()=>Math.floor(Math.random()*4294967295)||1;
function shuffle(items,s){const a=[...items];let n=s>>>0;for(let i=a.length-1;i>0;i--){n=(Math.imul(n,1664525)+1013904223)>>>0;const j=n%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function newSave(name){return {schemaVersion:'2.0-INTERACTIVE-READY',contentVersion:'3.0-TEN-SCROLLS',updatedAt:new Date().toISOString(),player:{name:name||'歸墟少俠',maxHp:600,hp:600,maxMp:160,mp:160,atk:75,def:45,eva:10,ultMult:220,beasts:{...DEFAULT_BEASTS},equipment:{weapon:null,armor:null,accessory:null,inventory:[]}},progress:{introCompleted:false,introStep:{t1:0,t2:0,t3:0,t4:0,t5:0,t6:0},solvedQuestionIds:[],bossDefeats:Object.fromEntries([...Array.from({length:10},(_,i)=>'boss_t'+(i+1)),'boss_all'].map(k=>[k,0]))},multiplayerRecord:{pvpWins:0,pvpMatches:0,coopBossClears:0,earnedRewards:[]},customExtensions:{}};}
function isObj(x){return x!==null&&typeof x==='object'&&!Array.isArray(x);}
function finite(x,min=0,max=1e12){return typeof x==='number'&&Number.isFinite(x)&&x>=min&&x<=max;}
function safeParse(text){return JSON.parse(text,(k,v)=>{if(['__proto__','constructor','prototype'].includes(k))throw Error('存檔含不支援的欄位');return v;});}
function validateSave(s){if(!isObj(s)||!isObj(s.player))throw Error('未找到原版角色資料，請選擇JSON進度檔。');const p=s.player;if(typeof p.name!=='string'||p.name.length>100)throw Error('角色名稱格式不正確。');if(!finite(p.maxHp,1))throw Error('生命值上限格式不正確。');for(const k of ['hp','maxMp','mp','atk','def','eva','ultMult'])if(k in p&&!finite(p[k]))throw Error('角色數值格式不正確：'+k);if(p.beasts&&(!isObj(p.beasts)||Object.values(p.beasts).some(v=>!finite(v,0,100000))))throw Error('異獸階級格式不正確。');if(p.equipment){if(!isObj(p.equipment))throw Error('裝備格式不正確。');if(p.equipment.inventory&&!Array.isArray(p.equipment.inventory))throw Error('背包格式不正確。');const items=[p.equipment.weapon,p.equipment.armor,p.equipment.accessory,...(p.equipment.inventory||[])].filter(Boolean);if(items.length>10000)throw Error('裝備數量超出上限。');for(const w of items){if(!isObj(w))throw Error('裝備欄位不正確。');for(const k of EFFECT_KEYS)if(k in w&&!finite(w[k]))throw Error('裝備加成格式不正確。');if(w.beastSkill&&(!isObj(w.beastSkill)||!BEASTS[w.beastSkill.key]||!Number.isInteger(w.beastSkill.level)||!finite(w.beastSkill.level,1,10)))throw Error('兵器神通格式不正確。');}}if(s.progress&&!isObj(s.progress))throw Error('原版進度格式不正確。');if(s.progress?.solvedQuestionIds&&(!Array.isArray(s.progress.solvedQuestionIds)||s.progress.solvedQuestionIds.some(q=>typeof q!=='string')))throw Error('原版答題紀錄格式不正確。');if(s.customExtensions&&!isObj(s.customExtensions))throw Error('擴充資料格式不正確。');return s;}
function normalize(s){validateSave(s);const out=clone(s),d=newSave(s.player.name);out.player={...d.player,...out.player,beasts:{...d.player.beasts,...out.player.beasts},equipment:{...d.player.equipment,...out.player.equipment}};out.progress=out.progress||d.progress;out.multiplayerRecord=out.multiplayerRecord||d.multiplayerRecord;out.customExtensions=out.customExtensions||{};return out;}
function gx(){return state.customExtensions.guixuForge;}
function freshExtension(){return {version:VERSION,heroId:uid(),gate:{seed:seed(),index:0,correct:0,completed:false,pending:null},run:null,forgeResults:[],lastReward:null};}
function validateExtension(g){if(!isObj(g)||g.version!==VERSION||!isObj(g.gate)||!Array.isArray(g.forgeResults))throw Error('歸墟進度格式或版本不相容。');const a=g.gate;if(!Number.isInteger(a.index)||!finite(a.index,0,10)||!Number.isInteger(a.correct)||!finite(a.correct,0,a.index)||!finite(a.seed,1,4294967295)||typeof a.completed!=='boolean'||(a.completed&&a.index!==10))throw Error('入門試煉進度不正確。');if(a.pending&&(!isObj(a.pending)||!Array.isArray(a.pending.choices)||a.pending.choices.length!==3||new Set(a.pending.choices).size!==3||a.pending.choices.some(x=>!MANUALS.some(m=>m.id===x))))throw Error('待領秘笈格式不正確。');if(g.run){const r=g.run;if(!isObj(r)||typeof r.id!=='string'||!Number.isInteger(r.topic)||!finite(r.topic,1,6)||!Number.isInteger(r.index)||!finite(r.index,0,30)||!Number.isInteger(r.correct)||!finite(r.correct,0,r.index)||!finite(r.seed,1,4294967295))throw Error('兵器試煉進度不正確。');}return g;}
function installSave(s){const normalized=normalize(s);if(normalized.customExtensions.guixuForge)validateExtension(normalized.customExtensions.guixuForge);else normalized.customExtensions.guixuForge=freshExtension();state=normalized;local={records:[],feedback:null,result:null,baseline:clone(state.player),createdAt:new Date().toISOString()};save();render(gx().gate.completed?'hub':'quiz');}
function save(){if(!state)return;state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify({format:'guixu-local-v1',save:state,local}));$('save-status').textContent='已儲存於本機';}catch(e){$('save-status').textContent='本機儲存失敗・請匯出進度';toast('無法寫入本機，請盡快下載進度檔。');}}
function readLocal(){try{const s=localStorage.getItem(KEY);if(!s)return null;const x=safeParse(s);if(x.format!=='guixu-local-v1')return null;normalize(x.save);validateExtension(x.save.customExtensions.guixuForge);return x;}catch(e){return null;}}
function resume(){const x=readLocal();if(!x){toast('未找到可用的本機存檔。');return;}state=normalize(x.save);local={records:[],feedback:null,result:null,baseline:clone(state.player),...x.local};render(local.result?'result':(!gx().gate.completed||gx().run||local.feedback?'quiz':'hub'));}
function createHero(){const name=$('new-name').value.trim().slice(0,30)||'歸墟少俠';confirmReplace(()=>installSave(newSave(name)));}
function confirmReplace(cb){if(state||readLocal())ask('建立另一份歸墟進度？','目前的歸墟進度將被替換。請先下載需要保留的存檔；原版的本機存檔不受影響。',cb);else cb();}
function ask(title,text,cb){showModal(`<div class="dialog-head"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="關閉">×</button></div><p class="muted">${esc(text)}</p><div class="actions"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" id="confirm-yes">確定</button></div>`);$('confirm-yes').onclick=()=>{closeModal();cb();};}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4200);}
function showModal(html,locked=false){const m=$('modal');$('modal-body').innerHTML=html;m.dataset.locked=locked?'yes':'no';if(!m.open)m.showModal();}
function closeModal(){if($('modal').dataset.locked==='yes')return;$('modal').close();}
